  next();
}

/* ---------- Downloads: save past broadcasts (VODs) and clips for offline viewing ----------
   Kick keeps a finished stream as a VOD, so that's what gets downloaded —
   no live recording. Everything is stored INSIDE the app (IndexedDB), listed
   on the Downloads screen and played back with no internet at all:
   - HLS (VODs/most clips): segments are saved one by one; on play we build a
     local playlist and hls.js reads the segments from IndexedDB through a
     custom loader.
   - Plain mp4 clips: saved as one Blob and played with <video src>. */
const DL = { job: null, db: null, thumbUrls: [] };
const DL_HOST = 'https://ls-offline.invalid/';
let dlToastTimer = null, dlLastPaint = 0;

function dlEsc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function dlBytes(n){
  if(n >= 1e9) return (n/1e9).toFixed(2) + ' GB';
  if(n >= 1e6) return (n/1e6).toFixed(1) + ' MB';
  return Math.round(n/1e3) + ' KB';
}
function dlAbs(base, rel){ try{ return new URL(rel, base).href; }catch(e){ return rel; } }

/* ---- storage ---- */
function dlDb(){
  if(!DL.db) DL.db = new Promise((res, rej) => {
    const r = indexedDB.open('livescreen_downloads', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('meta', { keyPath:'id' }); r.result.createObjectStore('seg'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => { DL.db = null; rej(r.error); };
  });
  return DL.db;
}
function idb(store, mode, fn){
  return dlDb().then(db => new Promise((res, rej) => {
    const tx = db.transaction(store, mode);
    const rq = fn(tx.objectStore(store));
    tx.oncomplete = () => res(rq ? rq.result : undefined);
    tx.onerror = tx.onabort = () => rej(tx.error);
  }));
}
async function dlPurge(id){
  try{
    await idb('seg', 'readwrite', s => s.delete(IDBKeyRange.bound(id + '/', id + '/\uffff')));
    await idb('meta', 'readwrite', s => s.delete(id));
  }catch(e){}
}

/* ---- toast + button ---- */
function dlToast(msg, o){
  const el = document.getElementById('dl-toast'); if(!el) return;
  o = o || {};
  el.className = 'show' + (o.err ? ' err' : '');
  el.style.setProperty('--p', (o.pct || 0) + '%');
  el.textContent = msg;
  clearTimeout(dlToastTimer);
  if(o.hide) dlToastTimer = setTimeout(() => { el.className = ''; }, o.hide);
}
// Offer the button only while watching an ONLINE VOD or clip (not live, not an offline copy).
function dlCanOffer(){
  const k = state.contentKind;
  return state.playerMode === 'native' && (k === 'vod' || k === 'clip') && !!state.currentMediaKey
    && state.currentPlayerUrl !== state.offlinePlaylistUrl && state.currentPlayerUrl !== state.offlineDirect;
}
function dlUpdateButton(){
  const b = document.getElementById('player-download'); if(!b) return;
  const label = DL.job ? t('dlCancel') : t('dlDownload');
  b.innerHTML = ICONS.download;
  b.title = label;
  b.setAttribute('data-label', label);
  b.classList.toggle('active', !!DL.job);
  b.style.display = dlCanOffer() || DL.job ? '' : 'none';
  updateClipButtons();
}
function dlUpdate(job, force){
  const now = Date.now();
  if(!force && now - dlLastPaint < 250) return;
  dlLastPaint = now;
  if(!job.toastShown){ job.toastShown = true; dlToast('Downloading...', { hide:3000 }); }
  dlPaintJobCard(job);
  dlUpdateButton();
}
// Live progress card at the top of the Downloads screen.
function dlJobCardHtml(job){
  const m = job.meta || {};
  const thumb = m.thumb ? `<img src="${dlEsc(m.thumb)}">` : `<div class="fallback-tile">${dlEsc((m.channel || '?').slice(0,1).toUpperCase())}</div>`;
  return `<div class="dl-item"><div class="vod-card dl-card dl-job" id="dl-job" data-nav tabindex="-1" data-dl-cancel="1">
    <div class="thumb">${thumb}<div class="grad"></div></div>
    <div class="vod-meta" id="dl-job-meta">Downloading...</div>
    ${m.title ? `<div class="vod-title">${dlEsc(m.title)}</div>` : (m.channel ? `<div class="vod-title">${dlEsc(m.channel)}</div>` : '')}
    <div class="dl-bar"><i id="dl-job-bar"></i></div>
  </div></div>`;
}
function dlPaintJobCard(job){
  const meta = document.getElementById('dl-job-meta'), bar = document.getElementById('dl-job-bar');
  if(!meta || !bar) return;
  const pct = job.total ? Math.min(100, Math.round(job.done / job.total * 100)) : 0;
  meta.textContent = 'Downloading...' + (job.state === 'prep' ? '' : ' ' + (job.total ? pct + '% \u00B7 ' : '') + dlBytes(job.bytes));
  bar.style.width = (job.total ? pct : 4) + '%';
}

/* ---- playlist parsing ---- */
function dlParseMaster(text, base){
  const lines = text.split(/\r?\n/); let best = null;
  for(let i = 0; i < lines.length; i++){
    if(!lines[i].startsWith('#EXT-X-STREAM-INF')) continue;
    const bw = parseInt((lines[i].match(/BANDWIDTH=(\d+)/) || [])[1] || '0', 10);
    let j = i + 1;
    while(j < lines.length && (!lines[j].trim() || lines[j].startsWith('#'))) j++;
    if(lines[j] && (!best || bw > best.bw)) best = { bw, url: dlAbs(base, lines[j].trim()) };
  }
  return best ? best.url : null;
}
function dlParseMedia(text, base){
  const out = { segs:[], map:null, encrypted:false };
  let dur = 0;
  for(const raw of text.split(/\r?\n/)){
    const l = raw.trim(); if(!l) continue;
    if(l.startsWith('#EXT-X-KEY')){ if(!/METHOD=NONE/.test(l)) out.encrypted = true; }
    else if(l.startsWith('#EXT-X-MAP')){ const m = l.match(/URI="([^"]+)"/); if(m) out.map = dlAbs(base, m[1]); }
    else if(l.startsWith('#EXTINF')){ dur = parseFloat(l.slice(8)) || 0; }
    else if(l[0] !== '#'){ out.segs.push({ url: dlAbs(base, l), dur }); dur = 0; }
  }
  return out;
}
async function dlFetchBuf(url, signal){
  let last;
  for(let a = 0; a < 3; a++){
    try{
      const r = await fetch(url, { signal });
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return await r.arrayBuffer();
    }catch(e){
      if(signal.aborted) throw e;
      last = e; await new Promise(r => setTimeout(r, 500 * (a + 1)));
    }
  }
  throw last;
}

/* ---- download ---- */
async function startDownload(o){
  const id = o.key;
  const m = (state.mediaMeta && state.mediaMeta[id]) || {};
  try{ if(await idb('meta', 'readonly', s => s.get(id))){ dlToast(t('dlExists'), { hide:4000 }); return; } }catch(e){}
  const ctrl = new AbortController();
  const job = { ctrl, signal:ctrl.signal, state:'prep', cancelled:false, bytes:0, done:0, total:0, meta:{ id, title:m.title, channel:o.channel, thumb:m.thumb } };
  DL.job = job; dlUpdate(job, true);
  if(state.screen === 'downloads') renderDownloads();
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  await dlPurge(id);  // leftovers from an interrupted attempt
  try{
    const first = await fetch(o.url, { signal: job.signal });
    if(!first.ok) throw new Error('HTTP ' + first.status);
    const ct = first.headers.get('content-type') || '';
    const isPlaylist = /mpegurl/i.test(ct) || /\.m3u8(\?|$)/i.test(o.url);
    const meta = { id, kind:o.kind, channel:o.channel || '', title:m.title || '', date:m.date || null, createdAt:Date.now(), direct:false, durationSec:m.durationSec || 0 };

    if(!isPlaylist){
      // a plain video file
      job.state = 'run';
      job.total = parseInt(first.headers.get('content-length') || '0', 10);
      const reader = first.body.getReader(), chunks = [];
      for(;;){
        const { done, value } = await reader.read(); if(done) break;
        chunks.push(value); job.bytes += value.length; job.done = job.bytes; dlUpdate(job);
      }
      const blob = new Blob(chunks, { type:'video/mp4' });
      await idb('seg', 'readwrite', s => s.put(blob, id + '/file'));
      meta.direct = true;
    } else {
      let text = await first.text(), mediaUrl = o.url;
      if(text.includes('#EXT-X-STREAM-INF')){
        mediaUrl = dlParseMaster(text, o.url);
        if(!mediaUrl) throw new Error('playlist');
        const r = await fetch(mediaUrl, { signal: job.signal });
        if(!r.ok) throw new Error('HTTP ' + r.status);
        text = await r.text();
      }
      const pl = dlParseMedia(text, mediaUrl);
      if(pl.encrypted) throw new Error('encrypted');
      if(!pl.segs.length) throw new Error('playlist');
      job.state = 'run'; job.total = pl.segs.length; dlUpdate(job, true);
      if(pl.map){
        const mb = await dlFetchBuf(pl.map, job.signal);
        await idb('seg', 'readwrite', s => s.put(mb, id + '/map'));
      }
      let next = 0;
      const worker = async () => {
        while(!job.signal.aborted){
          const i = next++; if(i >= pl.segs.length) return;
          const buf = await dlFetchBuf(pl.segs[i].url, job.signal);
          await idb('seg', 'readwrite', s => s.put(buf, id + '/' + i));
          job.bytes += buf.byteLength; job.done++; dlUpdate(job);
        }
      };
      try{ await Promise.all([0,1,2,3].map(worker)); }
      catch(e){ ctrl.abort(); throw e; }
      meta.segDurs = pl.segs.map(s => s.dur || 0);
      meta.hasMap = !!pl.map;
      meta.durationSec = meta.segDurs.reduce((a, b) => a + b, 0);
    }
    meta.bytes = job.bytes;
    // thumbnail for the list (best effort — may be blocked by CORS)
    if(m.thumb){
      try{ const tr = await fetch(m.thumb); if(tr.ok) meta.thumbBlob = await tr.blob(); }catch(e){}
    }
    await idb('meta', 'readwrite', s => s.put(meta));
    DL.job = null; dlUpdateButton(); if(state.screen === 'downloads') renderDownloads();
    dlToast(t('dlSaved') + ' \u00B7 ' + dlBytes(job.bytes), { hide:5000 });
  }catch(e){
    await dlPurge(id);
    DL.job = null; dlUpdateButton(); if(state.screen === 'downloads') renderDownloads();
    const name = e && e.name, msg = e && e.message;
    if(job.cancelled || name === 'AbortError') dlToast(t('dlCancelled'), { hide:3000 });
    else if(msg === 'encrypted') dlToast(t('dlEncrypted'), { err:true, hide:5000 });
    else if(name === 'QuotaExceededError') dlToast(t('dlNoSpace'), { err:true, hide:6000 });
    else { console.warn('Download failed:', e); dlToast(t('dlFail'), { err:true, hide:5000 }); }
  }
}

// The player's download button: start, or cancel the running download.
function dlToggleCurrent(){
  if(DL.job){
    if(confirm(t('dlCancelConfirm'))){ DL.job.cancelled = true; DL.job.ctrl.abort(); }
    return;
  }
  if(!dlCanOffer()){ dlToast(t('dlUnavailable'), { err:true, hide:4000 }); return; }
  startDownload({ key: state.currentMediaKey, kind: state.contentKind, url: state.currentPlayerUrl, channel: state.currentChannel });
}

/* ---- offline playback ---- */
function dlBuildPlaylist(it){
  const base = DL_HOST + encodeURIComponent(it.id) + '/';
  const target = Math.max(1, Math.ceil(it.segDurs.reduce((a, b) => Math.max(a, b), 0)));
  let s = '#EXTM3U\n#EXT-X-VERSION:' + (it.hasMap ? 7 : 3) + '\n#EXT-X-TARGETDURATION:' + target + '\n#EXT-X-MEDIA-SEQUENCE:0\n#EXT-X-PLAYLIST-TYPE:VOD\n';
  if(it.hasMap) s += '#EXT-X-MAP:URI="' + base + 'map"\n';
  it.segDurs.forEach((d, i) => { s += '#EXTINF:' + d.toFixed(3) + ',\n' + base + i + '\n'; });
  return s + '#EXT-X-ENDLIST\n';
}
// hls.js loader that serves our fake offline URLs from IndexedDB; everything else goes through the stock loader.
function dlMakeLoader(){
  const Base = Hls.DefaultConfig.loader;
  return class extends Base {
    load(ctx, cfg, cbs){
      if(ctx.url.indexOf(DL_HOST) !== 0) return super.load(ctx, cfg, cbs);
      const rest = ctx.url.slice(DL_HOST.length).split('/');
      const key = decodeURIComponent(rest[0]) + '/' + rest[1];
      const now = () => (self.performance || Date).now();
      const st = this.stats || (this.stats = { aborted:false, loaded:0, retry:0, total:0, chunkCount:0, bwEstimate:0,
        loading:{ start:0, first:0, end:0 }, parsing:{ start:0, end:0 }, buffering:{ start:0, first:0, end:0 } });
      st.loading.start = now();
      idb('seg', 'readonly', s => s.get(key)).then(async rec => {
        if(!rec) throw new Error('missing segment');
        const data = (typeof Blob !== 'undefined' && rec instanceof Blob) ? await rec.arrayBuffer() : rec;
        st.loading.first = st.loading.end = now(); st.loaded = st.total = data.byteLength;
        cbs.onSuccess({ url: ctx.url, data }, st, ctx, null);
      }).catch(e => cbs.onError({ code:404, text:String(e) }, ctx, null, st));
    }
  };
}

async function playOffline(id){
  setClipMode(false);
  let item = null;
  try{ item = await idb('meta', 'readonly', s => s.get(id)); }catch(e){}
  if(!item) return;
  if(state.settings.autoFullscreen) requestAppFullscreen();
  destroyNativePlayer();
  disconnectLiveChat();
  setScreen('player');
  state.returnScreen = 'downloads';
  state.currentChannel = item.channel;
  state.contentKind = item.kind;
  state.currentMediaKey = null;
  const wrap = document.getElementById('player-iframe-wrap');
  document.getElementById('chat-overlay').classList.remove('visible');
  const sug = document.getElementById('player-suggestions'); if(sug){ sug.innerHTML = ''; sug.style.display = 'none'; }
  const av = document.getElementById('player-avatar'); if(av){ av.style.display = 'none'; av.innerHTML = ''; }
  setStaticPlayerIcons();
  let url;
  try{
    if(item.direct){
      const blob = await idb('seg', 'readonly', s => s.get(id + '/file'));
      url = state.offlineDirect = URL.createObjectURL(blob);
    } else {
      url = state.offlinePlaylistUrl = URL.createObjectURL(new Blob([dlBuildPlaylist(item)], { type:'application/vnd.apple.mpegurl' }));
    }
  }catch(e){ wrap.innerHTML = `<div class="empty">${t('dlPlayFail')}</div>`; return; }
  fadeInEl(document.getElementById('video-stage'));
  buildNativePlayer(wrap, url, true);
  state.playerMode = 'native';
  updatePlayerButtonsVisibility();
  refreshFocusables();
  showPlayerUI();
}

/* ---- Downloads screen ---- */
function dlCardHtml(it){
  let thumb = '';
  if(it.thumbBlob){ const u = URL.createObjectURL(it.thumbBlob); DL.thumbUrls.push(u); thumb = `<img src="${u}">`; }
  else thumb = `<div class="fallback-tile">${dlEsc((it.channel || '?').slice(0,1).toUpperCase())}</div>`;
  const dur = it.durationSec ? (it.kind === 'clip' ? formatClipDuration(it.durationSec) : formatVodDuration(it.durationSec * 1000)) : '';
  const meta = [it.channel, dur, dlBytes(it.bytes || 0)].filter(Boolean).join(' \u00B7 ');
  return `<div class="dl-item">
    <div class="vod-card dl-card" data-nav tabindex="-1" data-dl-play="${dlEsc(it.id)}">
      <div class="thumb">${thumb}<div class="grad"></div></div>
      <div class="vod-meta">${dlEsc(meta)}</div>
      ${it.title ? `<div class="vod-title">${dlEsc(it.title)}</div>` : ''}
    </div>
    <div class="dl-del" data-nav tabindex="-1" data-dl-del="${dlEsc(it.id)}">${t('dlDelete')}</div>
  </div>`;
}
async function renderDownloads(){
  const grid = document.getElementById('dl-grid'), empty = document.getElementById('dl-empty'), sub = document.getElementById('dl-sub');
  if(!grid) return;
  let items = [];
  try{ items = await idb('meta', 'readonly', s => s.getAll()); }catch(e){}
  if(state.screen !== 'downloads') return;
  DL.thumbUrls.forEach(u => URL.revokeObjectURL(u)); DL.thumbUrls = [];
  items.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  const jobHtml = DL.job ? dlJobCardHtml(DL.job) : '';
  if(!items.length && !jobHtml){
    grid.innerHTML = ''; sub.textContent = '';
    empty.textContent = t('dlEmpty'); empty.style.display = 'block';
    refreshFocusables(); return;
  }
  empty.style.display = 'none';
  sub.textContent = items.length + ' \u00B7 ' + dlBytes(items.reduce((a, it) => a + (it.bytes || 0), 0));
  grid.innerHTML = jobHtml + items.map(dlCardHtml).join('');
  if(DL.job) dlPaintJobCard(DL.job);
  refreshFocusables();
}
async function dlDeleteItem(id){
  if(!confirm(t('dlDeleteConfirm'))) return;
  await dlPurge(id);
  renderDownloads();
}

/* ---------- Long-press: open a favorite channel without removing it ----------
   A plain tap on a "Following" card opens it; removing is in the long-press menu. */
let longPressTimer = null, longPressStartXY = null, longPressFired = false;

function attachLongPress(){
  return; /* v14: the long-press options menu (ctxPressStart) handles touch long-press; this old handler used to open the channel and clashed with it */
  document.addEventListener('pointerdown', e => {
    const card = e.target.closest('.card[data-channel]');
    if(!card || !card.dataset.channel) return;
    longPressFired = false;
    longPressStartXY = { x:e.clientX, y:e.clientY };
    clearTimeout(longPressTimer);
    longPressTimer = setTimeout(() => {
      longPressFired = true;
      if(navigator.vibrate) navigator.vibrate(15);
      // Single action now: open the channel (live view, or the offline
      // screen with its VODs/clips if the streamer isn't live).
      playChannel(card.dataset.channel);
    }, 550);
  });
  document.addEventListener('pointermove', e => {
    if(!longPressStartXY) return;
    const dx = e.clientX - longPressStartXY.x, dy = e.clientY - longPressStartXY.y;
    if(Math.hypot(dx, dy) > 12) clearTimeout(longPressTimer);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => {
    document.addEventListener(ev, () => clearTimeout(longPressTimer));
  });
  // Swallow the click that immediately follows a long-press so it doesn't
  // also trigger the card's normal tap action (open/remove).
  document.addEventListener('click', e => {
    if(longPressFired){ e.stopPropagation(); e.preventDefault(); longPressFired = false; }
  }, true);
}

/* ---------- Player: other live channels + the streamer's own VODs/Clips,
   all shown below the control bar while watching. ---------- */
function renderPlayerSuggestions(){
  const wrap = document.getElementById('player-suggestions');
  if(!wrap) return;
  if(!state.currentChannel){
    wrap.innerHTML = '';
    wrap.style.display = 'none';
    return;
  }
  wrap.style.display = '';
  wrap.innerHTML = `<div class="row-title" id="player-suggestions-title"></div><div id="player-suggestions-list"></div>`;
  fadeInEl(wrap);
  refreshFocusables();
  loadPlayerSuggestionsList(state.currentChannel, state.contentKind);
}

function suggestRowHtml(item){
  // item: { kind:'live'|'vod', channel, title, cat, viewers, meta, thumb, vodUuid, vodSource }
  const letter = (item.channel || '?').slice(0,1).toUpperCase();
  const viewersTxt = item.viewers != null
    ? `${fmtCompact(item.viewers)} ${t('viewersSuffix')}` : '';
  const dataAttrs = item.kind === 'vod'
    ? `data-vod="${item.vodUuid}" data-vod-channel="${item.channel}" data-vod-source="${item.vodSource ? encodeURIComponent(item.vodSource) : ''}"`
    : `data-channel="${item.channel}"`;
  return `<div class="suggest-row" data-nav tabindex="-1" ${dataAttrs}>
    <div class="thumb">
      ${item.thumb
        ? `<img src="${item.thumb}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
           <div class="fallback-tile" style="display:none;">${letter}</div>`
        : `<div class="fallback-tile">${letter}</div>`}
      ${item.kind === 'live' ? `<span class="badge dot live"></span>` : ''}
    </div>
    <div class="info">
      <div class="s-title">${item.title || item.channel}</div>
      <div class="s-channel">${item.channel}</div>
      <div class="s-meta">${[item.cat, viewersTxt || item.meta].filter(Boolean).join(' \u00B7 ')}</div>
    </div>
  </div>`;
}

// The current channel's category/language decide what counts as "related" —
// same category/language ranks first, then sorted by viewer count.
async function relatedRank(channel){
  const info = await checkExactChannel(channel);
  return {
    cat: info && info.category ? (info.category.name || '') : '',
    lang: (info && info.stream && info.stream.language) || '',
  };
}

async function loadPlayerSuggestionsList(channel, kind){
  const titleEl = document.getElementById('player-suggestions-title');
  const listEl = document.getElementById('player-suggestions-list');
  if(!listEl) return;

  if(kind === 'vod'){
    titleEl.textContent = t('suggestedVodsTitle');
    const vods = (await fetchChannelVods(channel)).filter(v => v.uuid !== state.currentVodUuid);
    if(state.currentChannel !== channel) return; // channel changed meanwhile
    vods.sort((a,b) => (b.views||0) - (a.views||0));
    listEl.innerHTML = vods.map(v => suggestRowHtml({
      kind:'vod', channel, title:v.title, thumb:v.thumb, viewers:v.views,
      meta:[formatVodDate(v.createdAt), formatVodDuration(v.durationMs)].filter(Boolean).join(' \u00B7 '),
      vodUuid:v.uuid, vodSource:v.source,
    })).join('');
  } else {
    titleEl.textContent = t('suggestedTitle');
    await ensureSuggestions();
    if(state.currentChannel !== channel) return; // channel changed meanwhile
    const { cat, lang } = await relatedRank(channel);
    if(state.currentChannel !== channel) return;
    let list = (state.lastStreams || []).filter(s => s.slug && s.slug.toLowerCase() !== channel.toLowerCase());
    list.sort((a,b) => {
      const scoreA = (lang && a.language === lang ? 2 : 0) + (cat && a.category && a.category.name === cat ? 1 : 0);
      const scoreB = (lang && b.language === lang ? 2 : 0) + (cat && b.category && b.category.name === cat ? 1 : 0);
      if(scoreA !== scoreB) return scoreB - scoreA;
      return (b.viewer_count||0) - (a.viewer_count||0);
    });
    listEl.innerHTML = list.map(s => suggestRowHtml({
      kind:'live', channel:s.slug, title:s.stream_title,
      cat: s.category ? s.category.name : '', viewers:s.viewer_count, thumb: extractThumb(s),
    })).join('');
  }
  fadeInEl(listEl);
  refreshFocusables();
}

// Fetches the "Live Now" list, used both for viewer-count lookups and to
// populate the "You might also like" row below the video while watching.
async function ensureSuggestions(){
  if(state.lastStreams && state.lastStreams.length) return;
  const token = await getToken();
  if(!token) return;
  try{
    const limit = state.settings.discoverLimit || 24;
    let q = `sort=viewer_count&limit=${limit}`;
    if(state.settings.languageFilter) q += `&language=${state.settings.languageFilter}`;
    const res = await kickApi('livestreams', q);
    if(!res.ok) return;
    const data = await res.json();
    let list = data.data || [];
    if(state.settings.hideMature) list = list.filter(s => !s.has_mature_content);
    list = list.filter(s => !isBlocked(s.slug));
    state.lastStreams = list;
  }catch(err){
    console.warn('Could not load stream list:', err);
  }
}

/* ---------- Player: auto-hide controls + suggestions (YouTube-style) ---------- */
let playerUiTimer = null;
function playerMenuOpen(){ const m = document.getElementById('quality-menu'); return !!(m && m.classList.contains('show')) || bellMenuOpen(); }
function scheduleHidePlayerUI(){
  clearTimeout(playerUiTimer);
  const v = document.getElementById('native-video');
  const keep = playerMenuOpen() || SCRUB.active || (state.playerMode === 'native' && v && v.paused);
  if(!keep) playerUiTimer = setTimeout(hidePlayerUI, 4000);   // only auto-hides while actually playing
}
function updatePlayerTitle(){

['play','playing','pause'].forEach(ev => document.addEventListener(ev, (e) => {

let KEY_REPEAT = false, REMOTE_ENTER = false;
function focusPlayerEl(id){
  const el = document.getElementById(id);

// Remote-control rules for the player (live streams, VODs and clips).
function playerKeyHandler(k, rtl, ev){
  if(state.playerMode !== 'native') return false;
  if(document.getElementById('chat-compose-overlay').classList.contains('show')) return false;
  if(document.getElementById('startup-suggestion-overlay').classList.contains('show')) return false;
  const kc = ev ? ev.keyCode : 0;
  const isBack = (k === 'Escape' || k === 'Backspace' || k === 'GoBack');
  const isFF = ['MediaFastForward','MediaTrackNext','FastForward','Forward'].indexOf(k) >= 0 || kc === 417 || kc === 228;
  const isRW = ['MediaRewind','MediaTrackPrevious','Rewind','Backward'].indexOf(k) >= 0 || kc === 412 || kc === 227;
  const isLeft = (k === 'ArrowLeft'), isRight = (k === 'ArrowRight');
  const overlay = document.getElementById('player-overlay');
  const hidden = overlay.classList.contains('ui-hidden');
  const video = document.getElementById('native-video');

  if(isClipModeOn()){
    if(isFF || isRW){ clipStep(isFF ? 5 : -5); return true; }
    if(k === 'MediaPlayPause' || k === 'MediaPlay' || k === 'MediaPause' || k === 'MediaStop' || kc === 179 || kc === 415 || kc === 19 || kc === 413){ clipTogglePlay(); return true; }
  }
  if(isFF || isRW){ scrubStep(isFF, !!(ev && ev.repeat)); return true; }

  if(SCRUB.active){                       // bar + thumbnail mode
    if(isLeft || isRight){ scrubStep(isRight, !!(ev && ev.repeat)); return true; }
    if(k === 'Enter'){ commitScrub(); return true; }
    if(isBack){ cancelScrub(); hidePlayerUI(); return true; }
    if(k === 'ArrowUp'){ cancelScrub(); hidePlayerUI(); return true; }   // Up: cancel scrubbing and hide the bar + buttons
    return true;                          // swallow down while scrubbing
  }
  if(playerMenuOpen()){ showPlayerUI(); return false; }
  if(clipKeyHandler(k, isBack, hidden)) return true;

  if(isBack){
    if(!hidden){ hidePlayerUI(); return true; }   // first Back only hides the controls
    return false;                                  // already hidden: leave the player
  }
  if(hidden){
    if(isLeft || isRight){ showPlayerUI(); focusPlayerEl('player-timeline-track'); return true; }   // 1st press: focus the bar only
    if(k === 'ArrowUp' || k === 'ArrowDown'){ showPlayerUI(); focusPlayerEl('player-playpause'); return true; }
    if(k === 'Enter'){ showPlayerUI(); focusPlayerEl('player-playpause'); return true; }   // controls hidden: OK only reveals them and focuses play/pause (no toggle)
    return false;
  }
  const cur = focusables[focusIndex];
  if(cur && cur.id === 'player-timeline-track' && k === 'ArrowUp'){ hidePlayerUI(); return true; }
  showPlayerUI();
  return false;
}

function releaseOldVideo(){

    }

}
function destroyNativePlayer(){
  releaseOldVideo();

// Streams/clips start with sound. If the browser refuses unmuted autoplay we
// fall back to muted so playback still starts (More > Volume to unmute).
function startWithSound(video){
  video.muted = false;
  const p = video.play();
  if(p && p.catch) p.catch(() => { video.muted = true; video.play().catch(()=>{}); });
}

function buildNativePlayer(wrap, url, autoplay){
  state.currentPlayerUrl = url;
  const seekTo = state.pendingSeek; state.pendingSeek = null;
  wrap.innerHTML = '<video id="native-video" playsinline preload="auto"></video>';
  const video = document.getElementById('native-video');
  video.poster = VID_BLANK;                       // hides Android's big default play-icon poster
  vidLoading(true);
  video.addEventListener('playing', () => vidLoading(false));
  video.addEventListener('loadeddata', () => { if(!video.paused || video.readyState >= 3) vidLoading(false); });
  video.addEventListener('pause', () => vidLoading(false));
  video.addEventListener('waiting', () => { if(!video.paused) vidLoading(true); });
  setTimeout(() => { if(video.isConnected && video.paused) vidLoading(false); }, 20000);
  closeQualityMenu();
  const offHls = !!url && url === state.offlinePlaylistUrl;
  if(url && url === state.offlineDirect){
    video.src = url;
    if(autoplay) startWithSound(video);
    buildQualityMenu();
  } else if(offHls && !(window.Hls && Hls.isSupported())){
    wrap.innerHTML = `<div class="empty">${t('dlNeedHls')}</div>`;
    return;
  } else if(window.Hls && Hls.isSupported()){
    const hlsCfg = { liveSyncDurationCount:3, enableWorker:true, backBufferLength:Infinity, liveBackBufferLength:Infinity, maxBufferSize:120*1000*1000 };
    if(offHls) hlsCfg.loader = dlMakeLoader();
    if(seekTo != null && seekTo > 1) hlsCfg.startPosition = seekTo;
    const hls = new Hls(hlsCfg);
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      applyDefaultQuality(hls);
      if(autoplay) startWithSound(video);
      buildQualityMenu();
    });
    hls.on(Hls.Events.LEVEL_SWITCHED, () => buildQualityMenu());
    hls.on(Hls.Events.LEVELS_UPDATED, () => buildQualityMenu());
    hls.on(Hls.Events.ERROR, (evt, data) => {
      if(data && data.fatal){
        if(offHls){ wrap.innerHTML = `<div class="empty">${t('dlPlayFail')}</div>`; return; }
        console.warn('Fatal HLS error, falling back to embed', data);
        buildIframeFallback(wrap, state.currentChannel, autoplay);
        state.playerMode = 'iframe';
        updatePlayerButtonsVisibility();
        refreshFocusables();
      }
    });
    state.hls = hls;
  } else if(video.canPlayType('application/vnd.apple.mpegurl')){
    video.src = url;
    if(autoplay) startWithSound(video);
    buildQualityMenu();
  } else {
    buildIframeFallback(wrap, state.currentChannel, autoplay);
    state.playerMode = 'iframe';
    updatePlayerButtonsVisibility();
    return;
  }
  video.playbackRate = 1;
  video.addEventListener('play', () => { updatePlayPauseIcon(true); liveSnap(false); });
  video.addEventListener('pause', () => updatePlayPauseIcon(false));
  video.addEventListener('volumechange', () => { updateMuteIcon(); if(document.getElementById('quality-menu').classList.contains('show')) buildQualityMenu(); });
  video.addEventListener('timeupdate', () => { updateGoLiveVisibility(); updateTimeline(); });
  video.addEventListener('loadedmetadata', updateTimeline);
  if(seekTo != null && seekTo > 1){
    let seeked = false;
    video.addEventListener('loadedmetadata', () => { if(seeked) return; seeked = true; try{ if(Math.abs(video.currentTime - seekTo) > 0.5) video.currentTime = seekTo; }catch(e){} });
  }
  video.addEventListener('durationchange', updateTimeline);
  updatePlayPauseIcon(false);
  updateMuteIcon();
}

/* ---------- Player: timer / scrub bar (elapsed + duration, or a live badge
   for live streams) — sits above the control row, updates on every frame
   of playback and lets the viewer tap/click anywhere on the track to seek.
   Throttled to ~4x/sec: updating the fill width and text on every single
   "timeupdate" tick (which can fire dozens of times a second) forces a
   layout recalc each time and was making playback feel choppy. */
/* ---------- Library (watch history with resume) ---------- */
state.library = (function(){ try{ return JSON.parse(localStorage.getItem('livescreen_library') || '[]'); }catch(e){ return []; } })();
function libSave(){ try{ localStorage.setItem('livescreen_library', JSON.stringify(state.library.slice(0, 80))); }catch(e){} }
function libKey(type, id){ return type + ':' + id; }
function libRecord(type, id, channel, source){
  const key = libKey(type, id);
  const meta = (state.mediaMeta || {})[key] || {};
  const old = state.library.find(x => x.key === key);
  let liveInfo = {};
  if(type === 'live'){
    const ls = (state.lastStreams || []).find(x => x.slug && x.slug.toLowerCase() === String(id).toLowerCase());
    if(ls){ try{ liveInfo = { thumb: extractThumb(ls) || '', title: ls.stream_title || '' }; }catch(e){} }
  }
  const item = Object.assign({ pos:0, dur:0 }, old || {}, {
    key, type, id, channel, source: source || (old && old.source) || '',
    title: meta.title || liveInfo.title || (old && old.title) || '', cat: meta.cat || (old && old.cat) || '', thumb: meta.thumb || liveInfo.thumb || (old && old.thumb) || '',
    dur: meta.durationSec || (old && old.dur) || 0, ts: Date.now()
  });
  state.library = [item].concat(state.library.filter(x => x.key !== key)).slice(0, 80);
  libSave();
  if(item.pos > 15 && type !== 'live') state.resumeTo = { key, pos: item.pos };
  else state.resumeTo = null;
}
state.blocked = (function(){ try{ return JSON.parse(localStorage.getItem('livescreen_blocked') || '[]'); }catch(e){ return []; } })();
function isBlocked(ch){ return !!ch && state.blocked.indexOf(String(ch).toLowerCase()) >= 0; }
function setBlocked(ch, on){
  ch = String(ch).toLowerCase();
  state.blocked = state.blocked.filter(x => x !== ch);
  if(on) state.blocked.push(ch);
  try{ localStorage.setItem('livescreen_blocked', JSON.stringify(state.blocked)); }catch(e){}
  state.lastStreams = (state.lastStreams || []).filter(x => !(x.slug && isBlocked(x.slug)));
}
let libLastSave = 0;
document.addEventListener('timeupdate', (e) => {
  const v = e.target;
  if(!v || v.id !== 'native-video' || (state.contentKind !== 'vod' && state.contentKind !== 'clip')) return;
  const now = Date.now();
  if(now - libLastSave < 5000) return;
  libLastSave = now;
  const it = state.library.find(x => x.key === state.currentMediaKey);
  if(!it) return;
  it.dur = isFinite(v.duration) ? v.duration : it.dur;
  it.pos = (it.dur && v.currentTime > it.dur - 15) ? 0 : v.currentTime;
  libSave();
}, true);
document.addEventListener('loadedmetadata', (e) => {
  const v = e.target;
  if(!v || v.id !== 'native-video' || !state.resumeTo || state.resumeTo.key !== state.currentMediaKey) return;
  try{ v.currentTime = state.resumeTo.pos; }catch(err){}
  state.resumeTo = null;
}, true);
function openLibraryItem(key){
  const it = state.library.find(x => x.key === key);
  if(!it) return;
  const fromScreen = state.screen;
  if(it.type === 'live') playChannel(it.channel);
  else if(it.type === 'vod') playVod(it.id, it.channel, it.source);
  else { state.clipQueue = (state.library || []).filter(x => x.type === 'clip').map(x => ({id:x.id, channel:x.channel, source:x.source || ''})); playClip(it.id, it.channel, it.source); }
  state.returnScreen = (fromScreen === 'discover') ? 'discover' : 'library';
}
function renderLibrary(){
  const grid = document.getElementById('lib-grid'), empty = document.getElementById('lib-empty'), clr = document.getElementById('lib-clear');
  if(!grid) return;
  document.getElementById('lib-clear-label').textContent = t('libClear');
  if(!state.library.length){
    grid.innerHTML = ''; clr.style.display = 'none';
    empty.textContent = t('libEmpty'); empty.style.display = 'block';
    refreshFocusables(); return;
  }
  empty.style.display = 'none'; clr.style.display = '';
  const esc = (x) => String(x || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const liveNow = new Set((state.lastStreams || []).map(x => String(x.slug || '').toLowerCase()));
  const shown = state.library.filter(it => it.type !== 'live' || liveNow.has(String(it.channel || '').toLowerCase()));
  grid.innerHTML = shown.map(it => {
    const tag = it.type === 'live' ? t('libLive') : it.type === 'vod' ? t('libVod') : t('libClip');
    const letter = esc((it.channel || '?').slice(0, 1).toUpperCase());
    const pct = (it.type !== 'live' && it.dur > 0 && it.pos > 0) ? Math.min(100, Math.round(it.pos / it.dur * 100)) : 0;
    const when = formatVodDate(new Date(it.ts).toISOString());
    return `<div class="lib-card" data-nav tabindex="-1" data-lib="${esc(it.key)}">
      <div class="thumb">
        <span class="lib-tag${it.type === 'live' ? ' live' : ''}">${it.type === 'live' ? '' : esc(tag)}</span>
        ${it.thumb ? `<img src="${esc(it.thumb)}" loading="lazy" onerror="this.style.display='none'">` : `<div class="fallback-tile">${letter}</div>`}
        ${pct ? `<div class="lib-prog"><i style="width:${pct}%"></i></div>` : ''}
      </div>
      <div class="lib-title">${esc(it.title || it.channel)}</div>
      <div class="lib-meta">${esc(it.channel)} \u00B7 ${esc(when)}</div>
    </div>`;
  }).join('');
  refreshFocusables();
}

function fmtCompact(n){
  n = Number(n);
  if(!isFinite(n)) return '';
  const f = (v, suf) => (v >= 10 ? String(Math.round(v)) : String(Math.round(v * 10) / 10)).replace(/\.0$/, '') + suf;
  if(n >= 1e9) return f(n / 1e9, 'B');
  if(n >= 1e6) return (Math.round(n / 1e5) / 10).toString().replace(/\.0$/, '') + 'M';
  if(n >= 1e3) return f(n / 1e3, 'K');
  return String(Math.round(n));
}

function formatClockTime(sec){
  if(!isFinite(sec) || sec < 0) sec = 0;
  sec = Math.floor(sec);
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  const mm = h > 0 ? String(m).padStart(2,'0') : String(m);
  const ss = String(s).padStart(2,'0');
  return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}

let lastTimelineUpdate = 0;
function updateTimeline(force){
  const now = (window.performance && performance.now) ? performance.now() : Date.now();
  if(!force && (now - lastTimelineUpdate) < 250) return;
  lastTimelineUpdate = now;
  const fill = document.getElementById('player-timeline-fill');
  const curEl = document.getElementById('player-time-current');
  const durEl = document.getElementById('player-time-duration');
  if(!fill || !curEl || !durEl) return;
  const video = document.getElementById('native-video');
  if(!video || state.playerMode !== 'native'){
    fill.style.width = '0%';
    curEl.textContent = '';
    durEl.textContent = '';
    return;
  }
  { const ps = document.getElementById('player-screen'); if(ps) ps.classList.toggle('is-live', state.contentKind === 'live'); }
  const { start, end } = timelineRange(video);
  const cur = SCRUB.active ? SCRUB.pos : (video.currentTime || 0);
  const span = Math.max(end - start, 0.001);
  const pct = Math.min(100, Math.max(0, ((cur - start) / span) * 100));
  fill.style.width = pct + '%';
  const knob = document.getElementById('ptl-knob');
  if(knob){ const r = document.getElementById('html-root').getAttribute('dir') === 'rtl'; knob.style.left = (r ? 100 - pct : pct) + '%'; }
  if(state.contentKind === 'live'){
    fill.style.width = '100%';                       // live: the bar is always full (pinned to the live edge)
    let elapsed = '';
    if(state.liveStartMs){
      const e = (Date.now() - state.liveStartMs) / 1000;
      if(e > 0) elapsed = formatClockTime(e);
    }
    curEl.textContent = elapsed;                     // right side: how long the stream has been running
    durEl.textContent = '';
  } else {
    curEl.textContent = formatClockTime(cur - start);
    durEl.textContent = formatClockTime(span);
  }
}

/* ---------- Scrubbing from the bar itself (remote) + thumbnail window ---------- */
const SCRUB = { active:false, pos:0, timer:null, lastKey:0, mult:1 };
const SEEKPV = { hls:null, url:null, seekT:null };

function timelineRange(video){
  let start = 0, end = 0;
  if(video.seekable && video.seekable.length){ start = video.seekable.start(0); end = video.seekable.end(video.seekable.length - 1); }
  else if(isFinite(video.duration) && video.duration > 0){ end = video.duration; }
  if(state.contentKind === 'live' && video.buffered && video.buffered.length){
    const bs = video.buffered.start(0); if(bs < start) start = bs;   // already-played buffer stays rewindable
  }
  return { start, end };
}

function destroySeekPreview(){
  clearTimeout(SEEKPV.seekT);
  if(SEEKPV.hls){ try{ SEEKPV.hls.destroy(); }catch(e){} SEEKPV.hls = null; }
  const v = document.getElementById('seek-preview-video');
  if(v){ try{ v.removeAttribute('src'); v.load(); }catch(e){} }
  SEEKPV.url = null;
  SCRUB.active = false; clearTimeout(SCRUB.timer);
  const box = document.getElementById('seek-preview');
  if(box) box.classList.remove('show');
}

function ensureSeekPreview(){
  const v = document.getElementById('seek-preview-video');
  const box = document.getElementById('seek-preview');
  if(!v || !box) return;
  const url = state.currentPlayerUrl;
  const canFrame = !!url && url !== state.offlinePlaylistUrl;
  box.classList.toggle('no-frame', !canFrame);
  if(!canFrame || SEEKPV.url === url) { if(SEEKPV.hls) SEEKPV.hls.startLoad(); return; }
  destroySeekPreview();
  SEEKPV.url = url;
  const isHls = /\.m3u8|\/proxy\?url=/i.test(url) && !(url === state.offlineDirect);
  if(isHls && window.Hls && Hls.isSupported()){
    const h = new Hls({ startLevel:0, capLevelToPlayerSize:true, maxBufferLength:6, enableWorker:true });
    h.loadSource(url); h.attachMedia(v);
    h.on(Hls.Events.MANIFEST_PARSED, () => { try{ h.currentLevel = 0; }catch(e){} });
    SEEKPV.hls = h;
  } else {
    v.src = url;
  }
}

function paintSeekPreview(){
  const box = document.getElementById('seek-preview');
  const wrap = document.getElementById('ptl-wrap');
  const video = document.getElementById('native-video');
  if(!box || !wrap || !video) return;
  const { start, end } = timelineRange(video);
  const span = Math.max(end - start, 0.001);
  const pct = Math.min(1, Math.max(0, (SCRUB.pos - start) / span));
  const rtl = document.getElementById('html-root').getAttribute('dir') === 'rtl';
  const w = wrap.clientWidth, bw = box.offsetWidth || 1;
  let left = (rtl ? 1 - pct : pct) * w - bw / 2;
  left = Math.max(0, Math.min(w - bw, left));
  box.style.left = left + 'px';
  const tEl = document.getElementById('seek-preview-time');
  if(tEl) tEl.textContent = state.contentKind === 'live'
    ? '-' + formatClockTime(end - SCRUB.pos)
    : formatClockTime(SCRUB.pos - start);
  box.classList.add('show');
  const pv = document.getElementById('seek-preview-video');
  if(pv && !box.classList.contains('no-frame')){
    clearTimeout(SEEKPV.seekT);
    SEEKPV.seekT = setTimeout(() => { try{ pv.currentTime = SCRUB.pos; }catch(e){} }, 120);
  }
}

function startScrub(video){
  if(state.contentKind === 'live'){ liveSnap(true); return; }
  SCRUB.active = true; SCRUB.pos = video.currentTime; SCRUB.wasPlaying = !video.paused;
  video.pause();
  document.getElementById('player-screen').classList.add('scrubbing');
  const ov = document.getElementById('player-overlay'); if(ov) ov.classList.remove('ui-hidden');
  clearTimeout(playerUiTimer);
  ensureSeekPreview();
  const track = document.getElementById('player-timeline-track');
  if(track) refreshFocusables(track);
}
function endScrub(){
  SCRUB.active = false; SCRUB.holdStart = 0;
  document.getElementById('player-screen').classList.remove('scrubbing');
  const box = document.getElementById('seek-preview'); if(box) box.classList.remove('show');
  if(SEEKPV.hls) SEEKPV.hls.stopLoad();
}
// forward: true = ahead, false = back. repeat: key is being held down.
function scrubStep(forward, repeat){
  const video = document.getElementById('native-video');
  if(!video || state.playerMode !== 'native') return;
  if(state.contentKind === 'live'){ liveSnap(true); return; }   // live: no rewind/forward, always back to the live edge
  const { start, end } = timelineRange(video);
  if(end - start <= 0) return;
  const now = Date.now();
  let step = 10;
  if(repeat){
    if(!SCRUB.holdStart) SCRUB.holdStart = now;
    const held = now - SCRUB.holdStart;
    const delta = Math.min(now - (SCRUB.lastRep || now), 300);
    SCRUB.lastRep = now;
    if(held < 500) return;                                          // short holds count as one tap
    // long press: 60s of video per second held (0.5-1s), 180s (1-2s), 600s (2s+)
    const rate = held < 1000 ? 60 : held < 2000 ? 180 : 600;
    step = rate * delta / 1000;
  } else { SCRUB.holdStart = now; SCRUB.lastRep = now; }
  if(!SCRUB.active) startScrub(video);
  SCRUB.pos = Math.min(end, Math.max(start, SCRUB.pos + (forward ? step : -step)));
  updateTimeline(true);
  paintSeekPreview();
}
function commitScrub(){
  if(!SCRUB.active) return;
  const video = document.getElementById('native-video');
  const pos = SCRUB.pos, was = SCRUB.wasPlaying;
  endScrub();
  if(video){ video.currentTime = pos; if(was) video.play().catch(()=>{}); }
  updateTimeline(true);
  updateGoLiveVisibility();
  showPlayerUI();
}
function cancelScrub(){
  if(!SCRUB.active) return;
  const video = document.getElementById('native-video');
  const was = SCRUB.wasPlaying;
  endScrub();
  if(video && was) video.play().catch(()=>{});
  updateTimeline(true);
}

function seekToTimelineEvent(e){
  cancelScrub();
  const video = document.getElementById('native-video');
  const track = document.getElementById('player-timeline-track');
  if(!video || !track) return;
  const rect = track.getBoundingClientRect();
  if(!rect.width) return;
  const clientX = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
  let ratio = (clientX - rect.left) / rect.width;
  const rtl = document.getElementById('html-root').getAttribute('dir') === 'rtl';
  if(rtl) ratio = 1 - ratio;
  ratio = Math.min(1, Math.max(0, ratio));
  const { start, end } = timelineRange(video);
  video.currentTime = start + ratio * (end - start);
  showPlayerUI();
  updateTimeline(true);
  updateGoLiveVisibility();
}

/* ---------- Player: quality + playback-speed menu (the settings/gear
   button next to mute). Quality switching only works with the hls.js
   engine (the native <video>/iframe fallbacks have no per-rendition
   control), but speed always works since it's a plain <video> property. */
const SPEED_OPTIONS = [0.5, 0.75, 1, 1.25, 1.5, 2];

function applyDefaultQuality(hls){
  const target = state.settings.defaultQuality;
  if(!target || offlineSkipQuality() || !hls.levels || !hls.levels.length) return;
  let best = -1, bestH = -1;
  hls.levels.forEach((l, i) => { if(l.height && l.height <= target && l.height > bestH){ best = i; bestH = l.height; } });
  if(best < 0){ // nothing at or below target: take the lowest available
    let lowH = Infinity;
    hls.levels.forEach((l, i) => { if(l.height && l.height < lowH){ lowH = l.height; best = i; } });
  }
  if(best >= 0) hls.currentLevel = best;
}
function offlineSkipQuality(){ return !!state.offlinePlaylistUrl && state.currentPlayerUrl === state.offlinePlaylistUrl; }

state.moreView = 'main';
function levelLabel(lvl){
  if(!lvl) return '';
  const fps = Math.round(parseFloat((lvl.attrs && lvl.attrs['FRAME-RATE']) || lvl.frameRate || 0));
  if(lvl.height) return lvl.height + 'p' + (fps > 30 ? fps : '');
  return Math.round((lvl.bitrate || 0)/1000) + 'kbps';
}
function curQualityLabel(){
  if(state.hls && state.hls.levels && state.hls.levels.length){
    const c = state.hls.currentLevel;
    const lbl = (c >= 0 && state.hls.levels[c]) ? levelLabel(state.hls.levels[c]) : '';
    if(state.hls.autoLevelEnabled) return t('qualityAuto') + (lbl ? ' (' + lbl + ')' : '');
    if(lbl) return lbl;
  }
  return t('qualityAuto');
}
function curVolumeLabel(){
  const v = document.getElementById('native-video');
  if(!v || v.muted || v.volume === 0) return t('mute');
  return Math.round(v.volume * 100) + '%';
}
function LT(en, ar){ return state.settings.lang === 'ar' ? ar : en; }
function qmEsc(x){ const d = document.createElement('div'); d.textContent = x == null ? '' : String(x); return d.innerHTML; }
function qmRowMain(view, icon, title, val){
  return `<div class="qm-row" data-nav tabindex="-1" data-more-view="${view}"><span class="qm-ico">${icon}</span><span class="qm-txt"><span class="qm-t">${title}</span>${val ? `<span class="qm-v">${val}</span>` : ''}</span><span class="qm-chev">${ICONS.chevron}</span></div>`;
}
function qmRowOpt(attrs, label, active){
  return `<div class="qm-row opt${active ? ' active' : ''}" data-nav tabindex="-1" ${attrs}><span class="qm-t">${label}</span>${active ? `<span class="qm-check">${ICONS.check}</span>` : ''}</div>`;
}
function speedText(r){ return Math.abs(r - 1) < 0.001 ? LT('Normal', 'عادية') : r + 'x'; }
function playerDescText(){
  let d = '';
  if(state.contentKind === 'live'){
    const ls = (state.lastStreams || []).find(x => x.slug && x.slug.toLowerCase() === String(state.currentChannel || '').toLowerCase());
    d = state.liveTitle || (ls && ls.stream_title) || '';
  } else {
    const m = (state.mediaMeta || {})[state.currentMediaKey];
    const it = (state.library || []).find(x => x.key === state.currentMediaKey);
    d = (m && m.title) || (it && it.title) || '';
  }
  return d;
}
function buildQualityMenu(){
  const list = document.getElementById('quality-list');
  const title = document.getElementById('quality-menu-title');
  const menu = document.getElementById('quality-menu');
  if(!list) return;
  menu.dir = state.settings.lang === 'ar' ? 'rtl' : 'ltr';
  const view = state.moreView || 'main';
  const video = document.getElementById('native-video');
  const live = state.contentKind === 'live';
  const hasLevels = !!(state.hls && state.hls.levels && state.hls.levels.length);
  let html = '', head = '';
  if(view === 'main'){
    head = LT('Settings', 'الإعدادات');
    html += qmRowMain('quality', ICONS.qQuality, LT('Quality', 'الجودة'), curQualityLabel());
    html += qmRowMain('captions', ICONS.qCc, LT('Captions', 'الترجمة'), LT('Unavailable', 'غير متاحة'));
    if(live) html += qmRowMain('chat', ICONS.chat, LT('Chat', 'الشات'), state.settings.showChat ? LT('On', 'تشغيل') : LT('Off', 'إيقاف'));
    html += qmRowMain('volume', ICONS.qVol, LT('Volume', 'الصوت'), curVolumeLabel());
    if(!live) html += qmRowMain('speed', ICONS.qSpeed, LT('Speed', 'السرعة'), speedText(video ? video.playbackRate : 1));
    html += qmRowMain('description', ICONS.qInfo, LT('Description', 'الوصف'), '');
  } else if(view === 'quality'){
    head = LT('Quality', 'الجودة');
    const auto = !hasLevels || state.hls.autoLevelEnabled;
    const cur = hasLevels ? state.hls.currentLevel : -1;
    const playing = (hasLevels && cur >= 0) ? levelLabel(state.hls.levels[cur]) : '';
    html += qmRowOpt('data-quality-level="-1"', t('qualityAuto') + (auto && playing ? ' (' + playing + ')' : ''), auto);
    if(hasLevels){
      html += state.hls.levels.map((lvl, i) => ({ i, h: lvl.height || 0, b: lvl.bitrate || 0, lbl: levelLabel(lvl) }))
        .sort((a, b) => (b.h - a.h) || (b.b - a.b))
        .map(o => qmRowOpt('data-quality-level="' + o.i + '"', o.lbl, !auto && cur === o.i)).join('');
    }
  } else if(view === 'captions'){
    head = LT('Captions', 'الترجمة');
    html += qmRowOpt('data-noop', LT('Unavailable', 'غير متاحة'), false);
  } else if(view === 'chat'){
    head = LT('Chat', 'الشات');
    const on = !!state.settings.showChat;
    html += qmRowOpt('data-chat-set="on"', LT('On', 'تشغيل'), on);
    html += qmRowOpt('data-chat-set="off"', LT('Off', 'إيقاف'), !on);
  } else if(view === 'volume'){
    head = LT('Volume', 'الصوت');
    const muted = !video || video.muted || video.volume === 0;
    const vol = video ? Math.round(video.volume * 100) : 100;
    html += [100, 75, 50, 25].map(v => qmRowOpt('data-vol="' + v + '"', v + '%', !muted && vol === v)).join('');
  } else if(view === 'speed'){
    head = LT('Speed', 'السرعة');
    const curRate = video ? video.playbackRate : 1;
    html += SPEED_OPTIONS.map(r => qmRowOpt('data-speed="' + r + '"', speedText(r), Math.abs(curRate - r) < 0.001)).join('');
  } else if(view === 'description'){
    head = LT('Description', 'الوصف');
    const d = playerDescText();
    html += `<div class="qm-row opt desc" data-nav tabindex="-1" data-noop dir="auto"><span class="qm-t">${d ? qmEsc(d) : LT('Unavailable', 'غير متاح')}</span></div>`;
  }
  if(title) title.textContent = head;
  list.innerHTML = html;
  if(menu.classList.contains('show')) refreshFocusables();
}

function qmFocusStart(from){
  const list = document.getElementById('quality-list');
  let target = null;
  if(state.moreView === 'main'){
    target = (from && from !== 'main') ? list.querySelector('[data-more-view="' + from + '"]') : null;
    target = target || list.querySelector('[data-nav]');
  } else {
    target = list.querySelector('.active') || list.querySelector('[data-nav]');
  }
  if(target) refreshFocusables(target);
}

function openMoreView(v){
  const from = state.moreView;
  state.moreView = v || 'main';
  buildQualityMenu();
  qmFocusStart(from);
}

function setVolumeLevel(v){
  const video = document.getElementById('native-video');
  if(!video) return;
  v = parseInt(v, 10);
  if(v <= 0){ video.muted = true; }
  else { video.muted = false; video.volume = v / 100; }
  buildQualityMenu();
}

function toggleQualityMenu(view){
  const menu = document.getElementById('quality-menu');
  if(!menu) return;
  if(menu.classList.contains('show')){ closeQualityMenu(); return; }
  closeBellMenu();
  state.moreView = view || 'main';
  buildQualityMenu();
  menu.classList.add('show');
  { const vs = document.getElementById('video-stage'); if(vs) vs.classList.add('settings-open'); }
  showPlayerUI();
  qmFocusStart(null);
}

function closeQualityMenu(){
  const menu = document.getElementById('quality-menu');
  if(!menu || !menu.classList.contains('show')) return;
  menu.classList.remove('show');
  { const vs = document.getElementById('video-stage'); if(vs) vs.classList.remove('settings-open'); }
  state.moreView = 'main';
  const gear = document.getElementById('player-gear');
  if(state.screen === 'player' && gear && isNavVisible(gear)) refreshFocusables(gear); else refreshFocusables();
}

/* ---------- Follow ("+") capsule, bell menu, prev/next ---------- */
const BELL_KEY = 'livescreen_bell';
function bellMap(){ try{ return JSON.parse(localStorage.getItem(BELL_KEY) || '{}') || {}; }catch(e){ return {}; } }
function bellLevel(ch){ return bellMap()[String(ch || '').toLowerCase()] || 'custom'; }
function setBellLevel(ch, v){ const m = bellMap(); m[String(ch || '').toLowerCase()] = v; try{ localStorage.setItem(BELL_KEY, JSON.stringify(m)); }catch(e){} }
function bellMenuOpen(){ const m = document.getElementById('bell-menu'); return !!(m && m.classList.contains('show')); }
function buildBellMenu(){
  const m = document.getElementById('bell-menu'); if(!m) return;
  m.dir = state.settings.lang === 'ar' ? 'rtl' : 'ltr';
  const cur = bellLevel(state.currentChannel);
  const row = (key, icon, label, cls) => `<div class="bm-row${cls ? ' ' + cls : ''}" data-nav tabindex="-1" data-bell="${key}"><span class="bm-ico">${icon}</span><span class="bm-t">${label}</span>${cur === key ? `<span class="bm-check">${ICONS.check}</span>` : ''}</div>`;
  m.innerHTML =
    row('all', ICONS.bellRing, LT('All', 'الكلّ')) +
    row('custom', ICONS.bellOutline, LT('Personalized', 'مخصّصة')) +
    row('none', ICONS.bellOff, LT('None', 'عدم تلقّي أي إشعارات')) +
    row('unfollow', ICONS.userX, LT('Unfollow', 'إلغاء الاشتراك'), 'danger');
}
function openBellMenu(){
  const m = document.getElementById('bell-menu'); if(!m) return;
  closeQualityMenu();
  buildBellMenu();
  m.classList.add('show');
  showPlayerUI();
  const first = m.querySelector('[data-bell="' + bellLevel(state.currentChannel) + '"]') || m.querySelector('[data-nav]');
  if(first) refreshFocusables(first);
}
function closeBellMenu(refocus){
  const m = document.getElementById('bell-menu');
  if(!m || !m.classList.contains('show')) return;
  m.classList.remove('show');
  const b = document.getElementById('player-fav');
  if(state.screen === 'player' && b && isNavVisible(b)) refreshFocusables(b); else refreshFocusables();
}
function bellChoose(v){
  const ch = state.currentChannel; if(!ch) return;
  if(v === 'unfollow'){
    removeFavorite(ch);
    closeBellMenu();
    updateFavIcon();
    const b = document.getElementById('player-fav'); if(b) refreshFocusables(b);
    return;
  }
  setBellLevel(ch, v);
  closeBellMenu();
}
function followBtnClick(){
  const ch = state.currentChannel; if(!ch) return;
  const btn = document.getElementById('player-fav'), cap = document.getElementById('follow-cap');
  if(!btn) return;
  if(state.favorites.includes(ch)){ openBellMenu(); return; }
  if(btn.dataset.anim) return;
  addFavorite(ch);
  if(!bellMap()[ch.toLowerCase()]) setBellLevel(ch, 'custom');
  btn.dataset.anim = '1';
  btn.classList.add('done');
  btn.innerHTML = ICONS.check;                          // "+" turns into a check mark first
  setTimeout(() => {
    delete btn.dataset.anim;
    btn.classList.remove('done');
    if(cap) cap.classList.add('split');                 // capsule splits: logo + bell
    updateFavIcon();
    btn.classList.add('shake');
    setTimeout(() => btn.classList.remove('shake'), 700);
    if(state.screen === 'player') refreshFocusables(btn);
  }, 650);
}

function playerPrev(){

  if(v){ try{ v.currentTime = 0; }catch(e){} }

function setQualityLevel(levelIndex){

function setPlaybackSpeed(rate){

/* ---------- Player: seek controls (video/live stream/VOD/clip) ---------- */
function seekBy(delta){
  if(isClipModeOn()){ clipStep(delta < 0 ? -5 : 5); return; }
  const video = document.getElementById('native-video');
  if(!video) return;
  if(state.contentKind === 'live'){ liveSnap(true); return; }
  let target = video.currentTime + delta;
  const rg = timelineRange(video);
  if(target < rg.start) target = rg.start;
  if(rg.end > 0 && target > rg.end) target = rg.end;
  video.currentTime = target;
  showPlayerUI();
  updateGoLiveVisibility();
}

// Live streams stay on the live edge: any seek is ignored and playback returns to the latest frame.
function liveSnap(force){
  const video = document.getElementById('native-video');
  if(!video || state.contentKind !== 'live') return;
  let end = null;
  if(video.seekable && video.seekable.length) end = video.seekable.end(video.seekable.length - 1);
  if(end != null && (force || end - video.currentTime > 3) && end - video.currentTime > 1.5){ try{ video.currentTime = end; }catch(e){} }
  if(video.paused && force && false) video.play().catch(()=>{});
}
function goLive(){
  const video = document.getElementById('native-video');
  if(!video) return;
  let end = null;
  if(video.seekable && video.seekable.length) end = video.seekable.end(video.seekable.length - 1);
  else if(isFinite(video.duration)) end = video.duration;
  if(end != null) video.currentTime = end;
  if(video.paused) video.play().catch(()=>{});
  showPlayerUI();
  updateGoLiveVisibility();
}

// Shows the "Back to Live" pill only while watching a live stream (not a
// VOD or clip) AND the viewer has rewound far enough behind the live edge.
let goLiveVisible = false;
function updateGoLiveVisibility(){
  const btn = document.getElementById('player-golive');
  if(!btn) return;
  let show = false;
  if(state.playerMode === 'native' && state.contentKind === 'live'){
    const video = document.getElementById('native-video');
    if(video && video.seekable && video.seekable.length){
      const end = video.seekable.end(video.seekable.length - 1);
      show = (end - video.currentTime) > 8;
    }
  }
  if(show !== goLiveVisible){
    goLiveVisible = show;
    btn.classList.toggle('show', show);
    if(state.screen === 'player') refreshFocusables();
  }
}

async function playChannel(channel){
  if(state.currentChannel && state.currentChannel !== channel && state.contentKind === 'live') state.prevChannel = state.currentChannel;
  setClipMode(false);
  if(state.screen !== 'player' && state.screen) state.returnScreen = state.screen;
  // Request fullscreen immediately, still inside the click's user-gesture
  // stack (before any "await" below breaks it) — otherwise browsers silently
  // refuse the fullscreen request once we're back from an async call.
  if(state.settings.autoFullscreen) requestAppFullscreen();
  fadeInEl(document.getElementById('video-stage'));
  state.currentChannel = channel;
  const infoP = fetchPlaybackInfo(channel);      // start the lookup before any other work
  state.contentKind = 'live';
  state.liveTitle = '';
  try{ localStorage.setItem('livescreen_last_channel', channel); }catch(e){}
  logWatchHistory(channel);
  libRecord('live', channel, channel);
  destroyNativePlayer();
  const wrap = document.getElementById('player-iframe-wrap');
  wrap.innerHTML = `<div class="empty">${t('loading')}</div>`;
  const chatOverlay = document.getElementById('chat-overlay');
  chatOverlay.classList.toggle('visible', !!state.settings.showChat);
  wireChatScrollTracking();
  { let chatDone = false; const startChat = () => { if(chatDone) return; chatDone = true; if(state.currentChannel === channel && state.screen === 'player') connectLiveChat(channel); };
    setTimeout(startChat, 3500);
    const bindPlaying = (n) => { const v = document.getElementById('native-video'); if(v){ v.addEventListener('playing', () => setTimeout(startChat, 400), { once:true }); } else if(n < 40) setTimeout(() => bindPlaying(n + 1), 250); };
    bindPlaying(0); }
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('player-screen').scrollTop = 0;
  document.getElementById('player-screen').classList.add('active');
  document.getElementById('app').classList.add('player-active');
  state.screen = 'player';
  pushPlayerHistory();
  state.playerMode = null;
  setStaticPlayerIcons();
  const avatarElReset = document.getElementById('player-avatar');
  if(avatarElReset){ avatarElReset.style.display = 'none'; avatarElReset.innerHTML = ''; }
  const chatBtn = document.getElementById('toggle-chat');
  if(chatBtn) chatBtn.classList.toggle('active', !!state.settings.showChat);
  updateViewersCount();
  updatePlayerButtonsVisibility();
  renderPlayerSuggestions();
  ensureSuggestions().then(updateViewersCount);
  showPlayerUI();
  focusIndex = 0;
  refreshFocusables();
  { const firstCtl = Array.from(document.querySelectorAll('#player-screen [data-nav]')).find(isNavVisible); if(firstCtl) refreshFocusables(firstCtl); }

  const info = await infoP;
  if(state.currentChannel !== channel || state.screen !== 'player') return; // channel changed / user already left

  state.avatarCache[channel.toLowerCase()] = (info && info.avatar) || null;
  { const li = state.library.find(x => x.key === libKey('live', channel)); if(li && !li.thumb && info && info.avatar){ li.thumb = info.avatar; libSave(); } }
  const avatarEl = document.getElementById('player-avatar');
  if(avatarEl){
    if(info && info.avatar){
      avatarEl.innerHTML = `<img src="${info.avatar}" loading="lazy">`;
      avatarEl.setAttribute('data-label', t('openChannel'));
      avatarEl.style.display = '';
    } else {
      avatarEl.style.display = 'none';
    }
  }

  state.liveStartMs = (info && info.startMs) || null;
  state.liveTitle = (info && info.title) || '';
  if(info && info.playbackUrl){
    state.playerMode = 'native';
    buildNativePlayer(wrap, info.playbackUrl, state.settings.autoplay);
  } else if(info && info.isLive === false){
    state.playerMode = 'offline';
    openChannelPage(channel, { noResume:true, offline:true });
    return;
  } else {
    state.playerMode = 'iframe';
    buildIframeFallback(wrap, channel, state.settings.autoplay);
  }
  updatePlayerButtonsVisibility();
  refreshFocusables();
  if(state.playerMode !== 'offline') showPlayerUI();
  else {
    clearTimeout(playerUiTimer);
    const overlay = document.getElementById('player-overlay');
    if(overlay) overlay.classList.add('ui-hidden');
    if(state.settings.autoFullscreen) exitAppFullscreen();
  }
}

function requestAppFullscreen(){
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if(req){ req.call(el).catch(()=>{}); }
}
function exitAppFullscreen(){
  const isFs = document.fullscreenElement || document.webkitFullscreenElement;
  if(isFs){
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if(exit) exit.call(document).catch(()=>{});
  }
}

/* ---------- Kick account login (OAuth 2.1 + PKCE) ----------
   Kick's token endpoint requires a client_secret even with PKCE, so the
   secret is never placed in this file — it lives only as a Netlify
   environment variable, used server-side by netlify/functions/kick-auth.js.
   This file only ever handles the public client_id + short-lived tokens. */
const KICK_AUTH_URL = 'https://id.kick.com/oauth/authorize';
const KICK_FN = '/.netlify/functions/kick-auth';
function editKickClientId(){
  const val = prompt(t('kickClientIdLabel') + ':', state.kickClientId || '');
  if(val !== null){
    state.kickClientId = val.trim();
    localStorage.setItem('livescreen_kick_client_id', state.kickClientId);
    renderSettings();
  }
}

function b64url(bytes){
  return btoa(String.fromCharCode(...new Uint8Array(bytes)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function kickPkcePair(){
  const verifierBytes = crypto.getRandomValues(new Uint8Array(32));
  const verifier = b64url(verifierBytes);
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  return { verifier, challenge: b64url(digest) };
}
function kickRedirectUri(){ return location.origin + location.pathname; }
function loadKickAuth(){
  try{ return JSON.parse(localStorage.getItem('kickAuth') || 'null'); }catch(e){ return null; }
}
function saveKickAuth(auth){ localStorage.setItem('kickAuth', JSON.stringify(auth)); try{ window.lsAuthUpdate && window.lsAuthUpdate(auth); }catch(e){} }
function clearKickAuth(){
  localStorage.removeItem('kickAuth');
  try{ window.lsAccountRemoveActive && window.lsAccountRemoveActive(); }catch(e){}
  try{ syncReset(); }catch(e){}
  state.kickUser = null;
  renderKickAuthUI();
}
async function startKickLogin(){
  if(!state.kickClientId){ alert(t('kickNoClientId')); return; }
  const { verifier, challenge } = await kickPkcePair();
  const st = b64url(crypto.getRandomValues(new Uint8Array(16)));
  sessionStorage.setItem('kickPkceVerifier', verifier);
  sessionStorage.setItem('kickPkceState', st);
  const url = new URL(KICK_AUTH_URL);
  url.searchParams.set('response_type','code');
  url.searchParams.set('client_id', state.kickClientId);
  url.searchParams.set('redirect_uri', kickRedirectUri());
  url.searchParams.set('scope','user:read chat:write channel:read channel:write channel:rewards');
  url.searchParams.set('code_challenge', challenge);
  url.searchParams.set('code_challenge_method','S256');
  url.searchParams.set('state', st);
  location.href = url.toString();
}
async function handleKickCallback(){
  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  const st = params.get('state');
  if(!code) return;
  const savedState = sessionStorage.getItem('kickPkceState');
  const verifier = sessionStorage.getItem('kickPkceVerifier');
  history.replaceState({}, '', location.pathname);
  if(!verifier || st !== savedState) return;
  try{
    const r = await fetch(`${KICK_FN}?action=token`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ code, code_verifier: verifier, redirect_uri: kickRedirectUri() })
    });
    const data = await r.json();
    if(data && data.access_token){
      saveKickAuth({ ...data, obtained_at: Date.now() });
      await fetchKickProfile();
    }
  }catch(e){ /* silent — user can just retry login */ }
}
async function fetchKickProfile(){
  const auth = loadKickAuth();
  if(!auth || !auth.access_token) return;
  try{
    const r = await fetch(`${KICK_FN}?action=me`, {
      headers:{ 'Authorization': `Bearer ${auth.access_token}` }
    });
    const data = await r.json();
    state.kickUser = (data && data.data && data.data[0]) ? data.data[0] : (data && data.data) || data || null;
    try{ window.lsAccountSync && window.lsAccountSync(); }catch(e){}
  }catch(e){ state.kickUser = null; }
  renderKickAuthUI();
}
function renderKickAuthUI(){
  renderNavAccount();
  const valEl = document.getElementById('set-kick-login-val');
  if(!valEl) return;
  if(state.kickUser && (state.kickUser.username || state.kickUser.name)){
    valEl.textContent = state.kickUser.username || state.kickUser.name;
  } else {
    valEl.textContent = t('kickLoginBtn');
  }
}

function wireBackgroundAudio(){
