async function pollFavoritesLive(){
  if(!state.favorites.length) return;
  const token = await getToken();
  if(!token) return;
  try{
    const qs = state.favorites.map(c => 'slug=' + encodeURIComponent(c)).join('&');
    const res = await kickApi('channels', qs);
    if(!res.ok) return;
    const data = await res.json();
    (data.data || []).forEach(ch => {
      const key = (ch.slug || '').toLowerCase();
      if(!key) return;
      const isLive = !!(ch.stream && ch.stream.is_live);
      if(isLive && ch.stream.language) noteLang(key, ch.stream.language);
      const wasLive = state.knownLiveStatus[key];
      state.knownLiveStatus[key] = isLive;
      // only alert on a real offline -> live transition, and not for the stream
      // currently being watched (no point notifying about what's already on screen)
      if(isLive && wasLive === false && state.currentChannel !== key){
        pushLiveAlert(key, {
          // Kick's /channels endpoint never puts a thumbnail on `stream` (only
          // is_live/viewer_count/start_time/language live there) — the only
          // real image it gives us here is the category art, so use that.
          thumb: extractThumb(ch.category),
          title: ch.stream.stream_title || '',
          viewers: ch.stream.viewer_count,
        });
      }
    });
  }catch(err){ /* silent — alerts are best-effort */ }
}

function setupFavoritesLivePolling(){
  clearInterval(state.favLiveTimer);
  state.favLiveTimer = setInterval(pollFavoritesLive, 45000);
  pollFavoritesLive();
}

/* ---------- Search / keyboard ---------- */
const KB_EN = 'abcdefghijklmnopqrstuvwxyz'.split('');
const KB_AR = 'ابتثجحخدذرزسشصضطظعغفقكلمنهويءةىؤئ'.split('');
const KB_SYM = ['_', '.', '-', '#'];
const KB_NUM = '1234567890'.split('');
const GLOBE_ICON = '<svg viewBox="0 0 24 24" width="1.7vw" height="1.7vw" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.7 3.9 5.7 3.9 9s-1.3 6.3-3.9 9c-2.6-2.7-3.9-5.7-3.9-9S9.4 5.7 12 3z"/></svg>';
function kbLang(){ if(!state.kbLang){ try{ state.kbLang = localStorage.getItem('livescreen_kb') || 'en'; }catch(e){ state.kbLang = 'en'; } } return state.kbLang; }
function renderKeyboard(){
  document.getElementById('search-val').textContent = state.searchVal || '\u00A0';

  html += `<div class="key" style="grid-column:span 2" data-nav tabindex="-1" data-key="__back" aria-label="${t('del')}">\u232B</div>`;

async function loadLiveListForSearch(){

function keepFocusRefresh(){ refreshFocusables(focusables[focusIndex]); }

// v47: channels you searched for / opened from search (newest first)
function recentSearches(){ if(!state.recentSearch){ try{ state.recentSearch = JSON.parse(localStorage.getItem('livescreen_recent_search') || '[]') || []; }catch(e){ state.recentSearch = []; } } return state.recentSearch; }
function noteSearched(slug){
  slug = String(slug || '').trim(); if(!slug) return;
  const r = recentSearches().filter(x => String(x).toLowerCase() !== slug.toLowerCase()); r.unshift(slug);
  state.recentSearch = r.slice(0, 30);
  try{ localStorage.setItem('livescreen_recent_search', JSON.stringify(state.recentSearch)); }catch(e){}
}
const normQ = x => String(x || '').toLowerCase().replace(/[\s_\-.#]+/g, '');

// Kick's own search box (names that are close to what was typed). Best-effort: if it can't be reached, local results still show.
async function kickSearchRemote(q){
  const target = 'https://kick.com/api/search?searchable=' + encodeURIComponent(q);
  const attempts = [];
  if(state.proxyWorkerUrl) attempts.push(state.proxyWorkerUrl + '/?url=' + encodeURIComponent(target));
  attempts.push(target);
  for(const u of attempts){
    try{
      const c = new AbortController(); const tm = setTimeout(() => c.abort(), 6000);
      const res = await fetch(u, { headers:{ 'Accept':'application/json' }, signal: c.signal }).finally(() => clearTimeout(tm));
      if(!res.ok) continue;
      const d = await res.json();
      const arr = d.channels || (d.data && d.data.channels) || (Array.isArray(d) ? d : []);
      const out = (Array.isArray(arr) ? arr : []).map(x => ({
        slug: x.slug || (x.channel && x.channel.slug) || x.username || '',
        live: !!(x.isLive || x.is_live || (x.livestream && x.livestream.is_live)),
        avatar: x.profile_picture || x.profile_pic || (x.user && (x.user.profile_pic || x.user.profilepic)) || null,
      })).filter(x => x.slug);
      if(out.length) return out;
    }catch(e){}
  }
  return [];
}

// Order: channels you follow -> channels you watched -> channels you searched -> live now -> everything Kick suggests
function searchCandidates(q){
  const ar = state.settings.lang === 'ar';
  const TAG = { fav: ar ? 'متابَع' : 'Following', hist: ar ? 'سجل' : 'History', srch: ar ? 'بحثت عنه' : 'Searched', live: ar ? 'مباشر' : 'Live', kick: 'Kick' };
  const nq = normQ(q), seen = new Set(), out = [], pf = langProfile();
  const liveSet = {}; (state.liveList || []).forEach(x => { if(x && x.slug) liveSet[x.slug.toLowerCase()] = x; });
  const push = (slug, tag, grp, extra) => {
    const k = String(slug || '').toLowerCase(); if(!k || seen.has(k) || isBlocked(slug)) return;
    const nk = normQ(k), pos = nk.indexOf(nq);
    if(pos < 0) return;
    seen.add(k);
    const lv = liveSet[k];
    const lg = chanLang(k), langPen = grp >= 3 ? (lg === pf.pri ? 0 : (lg === pf.sec ? 20 : 40)) : 0;
    const pop = (grp >= 3 && lv) ? Math.min(25, Math.log10((lv.viewers || 0) + 10) * 6) : 0;
    out.push(Object.assign({ slug, tag: TAG[tag], rank: grp * 100 + (pos === 0 ? 0 : 40) + Math.min(30, nk.length - nq.length) + langPen - pop, live: !!(lv || (extra && extra.live) || state.knownLiveStatus[k]), viewers: lv ? lv.viewers : null, cat: lv ? lv.cat : '' }, extra && extra.avatar ? { avatar: extra.avatar } : {}));
  };
  (state.favorites || []).forEach(c => push(c, 'fav', 0));
  (state.library || []).forEach(x => push(x && x.channel, 'hist', 1));
  (state.watchHistory || []).slice().reverse().forEach(x => push(x && x.channel, 'hist', 1));
  recentSearches().forEach(c => push(c, 'srch', 2));
  (state.liveList || []).slice().sort((a,b)=>(b.viewers||0)-(a.viewers||0)).forEach(x => push(x.slug, 'live', 3));
  const R = state.remoteSearch;
  if(R && R.q === q) R.list.forEach(x => push(x.slug, 'kick', 4, x));
  return out.sort((a, b) => a.rank - b.rank);
}

/* ---------- Smart suggestions (empty search) ----------
   Learns which language(s) you watch from the channels you follow / watched (Kick tells us a stream's
   language while it is live; we remember it per channel). Then: your own channels first, and the rest
   mostly in your main language with a share of the other one (mixed viewers get a mix). */
function normLang(l){
  l = String(l || '').trim().toLowerCase(); if(!l) return '';
  if(/^(ar|arabic|ara)/.test(l)) return 'ar';
  if(/^(en|english|eng)/.test(l)) return 'en';
  return l.slice(0, 2);
}
function chanLangMap(){
  if(!window.__chanLang){ try{ window.__chanLang = JSON.parse(localStorage.getItem('livescreen_chan_lang') || '{}') || {}; }catch(e){ window.__chanLang = {}; } }
  return window.__chanLang;
}
function noteLang(slug, lang){
  const k = String(slug || '').toLowerCase(), l = normLang(lang);
  if(!k || !l) return;
  const m = chanLangMap(); if(m[k] === l) return;
  delete m[k]; m[k] = l;
  const keys = Object.keys(m); if(keys.length > 500) keys.slice(0, keys.length - 500).forEach(x => delete m[x]);
  clearTimeout(window.__chanLangT);
  window.__chanLangT = setTimeout(() => { try{ localStorage.setItem('livescreen_chan_lang', JSON.stringify(m)); }catch(e){} }, 1500);
}
function chanLang(slug){
  const k = String(slug || '').toLowerCase(); if(!k) return '';
  if(/[\u0600-\u06FF]/.test(k)) return 'ar';
  return chanLangMap()[k] || '';
}
function langProfile(){
  const w = {}, add = (slug, wt) => { const l = chanLang(slug); if(l) w[l] = (w[l] || 0) + wt; };
  (state.favorites || []).forEach(c => add(c, 3));
  (state.library || []).slice(0, 30).forEach(x => x && add(x.channel, 2));
  (state.watchHistory || []).slice(-40).forEach(x => x && add(x.channel, 1));
  const langs = Object.keys(w).sort((a, b) => w[b] - w[a]);
  const ui = state.settings.lang === 'ar' ? 'ar' : 'en', other = l => l === 'ar' ? 'en' : 'ar';
  if(!langs.length) return { pri: ui, sec: other(ui), share: .7 };
  const pri = langs[0], sec = langs[1] || other(pri);
  const tot = langs.reduce((a, l) => a + w[l], 0), s1 = w[pri] / tot, s2 = langs[1] ? w[langs[1]] / tot : 0;
  const share = s2 >= .25 ? Math.min(.65, Math.max(.5, s1 / (s1 + s2))) : .7;   // mixed viewers get a closer mix
  return { pri, sec, share };
}
async function ensureLangPools(){
  const pf = langProfile(); state.langPools = state.langPools || {};
  for(const l of [pf.pri, pf.sec]){
    const p = state.langPools[l];
    if(p && (p.loading || Date.now() - p.ts < 120000)) continue;
    const pool = state.langPools[l] = { ts: Date.now(), loading: true, list: p ? p.list : null };
    try{
      const res = await kickApi('livestreams', 'sort=viewer_count&limit=40&language=' + encodeURIComponent(l));
      const data = res.ok ? await res.json() : {};
      pool.list = (data.data || []).filter(s => s.slug && !isBlocked(s.slug) && !(state.settings.hideMature && s.has_mature_content))
        .map(s => ({ slug: s.slug, viewers: s.viewer_count, thumb: extractThumb(s), cat: s.category ? s.category.name : '', lang: l }));
      pool.list.forEach(x => noteLang(x.slug, l));
    }catch(e){}
    pool.loading = false; pool.ts = Date.now();
    if(state.screen === 'search' && !state.searchVal.trim()) renderSuggestions();
  }
}
function smartPicks(){
  const pf = langProfile(), ar = state.settings.lang === 'ar';
  const TAG = { live: ar ? 'مباشر' : 'Live', fav: ar ? 'متابَع' : 'Following', hist: ar ? 'سجل' : 'History' };
  const liveBy = {}, addLive = x => { if(x && x.slug){ const k = x.slug.toLowerCase(); if(!liveBy[k]) liveBy[k] = x; } };
  (state.liveList || []).forEach(addLive);
  Object.keys(state.langPools || {}).forEach(l => ((state.langPools[l] || {}).list || []).forEach(addLive));
  const byViewers = (a, b) => ((liveBy[String(b.slug).toLowerCase()] || {}).viewers || 0) - ((liveBy[String(a.slug).toLowerCase()] || {}).viewers || 0);
  const isLive = c => !!liveBy[String(c).toLowerCase()];
  // 1) my own channels: followed + watched, live ones first
  const seen = new Set(), mine = [];
  const addMine = (slug, kind) => { const k = String(slug || '').toLowerCase(); if(!k || seen.has(k) || isBlocked(slug)) return; seen.add(k); mine.push({ slug, kind, live: isLive(slug) }); };
  (state.favorites || []).map(slug => ({ slug })).sort(byViewers).forEach(x => addMine(x.slug, 'fav'));
  (state.library || []).forEach(x => x && addMine(x.channel, 'hist'));
  (state.watchHistory || []).slice().reverse().forEach(x => x && addMine(x.channel, 'hist'));
  mine.sort((a, b) => (b.live - a.live) || (a.kind === b.kind ? 0 : a.kind === 'fav' ? -1 : 1));
  const mineText = mine.slice(0, 4), mineCards = mine.filter(m => m.live).slice(0, 3);
  // 2) discovery: main language first, with a share of the second one
  const all = Object.keys(liveBy).map(k => liveBy[k]).sort((a, b) => (b.viewers || 0) - (a.viewers || 0));
  const langOf = x => x.lang || chanLang(x.slug);
  const take = l => all.filter(x => langOf(x) === l);
  const priL = take(pf.pri), secL = take(pf.sec);
  const mix = (n, skip) => {
    const out = [], A = priL.filter(x => !skip.has(x.slug.toLowerCase())), B = secL.filter(x => !skip.has(x.slug.toLowerCase()));
    let ia = 0, ib = 0, sc = 0;
    while(out.length < n && (ia < A.length || ib < B.length)){
      const wantSec = Math.floor((out.length + 1) * (1 - pf.share)) > sc;
      if((wantSec && ib < B.length) || ia >= A.length){ out.push(B[ib++]); sc++; } else out.push(A[ia++]);
    }
    if(out.length < n) all.forEach(x => { const k = x.slug.toLowerCase(); if(out.length < n && !skip.has(k) && out.indexOf(x) < 0) out.push(x); });
    return out;
  };
  const skipT = new Set(mineText.map(m => m.slug.toLowerCase()));
  const text = mineText.map(m => ({ slug: m.slug, tag: (m.live ? TAG.live + ' · ' : '') + (m.kind === 'fav' ? TAG.fav : TAG.hist) }));
  mix(8 - text.length, skipT).forEach(x => text.push({ slug: x.slug, tag: TAG.live }));
  const skipC = new Set(mineCards.map(m => m.slug.toLowerCase()));
  const cards = mineCards.map(m => liveBy[m.slug.toLowerCase()]).concat(mix(9 - mineCards.length, skipC));
  return { text, cards };
}
function renderSuggestions(){
  const grid = document.getElementById('suggest-grid');
  const title = document.getElementById('suggest-title');
  const textlist = document.getElementById('search-textlist');
  const q = state.searchVal.trim().toLowerCase();
  state.searchToken = (state.searchToken||0) + 1;
  const myToken = state.searchToken;

  if(!q){
    const pk = smartPicks();
    const mk = c => cardHtml({ channel:c.slug, cat:c.cat, viewers:c.viewers, thumb:c.thumb, live:true, hero:true });
    grid.innerHTML = pk.cards.map(mk).join('');
    title.style.display = 'none';
    { const sm = document.getElementById('search-media'); if(sm) sm.innerHTML = ''; }
    if(textlist) textlist.innerHTML = pk.text.map(x =>
      `<div class="text-item sug-item" data-nav tabindex="-1" data-sug="${escapeHtml(x.slug)}">${escapeHtml(x.slug)}${x.tag ? `<span class="sug-tag">${x.tag}</span>` : ''}</div>`).join('');
    keepFocusRefresh();
    return;
  }
  const cand = searchCandidates(q).slice(0, 12);
  const mk = c => cardHtml({ channel:c.slug, cat:[c.tag, c.cat].filter(Boolean).join(' \u00B7 '), viewers:c.viewers, live:c.live, offline:!c.live, avatar:c.avatar || state.avatarCache[c.slug.toLowerCase()] || null, hero:true });
  title.style.display = 'block';
  title.textContent = cand.length ? t('searchResults') : '';
  grid.innerHTML = cand.map(mk).join('');
  fadeInEl(grid);
  patchSearchAvatars(grid);
  if(textlist) textlist.innerHTML = cand.slice(0, 8).map(c =>
    `<div class="text-item" data-nav tabindex="-1" data-channel="${escapeHtml(c.slug)}">${escapeHtml(c.slug)}<span class="sug-tag">${c.tag}</span></div>`).join('');
  keepFocusRefresh();

  // Kick's own suggestions (close names), then re-rank
  clearTimeout(state.remoteTimer);
  state.remoteTimer = setTimeout(async () => {
    if(myToken !== state.searchToken || q.length < 2) return;
    const list = await kickSearchRemote(q);
    if(myToken !== state.searchToken) return;
    list.forEach(x => { if(x.avatar) state.avatarCache[x.slug.toLowerCase()] = x.avatar; });
    state.remoteSearch = { q, list };
    if(list.length) renderSuggestionsKeep(q);
  }, 280);

  // Clips + VODs of the best match
  clearTimeout(state.mediaTimer);
  state.mediaTimer = setTimeout(() => loadSearchMedia(q, myToken), 700);

  clearTimeout(state.exactCheckTimer);
  state.exactCheckTimer = setTimeout(async () => {
    if(myToken !== state.searchToken) return;
    if(grid.querySelector(`[data-channel="${CSS.escape(q)}"]`)) return;
    const ch = await checkExactChannel(q);
    if(myToken !== state.searchToken) return;
    if(ch){
      grid.insertAdjacentHTML('beforeend', cardHtml({ channel: ch.slug || q, offline:true, hero:true, avatar: state.avatarCache[(ch.slug || q).toLowerCase()] || null }));
      title.textContent = t('searchResults');
      patchSearchAvatars(grid);
      fadeInEl(grid); keepFocusRefresh();
      loadSearchMedia(q, myToken);
    } else if(!cand.length){
      title.textContent = t('noResults');
    }
  }, 500);
}

// re-render the results with Kick's suggestions merged in, without touching the media rows
function renderSuggestionsKeep(q){

// Clips + VODs: videos of the best-matching channels, plus any video whose TITLE matches what was typed
// (searched inside the channels you follow / watched). Order: followed -> watched -> the rest, your main language first.
const normT = x => String(x || '').toLowerCase().replace(/[\u064B-\u0652\u0640]/g, '').replace(/[\u0623\u0625\u0622]/g, '\u0627').replace(/\u0649/g, '\u064A').replace(/\u0629/g, '\u0647').replace(/\s+/g, ' ').trim();
async function channelMedia(ch){

async function loadSearchMedia(q, token){
  const box = document.getElementById('search-media'); if(!box) return;
  if(token !== state.searchToken) return;
  if(q.length < 2){ box.innerHTML = ''; return; }
  const low = x => String(x).toLowerCase();
  const cand = searchCandidates(q);
  const nameHit = new Set(cand.slice(0, 2).map(c => low(c.slug)));
  if(!nameHit.size){ const f = document.querySelector('#suggest-grid .card[data-channel]'); if(f) nameHit.add(low(f.dataset.channel)); }
  const favs = (state.favorites || []).map(low);
  const hist = []; (state.library || []).forEach(x => x && x.channel && hist.push(low(x.channel)));
  (state.watchHistory || []).slice().reverse().forEach(x => x && x.channel && hist.push(low(x.channel)));
  const order = [], add = c => { c = low(c); if(c && !order.includes(c) && !isBlocked(c)) order.push(c); };
  nameHit.forEach(add); favs.slice(0, 6).forEach(add); hist.slice(0, 6).forEach(add);
  const scan = order.slice(0, 10);
  const grp = c => favs.includes(c) ? 0 : (hist.includes(c) ? 1 : 2);
  const pf = langProfile(), nqT = normT(q);
  const lgOf = t => /[\u0600-\u06FF]/.test(t || '') ? 'ar' : 'en';
  const got = {};
  const paint = () => {
    if(token !== state.searchToken) return;
    const pick = kind => {
      const out = [];
      scan.forEach((c, ci) => {
        const m = got[c]; if(!m) return;
        (m[kind] || []).forEach((it, ii) => {
          const hit = nameHit.has(c) || normT(it.title).includes(nqT);
          if(hit) out.push({ it, c, g: grp(c), ci, ii, lp: lgOf(it.title) === pf.pri ? 0 : 1 });
        });
      });
      out.sort((a, b) => (a.g - b.g) || (a.lp - b.lp) || (a.ci - b.ci) || (a.ii - b.ii));
      return out.slice(0, 12);
    };
    const vods = pick('vods'), clips = pick('clips');
    const nm = x => escapeHtml(x);
    box.innerHTML =
      (vods.length ? `<div class="row"><div class="row-title"><span>${t('vodsTitle')}</span></div><div class="hrow">${vods.map(x => vodCardHtml(x.it, x.c)).join('')}</div></div>` : '') +
      (clips.length ? `<div class="row"><div class="row-title"><span>${CLIPS_LOGO}${t('clipsTitle')}</span></div><div class="hrow">${clips.map(x => clipCardHtml(x.it, x.c)).join('')}</div></div>` : '');
    keepFocusRefresh();
  };
  let paintT = null;
  scan.forEach(c => channelMedia(c).then(m => { got[c] = m; clearTimeout(paintT); paintT = setTimeout(paint, 250); }).catch(() => {}));
}

   Transcribes speech to text right in the browser, drops it into the same

/* ---------- Player: custom native HLS player, no Kick UI ---------- */
/*
  Strategy: fetch the channel's raw HLS playback URL from Kick's own frontend
  data endpoint and play it with hls.js in a plain <video> element we fully
  control (our own play/pause, mute, fullscreen — zero Kick chrome).
  This endpoint is not part of Kick's official documented Public API, so a
  direct browser fetch is usually blocked by CORS. We try, in order:
    1) the user's own Cloudflare Worker proxy (Settings > proxyWorkerUrl) —
       most reliable, since it's a dedicated server-to-server relay only
       this app uses;
    2) a direct browser fetch (works if Kick ever allows it);
    3) a couple of public CORS-relay services as a last resort.
  If every attempt fails we transparently fall back to Kick's official
  embeddable player so playback never breaks.
*/
function extractAvatar(data){
  const u = data && data.user;
  if(!u) return null;
  return u.profile_pic || u.profilepic || u.profile_picture || null;
}

async function fetchPlaybackInfo(channel){
  const target = 'https://kick.com/api/v2/channels/' + encodeURIComponent(channel);
  const attempts = [];
  if(state.proxyWorkerUrl){
    attempts.push(state.proxyWorkerUrl + '/?channel=' + encodeURIComponent(channel));
  }
  attempts.push(target);
  attempts.push('https://api.allorigins.win/raw?url=' + encodeURIComponent(target));
  attempts.push('https://corsproxy.io/?url=' + encodeURIComponent(target));

  for(const fetchUrl of attempts){
    try{
      const ac = new AbortController(); const tm = setTimeout(() => ac.abort(), 7000);
      const res = await fetch(fetchUrl, { headers: { 'Accept': 'application/json' }, signal: ac.signal }).finally(() => clearTimeout(tm));
      if(!res.ok) continue;
      const data = await res.json();
      const avatar = extractAvatar(data);
      const chatroomId = data.chatroom && data.chatroom.id;
      const channelId = data.id;
      const live = data.livestream;
      const followers = (data.followers_count != null ? data.followers_count : (data.followersCount != null ? data.followersCount : null));
      if(!live || live.is_live === false) return { isLive:false, avatar, chatroomId, channelId, followers };
      const url = data.playback_url;
      if(!url) continue;
      // Route the actual video (m3u8 + segments) through our Worker's /proxy
      // route too, since Kick's video-edge servers don't send CORS headers
      // and hls.js would otherwise fail to fetch the manifest directly.
      const finalUrl = state.proxyWorkerUrl
        ? (state.proxyWorkerUrl + '/proxy?url=' + encodeURIComponent(url))
        : url;
      // Kick sends the start as "YYYY-MM-DD HH:MM:SS" in UTC (no zone marker).
      let startMs = null;
      const st = live.start_time || live.created_at || null;
      if(st){
        const iso = /[zZ]|[+-]\d\d:?\d\d$/.test(st) ? st.replace(' ','T') : st.replace(' ','T') + 'Z';
        const ms = Date.parse(iso);
        if(isFinite(ms) && ms > 0 && ms <= Date.now() + 60000) startMs = ms;
      }
      return { isLive:true, playbackUrl:finalUrl, avatar, chatroomId, channelId, followers, startMs, title: live.session_title || live.title || '' };
    }catch(err){
      console.warn('Playback lookup attempt failed:', fetchUrl, err);
      // try the next attempt in the list
    }
  }
  return null; // every attempt failed — caller falls back to the Kick embed
}

// Cached lookup of just a channel's logo, so offline cards/rows can show the
// streamer's own avatar instead of a plain letter tile without re-fetching
// it every time the same channel shows up again in this session.
state.followersCache = {};
async function getChannelFollowers(channel){

}

async function getChannelAvatar(channel){

/* ---------- Live chat, built from scratch (no Kick iframe) ----------
   Kick's own web chat is a real-time feed pushed over Pusher's websocket
   protocol. We speak that protocol directly with a plain WebSocket (no
   pusher-js dependency): connect, subscribe to "chatrooms.<id>.v2", and
   render "App\Events\ChatMessageEvent" payloads as they arrive.
   NOTE: the app key/cluster below are Kick's public web-chat Pusher
   credentials, not something this app's own client id controls. Kick could
   change them without notice — if chat stops connecting, this is the first
   place to check (open kick.com, watch the network tab for a wss:// URL to
   ws-<cluster>.pusher.com/app/<key>, and update the two constants below). */
const CHAT_PUSHER_KEY = '32cbd69e4b950bf97679';
const CHAT_PUSHER_CLUSTER = 'us2';
const CHAT_MAX_MESSAGES = 150;

state.chatSocket = null;
state.chatChannel = null;
state.chatroomId = null;
state.chatAutoScroll = true;
state.chatReconnectTimer = null;
state.chatMsgEls = [];
state.chatDraft = '';
state.broadcasterIdCache = {};

function escapeHtml(str){
  return String(str == null ? '' : str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Kick sends emotes inline as literal text placeholders, e.g.
// "hey [emote:39262:PogChamp] nice". Swap those for the actual image so
// they render as emotes instead of raw bracket text.
function renderChatContent(content){
  const raw = content || '';
  const parts = raw.split(/(\[emote:\d+:[^\]]*\])/g);
  return parts.map(part => {
    const m = part.match(/^\[emote:(\d+):([^\]]*)\]$/);
    if(m){
      const id = m[1];
      const name = escapeHtml(m[2]);
      return `<img class="chat-emote" src="https://files.kick.com/emotes/${id}/fullsize" alt="${name}" title="${name}" loading="lazy" onerror="chatEmoteFallback(this)">`;
    }
    return escapeHtml(part);
  }).join('');
}

// If an emote image 404s (unknown/renamed emote), fall back to plain
// ":name:" text instead of leaving a broken-image icon in the chat.
function chatEmoteFallback(img){
  const name = img.getAttribute('alt') || '';
  img.replaceWith(document.createTextNode(':' + name + ':'));
}

async function fetchChatroomId(channel){
  const info = await fetchPlaybackInfo(channel);
  return (info && info.chatroomId) || null;
}

function disconnectLiveChat(){
  stopVodChatReplay();
  clearTimeout(state.chatReconnectTimer);
  state.chatReconnectTimer = null;
  state.chatChannel = null;
  state.chatroomId = null;
  if(state.chatSocket){
    try{ state.chatSocket.onclose = null; state.chatSocket.close(); }catch(e){}
    state.chatSocket = null;
  }
  const list = document.getElementById('chat-messages');
  if(list) list.innerHTML = '';
  state.chatMsgEls = [];
  state.chatAutoScroll = true;
  const pill = document.getElementById('chat-new-pill');
  if(pill) pill.classList.remove('show');
  resetHypeMeter();
}

/* ---------- Hype meter (local, instant) ----------
   The bar itself is a free, real-time heuristic: messages-per-10s scaled to
   0-100, no network call. */
state.chatRateWindow = [];   // timestamps (ms) of recent messages, for the local hype bar

function resetHypeMeter(){
  state.chatRateWindow = [];
  const fill = document.getElementById('chat-hype-fill');
  const label = document.getElementById('chat-hype-label');
  if(fill) fill.style.width = '0%';
  if(label) label.textContent = '';
}

function bumpHypeMeter(){
  const now = Date.now();
  state.chatRateWindow.push(now);
  while(state.chatRateWindow.length && now - state.chatRateWindow[0] > 12000) state.chatRateWindow.shift();
  const rate = state.chatRateWindow.length; // messages in the last 12s
  const pct = Math.max(4, Math.min(100, Math.round((rate / 20) * 100))); // ~20 msg/12s = maxed out
  const fill = document.getElementById('chat-hype-fill');
  const label = document.getElementById('chat-hype-label');
  if(fill) fill.style.width = pct + '%';
  if(label) label.textContent = pct >= 70 ? t('hypeHigh') : pct >= 35 ? t('hypeMed') : t('hypeLow');
}

function chatStatus(txt){
  const ov = document.getElementById('chat-overlay'); if(!ov) return;
  let el = document.getElementById('chat-status');
  if(!el){ el = document.createElement('div'); el.id = 'chat-status'; ov.insertBefore(el, ov.firstChild); }
  el.textContent = txt || '';
  el.style.display = txt ? '' : 'none';
}
async function connectLiveChat(channel){
  disconnectLiveChat();
  state.chatChannel = channel;
  chatStatus(LT('Connecting to chat…', 'جاري الاتصال بالشات…'));
  let chatroomId = null;
  try{ chatroomId = await fetchChatroomId(channel); }catch(e){ console.warn('Live chat: chatroom lookup failed', e); }
  if(state.chatChannel !== channel) return; // channel changed meanwhile
  if(!chatroomId){
    console.warn('Live chat: could not resolve a chatroom id for', channel);
    chatStatus(LT("Couldn't reach this channel's chat. Turn Chat off and on to retry.", 'تعذّر الوصول لشات القناة. أطفئ الشات وشغّله من جديد للمحاولة.'));
    return;
  }
  state.chatroomId = chatroomId;
  openChatSocket(channel, chatroomId);
}

function openChatSocket(channel, chatroomId){
  let ws;
  try{
    ws = new WebSocket(`wss://ws-${CHAT_PUSHER_CLUSTER}.pusher.com/app/${CHAT_PUSHER_KEY}?protocol=7&client=js&version=8.4.0&flash=false`);
  }catch(e){ console.warn('Live chat: could not open websocket', e); return; }
  state.chatSocket = ws;
  ws.onopen = () => {
    if(state.chatChannel !== channel) return;
    chatStatus(LT('Connected. Waiting for messages…', 'تم الاتصال، بانتظار الرسائل…'));
    ws.send(JSON.stringify({ event:'pusher:subscribe', data:{ channel: `chatrooms.${chatroomId}.v2` } }));
  };
  ws.onmessage = (evt) => {
    if(state.chatChannel !== channel) return;
    let msg;
    try{ msg = JSON.parse(evt.data); }catch(e){ return; }
    if(msg.event === 'App\\Events\\ChatMessageEvent'){
      let payload;
      try{ payload = JSON.parse(msg.data); }catch(e){ return; }
      appendChatMessage(payload);
    }
  };
  ws.onclose = () => {
    if(state.chatSocket !== ws) return; // a newer socket already replaced this one
    state.chatSocket = null;
    if(state.chatChannel === channel){
      // Transient drop — try to pick the chat back up after a short pause.
      state.chatReconnectTimer = setTimeout(() => connectLiveChat(channel), 4000);
    }
  };
  ws.onerror = () => { chatStatus(LT("Chat connection failed. Retrying…", 'تعذّر الاتصال بالشات، جاري إعادة المحاولة…')); try{ ws.close(); }catch(e){} };
}

function chatIsNearBottom(){
  const list = document.getElementById('chat-messages');
  if(!list) return true;
  return (list.scrollHeight - list.scrollTop - list.clientHeight) < 40;
}

function appendChatMessage(payload){
  const list = document.getElementById('chat-messages');
  if(!list) return;
  const sender = payload.sender || {};
  const identity = sender.identity || {};
  const color = identity.color || '#E50914';
  const badges = Array.isArray(identity.badges) ? identity.badges : [];
  const badgeHtml = badges.slice(0,2).map(b =>
    `<span class="chat-badge">${escapeHtml((b.text || b.type || '?').toString().slice(0,1).toUpperCase())}</span>`
  ).join('');
  const el = document.createElement('div');
  el.className = 'chat-msg';
  el.innerHTML = `${badgeHtml}<span class="chat-author" style="color:${color}">${escapeHtml(sender.username || '?')}</span><span class="chat-text">${renderChatContent(payload.content)}</span>`;
  bumpHypeMeter();
  chatStatus('');
  const wasNearBottom = chatIsNearBottom();
  list.appendChild(el);
  state.chatMsgEls.push(el);
  while(state.chatMsgEls.length > CHAT_MAX_MESSAGES){
    const old = state.chatMsgEls.shift();
    if(old && old.parentNode) old.parentNode.removeChild(old);
  }
  if(true){
    list.scrollTop = list.scrollHeight;
    const pill = document.getElementById('chat-new-pill');
    if(pill) pill.classList.remove('show');
  } else {
    const pill = document.getElementById('chat-new-pill');
    if(pill){ pill.textContent = t('chatNewMessages'); pill.classList.add('show'); }
  }
}

/* ---------- Chat replay for past broadcasts (VODs) ----------
   Kick has no official API for this. We use the same unofficial endpoint the
   website uses: /api/v2/channels/<id>/messages?start_time=<ISO>, which returns
   a batch of messages starting at that moment. Best-effort: if it can't be
   reached the chat simply stays empty. */
const VOD_CHAT = { timer:null, token:0, buf:[], seen:new Set(), fetchedUntil:0, lastAbs:0, busy:false, startMs:0, channelId:null };

function stopVodChatReplay(){
  VOD_CHAT.token++;
  clearInterval(VOD_CHAT.timer); VOD_CHAT.timer = null;
  VOD_CHAT.buf = []; VOD_CHAT.seen = new Set(); VOD_CHAT.fetchedUntil = 0; VOD_CHAT.busy = false;
}

async function fetchVodChatBatch(channelId, absMs){
  const target = 'https://kick.com/api/v2/channels/' + encodeURIComponent(channelId) + '/messages?start_time=' + encodeURIComponent(new Date(absMs).toISOString());
  const attempts = [];
  if(state.proxyWorkerUrl) attempts.push(state.proxyWorkerUrl + '/?url=' + encodeURIComponent(target));
  attempts.push(target);
  attempts.push('https://api.allorigins.win/raw?url=' + encodeURIComponent(target));
  attempts.push('https://corsproxy.io/?url=' + encodeURIComponent(target));
  for(const u of attempts){
    try{
      const res = await fetch(u, { headers:{ 'Accept':'application/json' } });
      if(!res.ok) continue;
      const data = await res.json();
      const list = (data && data.data && data.data.messages) || (data && data.messages) || [];
      if(Array.isArray(list)) return list;
    }catch(e){ /* try next */ }
  }
  return null;
}

async function startVodChatReplay(channel){
  stopVodChatReplay();
  const myToken = VOD_CHAT.token;
  const meta = (state.mediaMeta || {})[state.currentMediaKey] || {};
  const startMs = meta.date ? new Date(String(meta.date).replace(' ', 'T') + (/[zZ]|[+-]\d\d:?\d\d$/.test(String(meta.date)) ? '' : 'Z')).getTime() : NaN;
  if(!isFinite(startMs)) return;
  const info = await fetchPlaybackInfo(channel);
  if(myToken !== VOD_CHAT.token || !info || !info.channelId) return;
  VOD_CHAT.channelId = info.channelId; VOD_CHAT.startMs = startMs; VOD_CHAT.lastAbs = 0;

  const refill = async (fromAbs) => {
    if(VOD_CHAT.busy) return;
    VOD_CHAT.busy = true;
    const list = await fetchVodChatBatch(VOD_CHAT.channelId, fromAbs);
    VOD_CHAT.busy = false;
    if(myToken !== VOD_CHAT.token || !list) return;
    let maxT = fromAbs;
    list.forEach(m => {
      if(!m || VOD_CHAT.seen.has(m.id)) return;
      VOD_CHAT.seen.add(m.id);
      const t = new Date(m.created_at).getTime();
      if(!isFinite(t)) return;
      if(t > maxT) maxT = t;
      VOD_CHAT.buf.push({ t, m });
    });
    VOD_CHAT.buf.sort((a, b) => a.t - b.t);
    VOD_CHAT.fetchedUntil = Math.max(maxT, fromAbs + 5000);
  };

  VOD_CHAT.timer = setInterval(() => {
    const video = document.getElementById('native-video');
    if(!video || state.contentKind !== 'vod') return;
    const abs = VOD_CHAT.startMs + video.currentTime * 1000;
    // seek (or first tick): reset the chat and start from the new position
    if(Math.abs(abs - VOD_CHAT.lastAbs) > 15000){
      VOD_CHAT.buf = []; VOD_CHAT.seen = new Set(); VOD_CHAT.fetchedUntil = 0;
      const list = document.getElementById('chat-messages'); if(list) list.innerHTML = '';
      state.chatMsgEls = [];
    }
    VOD_CHAT.lastAbs = abs;
    if(!video.paused){
      while(VOD_CHAT.buf.length && VOD_CHAT.buf[0].t <= abs){
        const { m } = VOD_CHAT.buf.shift();
        appendChatMessage({ content: m.content, sender: m.sender });
      }
    }
    if(VOD_CHAT.fetchedUntil < abs + 10000) refill(Math.max(abs, VOD_CHAT.fetchedUntil));
  }, 1000);
}

function scrollChatToBottom(){
  const list = document.getElementById('chat-messages');

/* ---------- Sending messages (chat:write) ----------
   Kick's official Public API v1 accepts chat messages at POST
   /public/v1/chat, authorized with the *user's own* OAuth token (the one
   obtained via startKickLogin(), not the app's client-credentials token). */
async function getBroadcasterUserId(channel){
  const key = (channel || '').toLowerCase();
  if(state.broadcasterIdCache[key] !== undefined) return state.broadcasterIdCache[key];
  const ch = await checkExactChannel(channel);
  const id = (ch && (ch.broadcaster_user_id || (ch.broadcaster && ch.broadcaster.user_id))) || null;
  state.broadcasterIdCache[key] = id;
  return id;
}

async function sendChatMessage(text){
  const content = (text || '').trim();
  if(!content || !state.chatChannel) return false;
  const auth = loadKickAuth();
  if(!auth || !auth.access_token){ alert(t('chatLoginRequired')); return false; }
  const broadcasterId = await getBroadcasterUserId(state.chatChannel);
  if(!broadcasterId) return false;
  try{
    const res = await fetch('https://api.kick.com/public/v1/chat', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer ' + auth.access_token },
      body: JSON.stringify({ broadcaster_user_id: broadcasterId, content, type:'user' })
    });
    return res.ok;
  }catch(e){ return false; }
}

/* ---------- Player: past broadcasts (VODs) ----------
   Kick's official public API has no VOD endpoint, so this uses the same
   unofficial channel-videos endpoint (and CORS-fallback chain) as live
   playback lookup. Best-effort: if Kick changes this endpoint, the offline
   screen simply falls back to showing no past broadcasts. */
function normalizeVod(v){
  if(!v) return null;
  const inner = v.video || {};
  const uuid = inner.uuid || v.uuid || inner.id || v.id;
  if(!uuid) return null;
  const title = v.session_title || v.title || inner.session_title || '';
  const thumb = extractThumb(v) || extractThumb(inner);
  const durationMs = v.duration || inner.duration || 0;
  const views = inner.views != null ? inner.views : (v.views != null ? v.views : null);
  const createdAt = v.created_at || v.start_time || inner.created_at || null;
  const source = inner.source || v.source || null;
  const liveIds = [v.id, inner.live_stream_id, v.live_stream_id].filter(x => x != null);
  const startTime = v.start_time || v.created_at || inner.created_at || null;
  return { uuid, title, thumb, durationMs, views, createdAt, source, liveIds, startTime };
}

async function fetchChannelVods(channel){
  const target = 'https://kick.com/api/v2/channels/' + encodeURIComponent(channel) + '/videos';
  const attempts = [];
  if(state.proxyWorkerUrl){
    attempts.push(state.proxyWorkerUrl + '/?url=' + encodeURIComponent(target));
  }
  attempts.push(target);
  attempts.push('https://api.allorigins.win/raw?url=' + encodeURIComponent(target));
  attempts.push('https://corsproxy.io/?url=' + encodeURIComponent(target));

  for(const fetchUrl of attempts){
    try{
      const res = await fetch(fetchUrl, { headers:{ 'Accept':'application/json' } });
      if(!res.ok) continue;
      const data = await res.json();
      const list = Array.isArray(data) ? data : (data.data || data.videos || []);
      if(!Array.isArray(list)) continue;
      return list.map(normalizeVod).filter(Boolean);
    }catch(err){
      console.warn('VOD lookup attempt failed:', fetchUrl, err);
    }
  }
  return [];
}

function formatVodDuration(ms){
  if(!ms) return '';
  const totalSec = Math.round(ms/1000);
  const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60);
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

function formatVodDate(str){
  if(!str) return '';
  const d = new Date(String(str).replace(' ', 'T') + (String(str).includes('Z') ? '' : 'Z'));
  if(isNaN(d.getTime())) return '';
  const diff = Math.max(0, Date.now() - d.getTime());
  const min = Math.floor(diff / 60000), hr = Math.floor(diff / 3600000), day = Math.floor(diff / 86400000);
  const ar = state.settings.lang === 'ar';
  const unit = (n, en1, enN, a1, a2, aFew, aMany) => {
    if(!ar) return n + ' ' + (n === 1 ? en1 : enN);
    if(n === 1) return 'منذ ' + a1;
    if(n === 2) return 'منذ ' + a2;
    return 'منذ ' + n + ' ' + (n <= 10 ? aFew : aMany);
  };
  if(min < 1) return ar ? 'الآن' : 'Just now';
  if(hr < 1) return unit(min, 'Minute', 'Minutes', 'دقيقة', 'دقيقتين', 'دقائق', 'دقيقة');
  if(day < 1) return unit(hr, 'Hour', 'Hours', 'ساعة', 'ساعتين', 'ساعات', 'ساعة');
  return unit(day, 'Day', 'Days', 'يوم', 'يومين', 'أيام', 'يوم');
}

function vodCardHtml(v, channel){
  (state.mediaMeta = state.mediaMeta || {})['vod:' + v.uuid] = { views:(typeof v!=='undefined'&&v?v.views:null), title:v.title, thumb:v.thumb, durationSec:(v.durationMs || 0)/1000, date:v.createdAt };
  const viewersTxt = v.views != null ? `${fmtCompact(v.views)} ${t('viewsSuffix')}` : '';
  const meta = [formatVodDate(v.createdAt), formatVodDuration(v.durationMs), viewersTxt].filter(Boolean).join(' \u00B7 ');
  return `<div class="vod-card" data-nav tabindex="-1" data-vod="${v.uuid}" data-vod-channel="${channel}" data-vod-source="${v.source ? encodeURIComponent(v.source) : ''}">
    <div class="thumb">
      ${v.thumb
        ? `<img src="${v.thumb}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
           <div class="fallback-tile" style="display:none;">${(channel||'?').slice(0,1).toUpperCase()}</div>`
        : `<div class="fallback-tile">${(channel||'?').slice(0,1).toUpperCase()}</div>`}
      <div class="grad"></div>
    </div>
    ${meta ? `<div class="vod-meta">${meta}</div>` : ''}
    ${v.title ? `<div class="vod-title">${v.title}</div>` : ''}
  </div>`;
}

/* ---------- "Channel page": logo/avatar + VODs + Clips ----------
   Reused in two places: (1) automatically, as the offline screen when
   playChannel() finds the streamer isn't live, and (2) on demand, when the
   viewer taps the streamer's logo from inside the player (openChannelPage
   below) — Kick's own equivalent of a channel's about/videos page. When the
   channel turns out to be live, liveStream (a cardHtml-shaped object) adds
   a "watch live" card so the viewer can jump back into the stream. */
async function renderChannelPage(wrap, channel, avatar, liveStream){
  const letter = (channel || '?').slice(0,1).toUpperCase();
  const avatarHtml = avatar
    ? `<img src="${avatar}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
       <div class="fallback-tile" style="display:none;">${letter}</div>`
    : `<div class="fallback-tile">${letter}</div>`;
  const statusHtml = liveStream
    ? `<div class="chan-sub live">${t('live')}</div>`
    : `<div class="chan-sub">${t('offlineTitle')}</div>`;
  const isFollowing = state.favorites.includes(channel);
  // Shown as its own titled box (separate from the VODs/Clips rows below)
  // so a currently-live channel stands out clearly from past content.
  const watchLiveHtml = liveStream
    ? `<div class="row channel-page-live-row">
         <div class="row-title">${t('liveTitle')}</div>
         <div class="channel-page-watch">${cardHtml({...liveStream, channel, live:true, hero:true})}</div>
       </div>`
    : '';

  wrap.innerHTML = `<div class="offline-wrap">
    <div class="chan-top"><div class="search-back chan-back" id="chan-back" data-nav tabindex="-1">\u2190 ${t('chanBack')}</div></div>
    <div class="chan-head">
      <div class="offline-avatar" id="offline-avatar" title="${t('openChannel')}">${avatarHtml}</div>
      <div class="chan-head-text"><div class="chan-name">${escapeHtml(channel)}</div>${statusHtml}<div class="chan-followers" id="chan-followers"></div></div>
      <div class="chan-follow${isFollowing ? ' on' : ''}" id="chan-follow" data-nav tabindex="-1" data-channel-follow="${escapeHtml(channel)}">${isFollowing ? t('followingBtn') : t('saveFav')}</div>
    </div>
    ${watchLiveHtml}
    <div id="offline-vods">
      <div class="row-title">${t('vodsTitle')}</div>
      <div class="hrow" id="vods-hrow" aria-hidden="true"><div class="sk-card"><div class="sk-thumb sk-shimmer"></div><div class="sk-line sk-shimmer"></div></div><div class="sk-card"><div class="sk-thumb sk-shimmer"></div><div class="sk-line sk-shimmer"></div></div><div class="sk-card"><div class="sk-thumb sk-shimmer"></div><div class="sk-line sk-shimmer"></div></div></div>
    </div>
    <div id="offline-clips">
      <div class="row-title">${CLIPS_LOGO}${t('clipsTitle')}</div>
      <div class="hrow" id="clips-hrow" aria-hidden="true"><div class="sk-card"><div class="sk-thumb sk-shimmer"></div><div class="sk-line sk-shimmer"></div></div><div class="sk-card"><div class="sk-thumb sk-shimmer"></div><div class="sk-line sk-shimmer"></div></div><div class="sk-card"><div class="sk-thumb sk-shimmer"></div><div class="sk-line sk-shimmer"></div></div></div>
    </div>
  </div>`;
  refreshFocusables();

  getChannelFollowers(channel).then(n => {
    if(n == null || state.currentChannel !== channel) return;
    const fe = document.getElementById('chan-followers');
    if(fe) fe.textContent = fmtCompact(n) + ' ' + t('followersSuffix');
  });

  // No cached avatar yet (e.g. opened straight from a favorite card or the
  // logo click)? Look it up now and fill in the big logo once it arrives.
  if(!avatar){
    getChannelAvatar(channel).then(found => {
      if(!found || state.currentChannel !== channel) return;
      const av = document.getElementById('offline-avatar');
      if(av) av.innerHTML = `<img src="${found}" loading="lazy">`;
    });
  }

  const [vods, clips] = await Promise.all([fetchChannelVods(channel), fetchChannelClips(channel)]);
  if(state.currentChannel !== channel) return; // channel changed while fetching

  const vodsRow = document.getElementById('vods-hrow');
  if(vodsRow){
    vodsRow.innerHTML = vods.length
      ? vods.slice(0, 20).map(v => vodCardHtml(v, channel)).join('')
      : `<div class="empty">${t('noVods')}</div>`;
    fadeInEl(vodsRow);
  }

  const clipsRow = document.getElementById('clips-hrow');
  if(clipsRow){
    clipsRow.innerHTML = clips.length
      ? clips.slice(0, 20).map(c => clipCardHtml(c, channel)).join('')
      : `<div class="empty">${t('noClips')}</div>`;
    fadeInEl(clipsRow);
  }
  refreshFocusables();
}

// Opens the channel page on demand — this is what tapping the streamer's
// logo from inside the player does, whether the channel is currently live
// (shows a "watch live" card back to the stream) or offline.
function showPlayerAvatar(channel){
  const av = document.getElementById('player-avatar');
  if(!av || !channel) return;
  av.setAttribute('data-label', t('openChannel'));
  const set = (url) => {
    if(state.currentChannel !== channel) return;
    if(url){ av.innerHTML = `<img src="${url}" loading="lazy">`; av.style.display = ''; } else av.style.display = 'none';
    if(state.screen === 'player') refreshFocusables(focusables[focusIndex]);
  };
  const c = state.avatarCache[channel.toLowerCase()];
  if(c) set(c); else getChannelAvatar(channel).then(set);
}
function snapshotPlayback(){
  if(state.playerMode !== 'native' && state.playerMode !== 'iframe') return null;
  if(state.contentKind === 'live' && state.currentChannel) return { kind:'live', channel: state.currentChannel };
  const v = document.getElementById('native-video');
  const it = state.library.find(x => x.key === state.currentMediaKey);
  if(!it || !v) return null;
  if(state.contentKind === 'vod' || state.contentKind === 'clip')
    return { kind: state.contentKind, id: it.id, channel: it.channel, source: it.source, time: v.currentTime || 0 };
  return null;
}
// Live -> restart at the live edge. VOD/clip -> same minute it was left at.
function resumePlayback(r, retScreen){
  if(r.kind === 'live') playChannel(r.channel);
  else if(r.kind === 'vod'){ state.pendingSeek = r.time; playVod(r.id, r.channel, r.source); }
  else { state.pendingSeek = r.time; playClip(r.id, r.channel, r.source); }
  state.pendingSeek = null;   // already consumed by buildNativePlayer (or the native path was skipped)
  state.returnScreen = retScreen || null;
}
function showPlayerScreen(){
  if(state.screen === 'player') return;
  document.querySelectorAll('.screen').forEach(sc => sc.classList.remove('active'));
  document.getElementById('player-screen').scrollTop = 0;
  document.getElementById('player-screen').classList.add('active');
  document.getElementById('app').classList.add('player-active');
  document.getElementById('app').dataset.screen = 'player';
  state.screen = 'player';
  pushPlayerHistory();
}
function focusChannelFirst(force){
  if(!state.chanFocusPending || state.screen !== 'channel') return;
  const all = Array.from(document.querySelectorAll('#screen-channel [data-nav], #screen-channel .card, #screen-channel .vod-card, #screen-channel .clip-card')).filter(isNavVisible);
  const clipFirst = state.chanFocusClips ? all.find(e => e.classList.contains('clip-card')) : null;
  if(state.chanFocusClips && !clipFirst && force !== true) return;   // wait for the clips row to load
  state.chanFocusClips = false;
  const first = clipFirst || all.find(e => e.id !== 'chan-back' && e.id !== 'chan-follow') || all[0];
  if(first){ state.chanFocusPending = false; refreshFocusables(first); applyFocus(); }
}
function restoreSearchFocus(){
  const ch = state.searchLast; if(!ch || state.screen !== 'search') return;
  const el = Array.from(document.querySelectorAll('#screen-search [data-channel]')).find(e => e.dataset.channel === ch && isNavVisible(e));
  if(el){ refreshFocusables(el); applyFocus(); }
}
function channelBack(){
  const o = state.channelOrigin || {};
  state.channelOrigin = o.parent || null;
  state.chanFocusPending = false;
  if(o.resume){ resumePlayback(o.resume, o.returnScreen); return; }
  if(playerHistoryPushed){ playerHistoryPushed = false; try{ history.back(); }catch(e){} }
  setScreen(o.returnScreen || 'discover');
  restoreSearchFocus();
}

// Channel page = its own screen (not inside the player). Back returns to
// whatever was open before: the same minute of a VOD/clip, the live edge for
// a live stream, or the previous screen (e.g. search with its text).
async function openChannelPage(channel, opts){
  opts = opts || {};
  if(!channel) return;
  if(state.screen !== 'channel'){
    const fromPlayer = state.screen === 'player';
    const resume = (fromPlayer && !opts.noResume) ? snapshotPlayback() : null;
    const ret = fromPlayer ? state.returnScreen : state.screen;
    state.channelOrigin = { resume, returnScreen: ret, parent: ret === 'channel' ? state.channelOrigin : null };
  }
  state.currentChannel = channel;
  disconnectLiveChat();
  stopVodChatReplay();
  closeQualityMenu();
  document.getElementById('chat-overlay').classList.remove('visible');
  clearTimeout(playerUiTimer);
  exitAppFullscreen();
  state.playerMode = null;
  state.contentKind = null;
  state.currentVodUuid = null;
  state.chanFocusPending = true;
  state.chanFocusClips = !!opts.focusClips;
  pushPlayerHistory();
  const wrap = document.getElementById('channel-page-wrap');
  wrap.innerHTML = '';
  setScreen('channel');
  fadeInEl(wrap);

  if(opts.offline){
    await renderChannelPage(wrap, channel, state.avatarCache[channel.toLowerCase()] || null, null);
    focusChannelFirst();
    return;
  }
  // Already know this channel is live right now, from the cached "Live Now"
  // list? Show the full "watch live" card immediately, no network wait.
  const cachedRaw = (state.lastStreams || []).find(s => s.slug && s.slug.toLowerCase() === channel.toLowerCase());
  const cachedLive = cachedRaw ? {
    channel: cachedRaw.slug, title: cachedRaw.stream_title,
    cat: cachedRaw.category ? cachedRaw.category.name : '',
    viewers: cachedRaw.viewer_count, thumb: extractThumb(cachedRaw),
  } : null;
  const p = renderChannelPage(wrap, channel, state.avatarCache[channel.toLowerCase()] || null, cachedLive);
  focusChannelFirst();
  if(!cachedLive){
    const info = await fetchPlaybackInfo(channel);
    if(state.currentChannel !== channel || state.screen !== 'channel') return;
    state.avatarCache[channel.toLowerCase()] = (info && info.avatar) || null;
    renderChannelPage(wrap, channel, info && info.avatar, info && info.isLive ? { channel } : null);
    focusChannelFirst();
  }
  await p;
  focusChannelFirst(true);
}

async function playVod(uuid, channel, encodedSource){
  setClipMode(false);
  if(state.screen !== 'player' && state.screen) state.returnScreen = state.screen;
  showPlayerScreen();
  const wrap = document.getElementById('player-iframe-wrap');
  if(!wrap) return;
  if(state.settings.autoFullscreen) requestAppFullscreen();
  state.contentKind = 'vod';
  state.currentChannel = channel;
  showPlayerAvatar(channel);
  state.currentVodUuid = uuid;
  state.currentMediaKey = 'vod:' + uuid;
  updateViewersCount();
  libRecord('vod', uuid, channel, encodedSource);
  destroyNativePlayer();
  disconnectLiveChat();
  document.getElementById('chat-overlay').classList.remove('visible');
  fadeInEl(document.getElementById('video-stage'));
  wrap.innerHTML = `<div class="empty">${t('loading')}</div>`;
  vidLoading(true);
  const kickUrl = 'https://kick.com/' + encodeURIComponent(channel) + '/videos/' + encodeURIComponent(uuid);
  const sourceUrl = encodedSource ? decodeURIComponent(encodedSource) : null;
  if(sourceUrl){
    const finalUrl = state.proxyWorkerUrl
      ? (state.proxyWorkerUrl + '/proxy?url=' + encodeURIComponent(sourceUrl))
      : sourceUrl;
    try{
      buildNativePlayer(wrap, finalUrl, true);
      state.playerMode = 'native';
      updatePlayerButtonsVisibility();
      document.getElementById('chat-overlay').classList.toggle('visible', !!state.settings.showChat);
      wireChatScrollTracking();
      startVodChatReplay(channel);
      refreshFocusables();
      showPlayerUI();
      return;
    }catch(err){ console.warn('VOD native playback failed:', err); }
  }
  // No direct source, or native playback failed — try Kick's embeddable player.
  if(offlineNoNetCard(wrap)){ updatePlayerButtonsVisibility(); showPlayerUI(); return; }
  try{
    wrap.innerHTML = `<iframe src="https://player.kick.com/video/${encodeURIComponent(uuid)}?autoplay=true"
      allow="autoplay; fullscreen" allowfullscreen style="width:100%;height:100%;border:0;"></iframe>`;
    state.playerMode = 'iframe';
  }catch(err){
    wrap.innerHTML = `<div class="empty">${t('vodPlayFail')}<br><a href="${kickUrl}" target="_blank" rel="noopener" style="color:var(--accent);">${t('watchOnKick')}</a></div>`;
    state.playerMode = 'iframe';
  }
  updatePlayerButtonsVisibility();
  refreshFocusables();
  showPlayerUI();
}

/* ---------- Player: clips ----------
   Same best-effort approach as VODs above, against Kick's unofficial
   per-channel clips endpoint. */
function normalizeClip(c){
  if(!c) return null;
  const id = c.id || c.uuid || c.clip_id;
  if(!id) return null;
  const title = c.clip_title || c.title || '';
  const thumb = c.thumbnail_url || c.thumbnail || extractThumb(c) || c.image || null;
  const durationSec = c.duration_seconds != null ? c.duration_seconds : (c.duration || 0);
  const views = c.view_count != null ? c.view_count : (c.views != null ? c.views : null);
  const createdAt = c.created_at || c.createdAt || null;
  const source = c.video_url || c.clip_url || c.source || null;
  const cr = c.creator || c.clipper || c.created_by || null;
  const creator = cr ? { name: cr.username || cr.slug || cr.name || '', slug: cr.slug || cr.username || '', avatar: cr.profile_pic || cr.profile_picture || cr.avatar || null } : null;
  const vod = c.vod || c.livestream || c.stream || null;
  let fromThumb = null; try{ fromThumb = vod ? extractThumb(vod) : null; }catch(e){}
  const fromTitle = (vod && (vod.session_title || vod.title || vod.stream_title)) || (c.category && c.category.name) || '';
  let vodUuid = null; try{ vodUuid = (vod && ((vod.video && vod.video.uuid) || vod.uuid)) || c.vod_uuid || null; }catch(e){}
  const liveId = c.livestream_id != null ? c.livestream_id : ((vod && (vod.live_stream_id != null ? vod.live_stream_id : vod.id)) != null ? (vod.live_stream_id != null ? vod.live_stream_id : vod.id) : (c.vod_id != null ? c.vod_id : null));
  const startedAt = c.started_at || null;
  const vodStartSec = (c.vod_starts_at != null && isFinite(Number(c.vod_starts_at))) ? Number(c.vod_starts_at) : null;
  const cat = (c.category && (c.category.name || c.category.slug)) || c.category_name || (vod && vod.category && vod.category.name) || '';
  return { id, title, thumb, durationSec, views, createdAt, source, creator, fromTitle, fromThumb: fromThumb || thumb, vodUuid, liveId, startedAt, vodStartSec, cat };
}

async function fetchChannelClips(channel, qs){
  const target = 'https://kick.com/api/v2/channels/' + encodeURIComponent(channel) + '/clips' + (qs || '');
  const attempts = [];
  if(state.proxyWorkerUrl){
    attempts.push(state.proxyWorkerUrl + '/?url=' + encodeURIComponent(target));
  }
  attempts.push(target);
  attempts.push('https://api.allorigins.win/raw?url=' + encodeURIComponent(target));
  attempts.push('https://corsproxy.io/?url=' + encodeURIComponent(target));

  for(const fetchUrl of attempts){
    try{
      const res = await fetch(fetchUrl, { headers:{ 'Accept':'application/json' } });
      if(!res.ok) continue;
      const data = await res.json();
      const list = Array.isArray(data) ? data : (data.clips || data.data || []);
      if(!Array.isArray(list)) continue;
      // Sort most-popular-first (by view count) so the clips bar leads with
      // the streamer's best-known moments rather than just the newest ones.
      return list.map(normalizeClip).filter(Boolean).sort((a,b) => (b.views||0) - (a.views||0));
    }catch(err){
      console.warn('Clip lookup attempt failed:', fetchUrl, err);
    }
  }
  return [];
}

function formatClipDuration(sec){
  if(!sec) return '';
  const m = Math.floor(sec/60), s = Math.round(sec%60);
  return m > 0 ? `${m}m ${s}s` : `${s}s`;
}

function clipCardHtml(c, channel){
  (state.mediaMeta = state.mediaMeta || {})['clip:' + c.id] = { cat:c.cat || '', views:c.views, title:c.title, thumb:c.thumb, durationSec:c.durationSec || 0, date:c.createdAt, creator:c.creator || null, fromTitle:c.fromTitle || '', fromThumb:c.fromThumb || c.thumb || null, vodUuid:c.vodUuid || null, liveId:c.liveId != null ? c.liveId : null, startedAt:c.startedAt || null, vodStartSec:c.vodStartSec != null ? c.vodStartSec : null };
  const viewersTxt = c.views != null ? `${fmtCompact(c.views)} ${t('viewsSuffix')}` : '';
  const meta = [formatVodDate(c.createdAt), formatClipDuration(c.durationSec), viewersTxt].filter(Boolean).join(' \u00B7 ');
  return `<div class="clip-card" data-nav tabindex="-1" data-clip="${c.id}" data-clip-channel="${channel}" data-clip-source="${c.source ? encodeURIComponent(c.source) : ''}">
    <div class="thumb">
      ${c.thumb
        ? `<img src="${c.thumb}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
           <div class="fallback-tile" style="display:none;">${(channel||'?').slice(0,1).toUpperCase()}</div>`
        : `<div class="fallback-tile">${(channel||'?').slice(0,1).toUpperCase()}</div>`}
      <div class="grad"></div>
      ${(c.title || c.cat) ? `<div class="short-title clip-title">${c.cat ? `<span class="clip-cat">${c.cat}</span><br>` : ''}${tagsGray(c.title || '')}</div>` : ''}
    </div>
  </div>`;
}

async function playClip(id, channel, encodedSource){
  if(state.screen !== 'player' && state.screen) state.returnScreen = state.screen;
  showPlayerScreen();
  const wrap = document.getElementById('player-iframe-wrap');
  if(!wrap) return;
  if(state.settings.autoFullscreen) requestAppFullscreen();
  setClipMode(true);
  toggleClipDesc(false);
  state.contentKind = 'clip';
  state.currentChannel = channel;
  showPlayerAvatar(channel);
  state.currentMediaKey = 'clip:' + id;
  updateViewersCount();
  libRecord('clip', id, channel, encodedSource);
  fillClipInfo(id, channel);
  destroyNativePlayer();
  disconnectLiveChat();
  document.getElementById('chat-overlay').classList.remove('visible');
  fadeInEl(document.getElementById('video-stage'));
  wrap.innerHTML = `<div class="empty">${t('loading')}</div>`;
  CLIPUI.showBar = false;
  { const _st = document.getElementById('video-stage'); if(_st){ _st.classList.remove('clip-paused'); _st.classList.add('clip-loading'); } }
  const kickUrl = 'https://kick.com/' + encodeURIComponent(channel) + '/clips/' + encodeURIComponent(id);
  let sourceUrl = encodedSource ? decodeURIComponent(encodedSource) : null;
  const tok = (playClip.tok = (playClip.tok || 0) + 1);
  const mkey = 'clip:' + id;
  // No saved video link (opened from somewhere that didn't carry it): ask Kick for this clip directly.
  if(!sourceUrl){
    const r = await clipResolve(id);
    if(tok !== playClip.tok || state.screen !== 'player' || state.currentMediaKey !== mkey) return;
    if(r){
      sourceUrl = r.source;
      const m = (state.mediaMeta = state.mediaMeta || {})[mkey] || ((state.mediaMeta)[mkey] = {});
      if(!m.title && r.title) m.title = r.title;
      if(!m.thumb && r.thumb) m.thumb = r.thumb;
      if(m.views == null && r.views != null) m.views = r.views;
      if(!m.date && r.createdAt) m.date = r.createdAt;
      if(!m.creator && r.creator) m.creator = r.creator;
      if(!m.fromTitle && r.fromTitle) m.fromTitle = r.fromTitle;
      if(!m.vodUuid && r.vodUuid) m.vodUuid = r.vodUuid;
      if(m.liveId == null && r.liveId != null) m.liveId = r.liveId;
      if(!m.startedAt && r.startedAt) m.startedAt = r.startedAt;
      if(m.vodStartSec == null && r.vodStartSec != null) m.vodStartSec = r.vodStartSec;
      fillClipInfo(id, channel);
    }
  }
  if(sourceUrl){
    const finalUrl = state.proxyWorkerUrl
      ? (state.proxyWorkerUrl + '/proxy?url=' + encodeURIComponent(sourceUrl))
      : sourceUrl;
    try{
      const meta = (state.mediaMeta || {})[mkey] || {};
      buildClipPlayer(wrap, finalUrl, sourceUrl, meta.thumb || '', kickUrl);
      state.playerMode = 'native';
      updatePlayerButtonsVisibility();
      refreshFocusables();
      clipInitialFocus();
      return;
    }catch(err){ console.warn('Clip native playback failed:', err); }
  }
  clipPlayFailCard(wrap, kickUrl);
  clipInitialFocus();
}

async function clipResolve(id){
  const target = 'https://kick.com/api/v2/clips/' + encodeURIComponent(id);
  const attempts = [];
  if(state.proxyWorkerUrl) attempts.push(state.proxyWorkerUrl + '/?url=' + encodeURIComponent(target));
  attempts.push(target);
  for(const u of attempts){
    try{
      const c = new AbortController(); const tm = setTimeout(() => c.abort(), 8000);
      const res = await fetch(u, { headers:{ 'Accept':'application/json' }, signal: c.signal }).finally(() => clearTimeout(tm));
      if(!res.ok) continue;
      const data = await res.json();
      const clip = normalizeClip((data && (data.clip || data.data)) || data);
      if(clip && clip.source) return clip;
    }catch(e){}
  }
  return null;
}

/* ---------- Clip page (v35) ----------
   Framed video on the left; "Clip" label, title, channel and three round
   buttons (follow / download / info) on the right. OK on the title (or the
   info button) opens a card with the date, views and channel. Date and views

const CLIPS_LOGO = '<svg class="clips-logo" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2.6 5.8Q3.8 2.9 6.5 2.4L8.5 5.8zM8.8 2.4H15L17.1 5.8H10.8zM15.4 2.4H17Q19.9 2.8 21.4 5.8H17.5z"/><path fill-rule="evenodd" d="M3 7.5h18v10a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4zM10 11v6.4a.8.8 0 0 0 1.2.7l5.3-3.2a.8.8 0 0 0 0-1.4l-5.3-3.2A.8.8 0 0 0 10 11z"/></svg>';
const CLIP_INFO_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="7.9" r=".7" fill="currentColor"/></svg>';
function setClipMode(on){
  const sc = document.getElementById('player-screen'); if(!sc) return;
  sc.classList.toggle('clip-mode', !!on);
  const vs = document.getElementById('video-stage');
  if(vs){ if(on){ vs.setAttribute('data-nav',''); vs.setAttribute('tabindex','-1'); } else { vs.removeAttribute('data-nav'); vs.removeAttribute('tabindex'); } }
  if(!on){ sc.classList.remove('clip-desc-open'); sc.style.removeProperty('--clip-bg'); if(vs) vs.classList.remove('clip-paused','clip-loading'); CLIPUI.showBar = false; }
}
function clipDescOpen(){ const sc = document.getElementById('player-screen'); return !!(sc && sc.classList.contains('clip-desc-open')); }
function toggleClipDesc(force){
  const sc = document.getElementById('player-screen'); if(!sc) return;
  const open = (force === undefined) ? !sc.classList.contains('clip-desc-open') : !!force;
  const was = sc.classList.contains('clip-desc-open');
  sc.classList.toggle('clip-desc-open', open);
  const b = document.getElementById('clip-info-btn'); if(b) b.classList.toggle('active', open);
  if(open !== was && state.screen === 'player' && sc.classList.contains('clip-mode')){
    const el = document.getElementById(open ? 'cd-chan' : 'clip-title'); if(el) refreshFocusables(el);
  }
}
function clipSetAvatar(boxId, slug, url){
  const box = document.getElementById(boxId); if(!box) return;

// Remote rules for the clip page (physical left = video, right = info panel).
function clipKeyHandler(k, isBack, hidden){
  const sc = document.getElementById('player-screen');
  if(!sc || !sc.classList.contains('clip-mode')) return false;
  const cur = focusables[focusIndex];
  const isL = k === 'ArrowLeft', isR = k === 'ArrowRight', isU = k === 'ArrowUp', isD = k === 'ArrowDown';
  const focusEl = (id) => { const e = document.getElementById(id); if(e) refreshFocusables(e); };
  const toVideo = () => focusEl('video-stage');
  const open = clipDescOpen();
  if(isBack && open){ toggleClipDesc(false); return true; }
  if(cur && cur.id === 'video-stage'){
    if(k === 'Enter'){ clipTogglePlay(); return true; }
    if(isL){ clipStep(-5); return true; }                       // paused + bar: back 5s (does nothing while playing)
    if(isR){
      if(CLIPUI.showBar){ clipStep(5); return true; }           // paused + bar: forward 5s
      const heart = document.getElementById('clip-fav');        // playing, bar hidden: jump to the heart
      if(heart && isNavVisible(heart)) refreshFocusables(heart);
      return true;
    }
    if(isU){ clipGo(-1); return true; }                         // previous clip, paused or playing
    if(isD){ clipGo(1); return true; }                          // next clip, paused or playing
    if(isBack) return false;
    return true;
  }
  const inInfo = !!(cur && cur.closest && cur.closest('#clip-info'));
  if(inInfo){
    if(k === 'Enter'){ activate(cur); return true; }
    if(isBack) return false;
    if(open){
      if(isL){ toVideo(); return true; }
      if(isU && cur.id === 'cd-chan'){ focusEl('cd-by'); return true; }
      if(isD && cur.id === 'cd-by'){ focusEl('cd-chan'); return true; }
      if(isD && cur.id === 'cd-chan'){ const fr = document.getElementById('cd-from'); if(fr && isNavVisible(fr)) refreshFocusables(fr); return true; }
      if(isU && cur.id === 'cd-from'){ focusEl('cd-chan'); return true; }
      return true;
    }
    const btns = Array.from(document.querySelectorAll('#clip-actions [data-nav]')).filter(isNavVisible)
      .sort((a, b) => a.getBoundingClientRect().left - b.getBoundingClientRect().left);
    if(cur.id === 'clip-title'){
      if(isL){ toVideo(); return true; }
      if(isD){ focusEl('clip-chan-box'); return true; }
      return true;
    }
    if(cur.id === 'clip-chan-box'){
      if(isL){ toVideo(); return true; }
      if(isU){ focusEl('clip-title'); return true; }
      if(isD){ const first = Array.from(document.querySelectorAll('#clip-actions [data-nav]')).find(isNavVisible); if(first) refreshFocusables(first); return true; }
      return true;
    }
    const i = btns.indexOf(cur);
    if(isL){ if(i > 0) refreshFocusables(btns[i-1]); else toVideo(); return true; }
    if(isR){ if(i >= 0 && i < btns.length - 1) refreshFocusables(btns[i+1]); return true; }
    if(isU){ focusEl('clip-chan-box'); return true; }
    if(isD){
      const sg = Array.from(document.querySelectorAll('#player-suggestions [data-nav]')).find(isNavVisible);
      if(sg) refreshFocusables(sg);
      return true;
    }
    return true;
  }
  return false;
}

/* ---------- v39: dedicated clip player ----------
   While a clip plays NOTHING is drawn over it. Pausing (OK) shows only the long bar with minutes.
   Left / Right step 5 seconds and keep the clip PAUSED: it plays again only when OK is pressed. */
var CLIPUI = { pos:0, showBar:false };
const CLIP_BLANK = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
function isClipModeOn(){ const sc = document.getElementById('player-screen'); return !!(sc && sc.classList.contains('clip-mode')); }
function clipVideo(){ return document.getElementById('native-video'); }
function clipFmt(sec){ sec = Math.max(0, Math.floor(sec || 0)); const m = Math.floor(sec / 60), r = sec % 60; return m + ':' + (r < 10 ? '0' : '') + r; }
function clipPaintBar(){
  const v = clipVideo(); if(!v) return;
  const fill = document.getElementById('cb-fill'), knob = document.getElementById('cb-knob');
  const cEl = document.getElementById('cb-cur'), dEl = document.getElementById('cb-dur');
  if(!fill || !cEl || !dEl) return;
  const dur = (isFinite(v.duration) && v.duration > 0) ? v.duration : 0;
  const cur = dur ? Math.min(CLIPUI.pos, dur) : CLIPUI.pos;
  const pct = dur ? Math.min(100, Math.max(0, cur / dur * 100)) : 0;
  fill.style.width = pct + '%'; if(knob) knob.style.left = pct + '%';
  cEl.textContent = clipFmt(cur); dEl.textContent = clipFmt(dur);
}
function clipSetBar(on){
  const st = document.getElementById('video-stage');
  CLIPUI.showBar = !!on;
  if(st){ st.classList.toggle('clip-paused', !!on); if(on) st.classList.remove('clip-loading'); }
  if(on){ const v = clipVideo(); if(v) CLIPUI.pos = v.currentTime || 0; clipPaintBar(); }
}
function clipTogglePlay(){
  const v = clipVideo(); if(!v) return;
  if(v.paused || v.ended){
    clipSetBar(false);
    state.userPaused = false;
    const p = v.play();
    if(p && p.catch) p.catch(() => { clipSetBar(true); });
  } else {
    state.userPaused = true;
    v.pause();
    clipSetBar(true);
  }
}
function clipStep(delta){
  const v = clipVideo(); if(!v) return;
  if(!v.paused || !CLIPUI.showBar) return;     // the bar (and stepping) exist only after OK paused the clip
  const dur = (isFinite(v.duration) && v.duration > 0) ? v.duration : 0;
  let target = CLIPUI.pos + delta;
  if(target < 0) target = 0;
  if(dur && target > dur) target = dur;
  CLIPUI.pos = target;
  try{ v.currentTime = target; }catch(e){}     // stays paused: only OK resumes playback
  clipPaintBar();
}

/* ---------- v40: Shorts-style paging — Up / Down on the clip moves to the previous / next clip ---------- */
function clipQueueFromCard(el){
  try{
    const box = el.parentElement; if(!box){ state.clipQueue = null; return; }
    state.clipQueue = Array.from(box.querySelectorAll('.clip-card')).map(c => ({
      id: c.dataset.clip, channel: c.dataset.clipChannel, source: c.dataset.clipSource || ''
    })).filter(x => x.id);
  }catch(e){ state.clipQueue = null; }
}
function clipQueueIdx(){
  const q = state.clipQueue; if(!q || q.length < 2) return -1;
  const key = state.currentMediaKey || '';
  for(let i = 0; i < q.length; i++){ if('clip:' + q[i].id === key) return i; }
  return -1;
}
function clipGo(dir){
  const q = state.clipQueue, i = clipQueueIdx();
  if(i < 0) return false;
  const nowMs = Date.now();
  if(clipGo.last && nowMs - clipGo.last < 700) return true;     // too fast: ignore
  clipGo.last = nowMs;
  state.userPaused = false;
  const j = i + dir;
  if(j < 0 || j >= q.length) return dir < 0;      // first clip: Up does nothing; last clip: Down falls through to the info panel
  const it = q[j];
  const st = document.getElementById('video-stage'), info = document.getElementById('clip-info');
  const cls = dir > 0 ? 'clip-slide-next' : 'clip-slide-prev';
  [st, info].forEach(e => { if(e){ e.classList.remove('clip-slide-next','clip-slide-prev'); void e.offsetWidth; e.classList.add(cls); } });
  setTimeout(() => { [st, info].forEach(e => { if(e) e.classList.remove('clip-slide-next','clip-slide-prev'); }); }, 450);
  clipSetBar(false);
  playClip(it.id, it.channel, it.source);
  return true;
}

async function clipOpenSourceVod(){

/* ---------- v42: live + VOD load like clips (spinner, no grey play-icon poster) ---------- */
const VID_BLANK = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
function vidLoading(on){
  const st = document.getElementById('video-stage'); if(!st) return;
  if(on && st.closest && st.closest('#player-screen.clip-mode')) return;   // clips have their own spinner
  st.classList.toggle('vid-loading', !!on);
}
function clipPlayFailCard(wrap, kickUrl){
  const st = document.getElementById('video-stage'); if(st) st.classList.remove('clip-loading');
  wrap.innerHTML = `<div class="empty">${t('clipPlayFail')}<br><a href="${kickUrl}" target="_blank" rel="noopener" style="color:var(--accent);">${t('watchOnKick')}</a></div>`;
  state.playerMode = 'iframe';
  updatePlayerButtonsVisibility();
  refreshFocusables();
}
function buildClipPlayer(wrap, finalUrl, sourceUrl, thumb, kickUrl){
  state.currentPlayerUrl = finalUrl;
  const seekTo = state.pendingSeek; state.pendingSeek = null;
  const stage = document.getElementById('video-stage');
  CLIPUI.showBar = false; CLIPUI.pos = 0; state.userPaused = false;
  if(stage){ stage.classList.remove('clip-paused'); stage.classList.add('clip-loading'); }
  wrap.innerHTML = '<video id="native-video" playsinline preload="auto"></video>';
  const video = document.getElementById('native-video');
  video.poster = CLIP_BLANK;                       // no grey "default play" poster while loading
  let started = false, playedOnce = false, idx = -1, watchdog = null, hls = null, lastPlayAt = 0, autoResumes = 0;
  if(thumb){ const im = new Image(); im.onload = () => { if(video.isConnected && !playedOnce) video.poster = thumb; }; im.src = thumb; }

  const isMp4 = /\.(mp4|webm|mov)(\?|#|$)/i.test(sourceUrl);
  const hlsOk = !!(window.Hls && Hls.isSupported());
  // v45: try the clip's own address FIRST (fast); the Cloudflare proxy (slow + every segment goes through it) is only the fallback
  const plan = [];
  const viaProxy = finalUrl !== sourceUrl;
  let pref = 'direct'; try{ pref = localStorage.getItem('livescreen_clip_route') || 'direct'; }catch(e){}
  const proxyFirst = viaProxy && pref !== 'direct';
  const addDirect = () => {
    if(isMp4){ plan.push({ t:'native', u:sourceUrl, n:'mp4 direct', r:'direct' }); return; }
    if(hlsOk) plan.push({ t:'hls', u:sourceUrl, n:'hls direct', r:'direct' });
    plan.push({ t:'native', u:sourceUrl, n:'native direct', r:'direct' });
  };
  const addProxy = () => {
    if(!viaProxy) return;
    if(isMp4){ plan.push({ t:'native', u:finalUrl, n:'mp4 proxy', r:'proxy' }); return; }
    if(hlsOk) plan.push({ t:'hls', u:finalUrl, n:'hls proxy', r:'proxy' });
    plan.push({ t:'native', u:finalUrl, n:'native proxy', r:'proxy' });
  };
  if(proxyFirst){ addProxy(); addDirect(); } else { addDirect(); addProxy(); }
  const dbg = () => {};
  const clearDog = () => { if(watchdog){ clearTimeout(watchdog); watchdog = null; } };
  const ready = () => { clearDog(); if(!video.isConnected) return; if(stage && !CLIPUI.showBar) stage.classList.remove('clip-loading'); };
  const begin = () => {
    if(started) return; started = true;
    if(seekTo != null && seekTo > 1){ try{ if(Math.abs(video.currentTime - seekTo) > 0.5) video.currentTime = seekTo; }catch(e){} }
    const tryPlay = (muted, n) => {
      if(!video.isConnected) return;
      video.muted = muted;
      const p = video.play();
      if(p && p.catch) p.catch(() => {
        if(!video.isConnected) return;
        if(!muted) tryPlay(true, n);                                   // sound refused: try muted
        else if(n < 4) setTimeout(() => { if(video.isConnected && video.paused && !state.userPaused) tryPlay(true, n + 1); }, 450);
        else { ready(); clipSetBar(true); }                            // really can't start: show the bar
      });
    };
    tryPlay(false, 0);
  };
  const next = () => {
    clearDog();
    if(hls){ try{ hls.destroy(); }catch(e){} if(state.hls === hls) state.hls = null; hls = null; }
    if(!video.isConnected) return;                 // the person already left this clip
    video.onerror = null;
    idx++; started = false;
    if(idx >= plan.length){ clipPlayFailCard(wrap, kickUrl); return; }
    const step = plan[idx];
    dbg('v45 · ' + (step.n || step.t) + ' · ' + (idx + 1) + '/' + plan.length);
    watchdog = setTimeout(() => { if(!playedOnce && video.isConnected && video.readyState >= 2){ begin(); watchdog = setTimeout(next, 6000); } else next(); }, 6500);
    if(step.t === 'hls'){
      const cfg = { enableWorker:true, maxBufferSize:60 * 1000 * 1000, maxBufferLength:30, maxMaxBufferLength:60, backBufferLength:20, nudgeMaxRetry:6,
        manifestLoadingMaxRetry:1, manifestLoadingTimeOut:6000, levelLoadingMaxRetry:1, levelLoadingTimeOut:6000,
        fragLoadingMaxRetry:4, fragLoadingRetryDelay:500, fragLoadingTimeOut:10000 };
      if(seekTo != null && seekTo > 1) cfg.startPosition = seekTo;
      const h = new Hls(cfg); hls = h; state.hls = h;
      h.loadSource(step.u); h.attachMedia(video);
      h.on(Hls.Events.MANIFEST_PARSED, () => { try{ applyDefaultQuality(h); }catch(e){} begin(); });
      h.on(Hls.Events.ERROR, (evt, d) => {
        if(!d || !d.fatal) return;
        dbg('v45 · ' + (step.n || 'hls') + ' fail: ' + (d.details || d.type));
        if(playedOnce){
          if(d.type === Hls.ErrorTypes.NETWORK_ERROR) h.startLoad();
          else if(d.type === Hls.ErrorTypes.MEDIA_ERROR) h.recoverMediaError();
          return;
        }
        next();
      });
    } else {
      video.onerror = () => { if(!playedOnce) next(); };
      video.src = step.u; video.load();
    }
  };

  video.addEventListener('loadedmetadata', () => { if(video.isConnected) begin(); });
  video.addEventListener('canplay', ready);
  video.addEventListener('playing', () => {
    if(!video.isConnected) return;
    if(!playedOnce && idx >= 0 && plan[idx] && plan[idx].r){ try{ localStorage.setItem('livescreen_clip_route', plan[idx].r); }catch(e){} }
    playedOnce = true; lastPlayAt = Date.now(); ready(); clipSetBar(false);
  });
  video.addEventListener('play', () => { if(video.isConnected && playedOnce) clipSetBar(false); });
  video.addEventListener('waiting', () => { if(video.isConnected && stage && !CLIPUI.showBar) stage.classList.add('clip-loading'); });
  video.addEventListener('pause', () => {
    if(state.screen !== 'player' || !video.isConnected) return;
    if(video.ended){ clipSetBar(true); return; }
    if(!playedOnce) return;
    // paused by the system right after starting (not by the person): carry on instead of stopping + showing the bar
    if(!state.userPaused && Date.now() - lastPlayAt < 6000 && autoResumes < 3){
      autoResumes++;
      setTimeout(() => {
        if(!video.isConnected || !video.paused || state.userPaused) return;

      }, 150);
      return;
    }
    clipSetBar(true);
  });
  video.addEventListener('ended', () => { if(!video.isConnected) return; clipSetBar(true); CLIPUI.pos = isFinite(video.duration) ? video.duration : video.currentTime; clipPaintBar(); });
  ['timeupdate','durationchange','loadedmetadata','seeked'].forEach(ev => video.addEventListener(ev, () => { if(video.isConnected && CLIPUI.showBar) clipPaintBar(); }));

  // v47: freeze guard. If the picture stops moving while it should be playing, nudge it, reload it,
  // and finally switch to the other route (direct <-> proxy) and carry on from the same second.
  let lastT = -1, frozenFor = 0, fixLevel = 0;
  const guard = setInterval(() => {
    if(!video.isConnected){ clearInterval(guard); return; }
    if(!playedOnce || video.paused || video.ended || state.userPaused || state.screen !== 'player'){ lastT = -1; frozenFor = 0; fixLevel = 0; return; }
    const t = video.currentTime;
    if(Math.abs(t - lastT) < 0.05){ frozenFor += 1; } else { frozenFor = 0; fixLevel = 0; }
    lastT = t;
    if(frozenFor === 4 && fixLevel === 0){ fixLevel = 1; try{ video.currentTime = t + 0.1; }catch(e){} if(hls){ try{ hls.recoverMediaError(); }catch(e){} } }
    else if(frozenFor === 8 && fixLevel === 1){ fixLevel = 2; if(hls){ try{ hls.startLoad(Math.max(0, t - 0.5)); }catch(e){} } else { try{ const u = video.src; video.src = u; video.currentTime = t; video.play().catch(() => {}); }catch(e){} } }
    else if(frozenFor >= 13 && fixLevel === 2 && viaProxy){
      clearInterval(guard);
      try{ const cur = (plan[idx] && plan[idx].r) || 'direct'; localStorage.setItem('livescreen_clip_route', cur === 'direct' ? 'proxy' : 'direct'); }catch(e){}
      state.pendingSeek = t;
      buildClipPlayer(wrap, finalUrl, sourceUrl, thumb, kickUrl);
    }
  }, 1000);
