/* ---------- Account sync (Kick login -> cloud copy of favorites / history) ----------
   Only runs while the viewer is logged in with Kick. Synced: favorites, history
   (library + watch history), blocked channels, XP/streak. NOT synced: settings,
   tokens, client ids, downloads. Per list the newest edit wins; when both the
   device and the cloud changed (or on first link) the lists are merged. */
const SYNC_FN = '/.netlify/functions/sync';
const SYNC_MAP = { favorites:'livescreen_favorites', library:'livescreen_library', blocked:'livescreen_blocked', watch_history:'livescreen_watch_history', account:'livescreen_account' };
const SYNC_META_KEY = 'livescreen_sync_meta';
/*SYNC-CORE-START*/
function syncHas(v){ return Array.isArray(v) ? v.length > 0 : (v !== null && typeof v === 'object'); }
function syncMerge(name, a, b){            // a = this device, b = cloud
  if(name === 'favorites' || name === 'blocked') return Array.from(new Set([].concat(b || [], a || [])));
  if(name === 'library'){
    const m = new Map();
    [].concat(b || [], a || []).forEach(it => { if(!it || !it.key) return; const o = m.get(it.key); if(!o || (it.ts || 0) > (o.ts || 0)) m.set(it.key, it); });
    return Array.from(m.values()).sort((x, y) => (y.ts || 0) - (x.ts || 0)).slice(0, 80);
  }
  if(name === 'watch_history'){
    const seen = new Set();
    const all = [].concat(b || [], a || []).filter(h => { if(!h) return false; const k = h.channel + '|' + h.ts; if(seen.has(k)) return false; seen.add(k); return true; });
    all.sort((x, y) => (x.ts || 0) - (y.ts || 0));
    return all.slice(-60);
  }
  if(name === 'account') return ((a && a.xp) || 0) >= ((b && b.xp) || 0) ? (a || b) : b;
  return a;
}
// local: {name: value|null}, meta: {name: {b, t, d}}, remote: {name: {v, t}}
//   b = cloud version (its t) this device last synced with, t = time of the newest local edit, d = local edits not uploaded yet
function syncPlan(local, meta, remote, now){
  const out = { apply:{}, push:{}, meta:{} };
  Object.keys(SYNC_MAP).forEach(name => {
    const l = local[name], m = meta[name], r = remote[name], hasL = syncHas(l);
    let nm = m ? { b:m.b || 0, t:m.t || 0, d:!!m.d, x:!!m.x } : null;
    if(!r){
      if(hasL){ const t = (m && m.d && m.t) || now; out.push[name] = { v:l, t }; nm = { b:(m && m.b) || 0, t, d:true }; }
    } else if(!m){                                            // never synced, no local edits recorded
      if(hasL){ const v = syncMerge(name, l, r.v), t = Math.max(now, r.t + 1); out.apply[name] = v; out.push[name] = { v, t }; nm = { b:0, t, d:true }; }
      else { out.apply[name] = r.v; nm = { b:r.t, t:r.t, d:false }; }
    } else if(!m.d){                                          // nothing local to upload
      if(r.t > m.b){ out.apply[name] = r.v; nm = { b:r.t, t:r.t, d:false }; }
    } else if(r.t > m.b){                                     // cloud changed since our last sync AND we edited: merge
      const v = syncMerge(name, l, r.v), t = Math.max(now, r.t + 1);
      out.apply[name] = v; out.push[name] = { v, t }; nm = { b:m.b, t, d:true };
    } else if(l !== null && l !== undefined){                 // only this device changed
      if(name === 'favorites' && !hasL && syncHas(r.v) && !m.x){   // list is empty but nobody cleared it on purpose: keep the cloud copy
        out.apply[name] = r.v; nm = { b:r.t, t:r.t, d:false, x:false };
      } else out.push[name] = { v:l, t:Math.max(m.t, r.t) };
    }
    if(nm) out.meta[name] = nm;
  });
  return out;
}
/*SYNC-CORE-END*/
let syncBusy = false, syncAgain = false, syncTimer = null, syncTimerAt = 0, syncApplying = false, syncIntervalId = null;
function syncMetaGet(){ try{ return JSON.parse(localStorage.getItem(SYNC_META_KEY) || '{}') || {}; }catch(e){ return {}; } }
function syncMetaSet(m){ try{ window.__lsRawSet(SYNC_META_KEY, JSON.stringify(m)); }catch(e){} }
function syncLoggedIn(){ const a = loadKickAuth(); return !!(a && a.access_token); }
function syncMarkClear(name){          // call right after a deliberate "empty the list" action
  try{ const m = syncMetaGet(); if(m[name]){ m[name].x = true; syncMetaSet(m); } }catch(e){}
}
function syncMarkDirty(name){
  const m = syncMetaGet();
  m[name] = { b: (m[name] && m[name].b) || 0, t: Date.now(), d: true };
  syncMetaSet(m);
  if(syncLoggedIn()) syncSchedule((name === 'library' || name === 'watch_history') ? 10000 : 1500);
}
function syncSchedule(ms){
  const due = Date.now() + ms;
  if(syncTimer){ if(due >= syncTimerAt) return; clearTimeout(syncTimer); }   // keep the earliest pending upload
  syncTimerAt = due;
  syncTimer = setTimeout(() => { syncTimer = null; syncTimerAt = 0; syncNow(); }, ms);
}
(function installSyncHook(){
  const proto = Storage.prototype, origSet = proto.setItem;
  window.__lsRawSet = function(k, v){ origSet.call(localStorage, k, v); };
  const byKey = {}; Object.keys(SYNC_MAP).forEach(n => { byKey[SYNC_MAP[n]] = n; });
  proto.setItem = function(k, v){
    origSet.call(this, k, v);
    if(this === localStorage && byKey[k] && !syncApplying){ try{ syncMarkDirty(byKey[k]); }catch(e){} }
  };
})();
async function syncRefreshToken(auth){
  try{
    const r = await fetch(KICK_FN + '?action=refresh', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ refresh_token: auth.refresh_token }) });
    const d = await r.json();
    if(d && d.access_token){ saveKickAuth(Object.assign({}, auth, d, { obtained_at: Date.now() })); return true; }
  }catch(e){}
  return false;
}
async function syncRequest(method, body, keepalive){
  for(let attempt = 0; attempt < 2; attempt++){
    const auth = loadKickAuth();
    if(!auth || !auth.access_token) throw new Error('no_auth');
    const headers = { 'Authorization': 'Bearer ' + auth.access_token };
    if(body) headers['Content-Type'] = 'application/json';
    const r = await fetch(SYNC_FN, { method, headers, body: body ? JSON.stringify(body) : undefined, keepalive: !!keepalive });
    if(r.status === 401 && attempt === 0 && auth.refresh_token && await syncRefreshToken(auth)) continue;
    if(!r.ok) throw new Error('sync_' + r.status);
    return await r.json();
  }
  throw new Error('sync_failed');
}
function syncReadLocal(){
  const out = {};
  Object.keys(SYNC_MAP).forEach(n => { try{ const raw = localStorage.getItem(SYNC_MAP[n]); out[n] = raw == null ? null : JSON.parse(raw); }catch(e){ out[n] = null; } });
  return out;
}
function syncApply(name, v){
  syncApplying = true;
  try{ window.__lsRawSet(SYNC_MAP[name], JSON.stringify(v)); }finally{ syncApplying = false; }
  if(name === 'favorites') state.favorites = Array.isArray(v) ? v : [];
  else if(name === 'library') state.library = Array.isArray(v) ? v.slice(0, 80) : [];
  else if(name === 'blocked') state.blocked = Array.isArray(v) ? v : [];
  else if(name === 'watch_history') state.watchHistory = Array.isArray(v) ? v : [];
  else if(name === 'account' && v && typeof v === 'object') state.account = v;
}
function syncRefreshUI(){
  try{
    if(state.screen === 'favorites') renderFavorites();
    if(state.screen === 'library') renderLibrary();
    if(state.screen === 'settings') renderAccountCard();
    if(typeof refreshFocusables === 'function') refreshFocusables();
  }catch(e){}
}
async function syncNow(){
  if(!syncLoggedIn() || navigator.onLine === false) return;
  if(syncBusy){ syncAgain = true; return; }
  syncBusy = true;
  try{
    const remote = (await syncRequest('GET')).keys || {};
    const plan = syncPlan(syncReadLocal(), syncMetaGet(), remote, Date.now());
    Object.keys(plan.apply).forEach(n => syncApply(n, plan.apply[n]));
    syncMetaSet(plan.meta);
    if(Object.keys(plan.apply).length) syncRefreshUI();
    const names = Object.keys(plan.push);
    if(names.length){
      const resp = await syncRequest('PUT', { keys: plan.push });
      const cur = syncMetaGet();
      names.forEach(n => {
        const pt = plan.push[n].t, c = cur[n] || {};
        if(!(resp.keys && resp.keys[n] && resp.keys[n].t === pt)) return;      // cloud kept a newer copy: stay dirty, next sync merges
        cur[n] = (c.d && c.t > pt) ? { b: pt, t: c.t, d: true } : { b: pt, t: pt, d: false };   // keep edits made during the upload
      });
      syncMetaSet(cur);
    }
  }catch(e){ /* silent: next trigger retries */ }
  finally{ syncBusy = false; if(syncAgain){ syncAgain = false; syncSchedule(3000); } }
}
function syncFlush(){                                          // app going to background: push pending edits right away
  if(!syncLoggedIn()) return;
  const m = syncMetaGet(), local = syncReadLocal(), push = {};
  Object.keys(SYNC_MAP).forEach(n => { if(m[n] && m[n].d && syncHas(local[n])) push[n] = { v: local[n], t: m[n].t }; });
  if(Object.keys(push).length) syncRequest('PUT', { keys: push }, true).then(resp => {
    const cur = syncMetaGet();
    Object.keys(push).forEach(n => { const c = cur[n]; if(c && c.t === push[n].t && resp.keys && resp.keys[n] && resp.keys[n].t === push[n].t) cur[n] = { b: c.t, t: c.t, d: false }; });
    syncMetaSet(cur);
  }).catch(() => {});
}
function syncReset(){                                          // on Kick logout: forget sync state, keep local data
  try{ localStorage.removeItem(SYNC_META_KEY); }catch(e){}
  if(syncTimer){ clearTimeout(syncTimer); syncTimer = null; syncTimerAt = 0; }
}
function syncStart(){
  if(syncIntervalId) return;
  syncIntervalId = setInterval(() => { if(!document.hidden) syncNow(); }, 5 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if(document.hidden) syncFlush(); else syncNow(); });
  window.addEventListener('online', () => syncNow());
}


/* ---------- v39: load everything that belongs to the account BEFORE Home is shown ----------
   profile picture + name, cloud data (history, follows, level), followed-channel avatars, recent history thumbnails. */
function lsImgLoad(u){ return new Promise(res => { try{ const im = new Image(); im.onload = im.onerror = () => res(); im.src = u; }catch(e){ res(); } }); }
async function lsPreloadAccount(){
  const t0 = Date.now();
  const cap = (p, ms) => Promise.race([Promise.resolve(p).catch(() => {}), new Promise(r => setTimeout(r, ms))]);
  await new Promise(r => setTimeout(r, 0));          // let the boot chain below register window.__lsAcctReady first
  // 1) account data: profile + cloud sync (history, follows, level, blocked)
  await cap(window.__lsAcctReady, 15000);
  try{ renderNavAccount(); renderAccountCard(); renderKickAuthUI(); }catch(e){}
  const ku = state.kickUser;
  const pic = ku && (ku.profile_picture || ku.profile_pic || ku.profilepic);
  if(pic && window.lsLoaderSetPic) window.lsLoaderSetPic(pic);
  // 2) pictures: own avatar, followed channels, recent history
  const jobs = [];
  if(pic) jobs.push(lsImgLoad(pic));
  const chans = [];
  (state.favorites || []).slice(0, 16).forEach(c => { if(c && chans.indexOf(c) < 0) chans.push(c); });
  (state.library || []).slice(0, 10).forEach(it => {
    if(it && it.channel && chans.indexOf(it.channel) < 0) chans.push(it.channel);
    if(it && it.thumb) jobs.push(lsImgLoad(it.thumb));
  });
  chans.forEach(c => { jobs.push(getChannelAvatar(c).then(u => u ? lsImgLoad(u) : null).catch(() => {})); });
  await cap(Promise.all(jobs), 9000);
  try{ if(typeof syncRefreshUI === 'function') syncRefreshUI(); }catch(e){}
  // 3) keep the loading screen up long enough that the ring is seen turning (no flash)
  const wait = 1100 - (Date.now() - t0);
  if(wait > 0) await new Promise(r => setTimeout(r, wait));
}

/* ---------- Login gate: first launch = activation screen (QR) with an instant "Continue as guest";
   later launches = "Who's watching?". Nothing here waits on the network before letting a guest in. ---------- */
(function(){
  const LS_ACC = 'ls_accounts', LS_DONE = 'ls_gate_done', LS_ACTIVE = 'ls_active';
  const LINK_FN = '/.netlify/functions/tv-link';
  const gate = document.getElementById('ls-gate');
  const vWho = document.getElementById('g-who'), vLink = document.getElementById('g-link');
  let linkTok = 0, pollTimer = null, addMode = false, view = '', fromSettings = false;

  const accounts = () => { try{ const a = JSON.parse(localStorage.getItem(LS_ACC) || '[]'); return Array.isArray(a) ? a : []; }catch(e){ return []; } };
  const saveAccounts = a => { try{ localStorage.setItem(LS_ACC, JSON.stringify(a)); }catch(e){} };
  const uId = u => u ? String(u.user_id || u.id || u.username || u.name || '') : '';
  const uName = u => (u && (u.username || u.name)) || '';
  const uPic = u => (u && (u.profile_picture || u.profile_pic || u.profilepic)) || '';
  const ftimeout = (url, opts, ms) => { const c = new AbortController(); const id = setTimeout(() => c.abort(), ms || 8000); return fetch(url, Object.assign({}, opts, { signal: c.signal })).finally(() => clearTimeout(id)); };

  window.lsAccountSync = function(){
    const auth = loadKickAuth(), u = state.kickUser;
    if(!auth || !auth.access_token || !u) return;
    const id = uId(u); if(!id) return;
    const list = accounts().filter(a => a.id !== id && a.id !== 'legacy' && !(/^k\d{10,}$/.test(String(a.id)) && a.name === 'Kick'));
    list.push({ id, name: uName(u) || 'Kick', avatar: uPic(u), auth });
    saveAccounts(list); try{ localStorage.setItem(LS_ACTIVE, id); }catch(e){}
  };
  window.lsAuthUpdate = function(auth){
    const id = localStorage.getItem(LS_ACTIVE); if(!id || id === 'guest') return;
    const list = accounts(), a = list.find(x => x.id === id);
    if(a){ a.auth = auth; saveAccounts(list); }
  };
  window.lsAccountRemoveActive = function(){
    const id = localStorage.getItem(LS_ACTIVE); if(!id || id === 'guest') return;
    saveAccounts(accounts().filter(a => a.id !== id));
    PKEYS_CLEAR(id);
    try{ localStorage.setItem(LS_ACTIVE, 'guest'); sessionStorage.setItem('ls_skip_gate', '1'); }catch(e){}
    setTimeout(() => location.reload(), 60);
  };
  function stopPoll(){ linkTok++; if(pollTimer){ clearTimeout(pollTimer); pollTimer = null; } }
  function focusOn(el){
    refreshFocusables();
    const i = focusables.indexOf(el);
    focusIndex = i >= 0 ? i : 0;
    applyFocus();
  }
  function close(){
    stopPoll();
    try{ localStorage.setItem(LS_DONE, '1'); }catch(e){}
    gate.classList.remove('show'); gate.setAttribute('aria-hidden', 'true');
    window.__lsGateOpen = false; fromSettings = false;
    try{ refreshFocusables(); }catch(e){}
    if(window.__lsGateResolve){ window.__lsGateResolve(); window.__lsGateResolve = null; }
  }

  /* Per-profile data: favorites, library, blocked, history, account level/streak, sync state and last channel
     live in the normal keys for the ACTIVE profile only; the others are parked under ls_pd:<id>:<key>.
     Settings (language, quality, client ids ...) stay shared on the device. */
  const PKEYS = ['livescreen_favorites','livescreen_library','livescreen_blocked','livescreen_watch_history','livescreen_account','livescreen_sync_meta','livescreen_last_channel'];
  const rawSet = (k, v) => { if(window.__lsRawSet) window.__lsRawSet(k, v); else localStorage.setItem(k, v); };
  function swapData(from, to){
    PKEYS.forEach(k => { const v = localStorage.getItem(k); if(v != null) rawSet('ls_pd:' + from + ':' + k, v); else localStorage.removeItem('ls_pd:' + from + ':' + k); });
    PKEYS.forEach(k => { const v = localStorage.getItem('ls_pd:' + to + ':' + k); if(v != null) rawSet(k, v); else localStorage.removeItem(k); });
  }
  function PKEYS_CLEAR(id){ swapData(id, 'guest'); PKEYS.forEach(k => localStorage.removeItem('ls_pd:' + id + ':' + k)); }
  function switchTo(id, authOrNull){
    const cur = localStorage.getItem(LS_ACTIVE) || 'guest';
    const acc = id === 'guest' ? null : accounts().find(a => a.id === id);
    const info = id === 'guest' ? { name: t('acctGuestName'), guest: true } : { name: (acc && acc.name) || 'Kick', pic: (acc && acc.avatar) || '' };
    try{ localStorage.setItem(LS_DONE, '1'); }catch(e){}
    if(cur !== id) swapData(cur, id);
    try{
      localStorage.setItem(LS_ACTIVE, id);
      if(authOrNull) localStorage.setItem('kickAuth', JSON.stringify(authOrNull)); else localStorage.removeItem('kickAuth');
    }catch(e){}
    if(cur === id){
      if(!authOrNull) state.kickUser = null;
      try{ renderKickAuthUI(); renderAccountCard(); }catch(e){}
      stopPoll();
      if(window.lsLoaderShow) window.lsLoaderShow(info);
      lsPreloadAccount().catch(() => {}).then(() => { close(); if(window.lsLoaderHide) window.lsLoaderHide(); });
      return;
    }
    try{ sessionStorage.setItem('ls_skip_gate', '1'); sessionStorage.setItem('ls_loading', JSON.stringify(info)); }catch(e){}
    stopPoll(); location.reload();              // fresh start with that profile's own data (loading screen shows right after the reload)
  }
  function useGuest(){ switchTo('guest', null); }                       // no network involved at all
  function useAccount(id){ const a = accounts().find(x => x.id === id); if(a) switchTo(id, a.auth); }

  /* ----- "Who's watching?" ----- */
  const PERSON = '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>';
  function profBtn(label, inner, attrs){
    const b = document.createElement('button');
    b.className = 'g-prof'; b.setAttribute('data-nav', ''); b.tabIndex = -1;
    Object.keys(attrs).forEach(k => b.setAttribute(k, attrs[k]));
    const av = document.createElement('div'); av.className = 'g-av';
    if(inner.pic){ const im = document.createElement('img'); im.src = inner.pic; im.onerror = () => { av.textContent = inner.letter || ''; }; av.appendChild(im); }
    else if(inner.html){ av.innerHTML = inner.html; } else av.textContent = inner.letter || '';
    const nm = document.createElement('span'); nm.textContent = label;
    b.appendChild(av); b.appendChild(nm); return b;
  }
  function showWho(){
    stopPoll(); view = 'who'; addMode = false;
    vLink.classList.remove('on'); vWho.classList.add('on');
    document.getElementById('g-who-title').textContent = t('gWho');
    const box = document.getElementById('g-profiles'); box.innerHTML = '';
    const active = localStorage.getItem(LS_ACTIVE);
    let target = null;
    accounts().forEach(a => {
      const b = profBtn(a.name || 'Kick', { pic: a.avatar, letter: (a.name || 'K').slice(0, 1).toUpperCase() }, { 'data-gate': 'acct', 'data-id': a.id });
      box.appendChild(b); if(a.id === active) target = b;
    });
    box.appendChild(profBtn(t('gAdd'), { html: '<svg viewBox="0 0 24 24"><path d="M11 4h2v7h7v2h-7v7h-2v-7H4v-2h7z"/></svg>' }, { 'data-gate': 'add' }));
    const g = profBtn(t('acctGuestName'), { html: PERSON }, { 'data-gate': 'guest' });
    box.appendChild(g);
    focusOn(target || g);
  }

  /* ----- Activation / QR view ----- */
  function drawQr(text){
    const m = window.LSQR(text), box = document.getElementById('g-qr');
    if(!m){ box.textContent = '—'; return; }
    const n = m.length; let d = '';
    for(let y = 0; y < n; y++) for(let x = 0; x < n; x++) if(m[y][x]) d += 'M' + x + ' ' + y + 'h1v1h-1z';
    box.innerHTML = '<svg viewBox="-2 -2 ' + (n + 4) + ' ' + (n + 4) + '" shape-rendering="crispEdges"><path d="' + d + '" fill="#000"/></svg>';
  }
  const setStatus = s => { document.getElementById('g-status').textContent = s || ''; };
  function setCode(d){
    document.getElementById('g-code').textContent = d ? d.user_code : '';
    if(d){ drawQr(location.origin + '/activate?code=' + encodeURIComponent(d.user_code)); setStatus(''); }
    else { document.getElementById('g-qr').textContent = '…'; }
  }
  async function startLink(){
    const my = ++linkTok; if(pollTimer){ clearTimeout(pollTimer); pollTimer = null; }
    setCode(null); setStatus(t('gWaiting'));
    try{
      const r = await ftimeout(LINK_FN + '?action=start', { method: 'POST' }, 8000);
      const d = await r.json();
      if(my !== linkTok) return;
      if(!d || !d.user_code) throw new Error('no code');
      setCode(d); poll(my, d);
    }catch(e){
      if(my !== linkTok) return;
      setStatus(t('gOffline'));
      pollTimer = setTimeout(() => { if(my === linkTok) startLink(); }, 10000);
    }
  }
  function poll(my, d){
    pollTimer = setTimeout(async () => {
      if(my !== linkTok) return;
      try{
        const r = await ftimeout(LINK_FN + '?action=poll&user_code=' + encodeURIComponent(d.user_code) + '&device_code=' + encodeURIComponent(d.device_code), {}, 8000);
        const p = await r.json();
        if(my !== linkTok) return;
        if(p.status === 'ok'){ onLinked(p.auth); return; }
        if(p.status === 'expired'){ startLink(); return; }
      }catch(e){}
      if(my === linkTok) poll(my, d);
    }, (d.interval || 3) * 1000);
  }
  async function onLinked(auth){
    stopPoll(); setStatus(t('gSigningIn'));
    let u = null;
    try{
      const r = await ftimeout(KICK_FN + '?action=me', { headers: { Authorization: 'Bearer ' + auth.access_token } }, 8000);
      const j = await r.json(); u = (j && j.data && j.data[0]) ? j.data[0] : (j && j.data) || null;
    }catch(e){}
    const id = uId(u) || ('k' + Date.now());
    const list = accounts().filter(a => a.id !== id && a.id !== 'legacy');
    list.push({ id, name: uName(u) || 'Kick', avatar: uPic(u), auth });
    saveAccounts(list);
    useAccount(id);
  }
  function showLink(add){
    view = 'link'; addMode = !!add;
    vWho.classList.remove('on'); vLink.classList.add('on');
    document.getElementById('g-headline').textContent = t('gHeadline');
    document.getElementById('g-sub').textContent = t('gSub');
    document.getElementById('g-scan').textContent = t('gScan');
    document.getElementById('g-url').textContent = location.host + '/activate';
    document.getElementById('g-enter').textContent = t('gEnter');
    const gb = document.getElementById('g-guest-btn'), bb = document.getElementById('g-back-btn');
    gb.textContent = t('gGuest'); bb.textContent = t('gBack');
    bb.style.display = add ? '' : 'none';
    focusOn(gb);
    startLink();                                // network happens after the screen is already usable
  }

  window.lsOpenWho = function(){
    fromSettings = true;
    window.__lsGateOpen = true;
    gate.classList.add('show'); gate.setAttribute('aria-hidden', 'false');
    showWho();
  };
  window.lsGateAct = function(el){
    const a = el.dataset.gate;
    if(a === 'guest') useGuest();
    else if(a === 'acct') useAccount(el.dataset.id);
    else if(a === 'add') showLink(true);
    else if(a === 'back') showWho();
  };
  window.lsGateBack = function(){
    if(!gate.classList.contains('show')) return false;
    if(view === 'link' && addMode) showWho();
    else if(view === 'who' && fromSettings){ fromSettings = false; close(); }
    return true;                               // never exit to the app from the gate with Back
  };

  /* ----- boot decision ----- */
  const returningFromOAuth = /[?&](code|state|error)=/.test(location.search);
  let accs = accounts();
  const cur = loadKickAuth();
  if(!accs.length && cur && cur.access_token){          // upgraded from a version without profiles
    accs = [{ id: 'legacy', name: 'Kick', avatar: '', auth: cur }]; saveAccounts(accs);
    try{ localStorage.setItem(LS_DONE, '1'); localStorage.setItem(LS_ACTIVE, 'legacy'); }catch(e){}
  }
  if(!localStorage.getItem(LS_ACTIVE)) try{ localStorage.setItem(LS_ACTIVE, 'guest'); }catch(e){}
  let skipOnce = false; try{ skipOnce = sessionStorage.getItem('ls_skip_gate') === '1'; sessionStorage.removeItem('ls_skip_gate'); }catch(e){}
  if(returningFromOAuth || skipOnce){
    const done = () => { try{ refreshFocusables(); }catch(e){} if(window.lsLoaderHide) window.lsLoaderHide(); if(window.__lsGateResolve) window.__lsGateResolve(); };
    if(window.__lsLoaderOn) lsPreloadAccount().catch(() => {}).then(done); else done();
    return;
  }
  window.__lsGateOpen = true;
  gate.classList.add('show'); gate.setAttribute('aria-hidden', 'false');
  if(!accs.length && !localStorage.getItem(LS_DONE)) showLink(false); else showWho();
})();

window.__lsAcctReady = handleKickCallback().then(() => { if(!state.kickUser) return fetchKickProfile(); }).then(() => { const p = syncNow(); syncStart(); return p; }).catch(() => {});
// Run the startup "favorites are live" check first and let it fully finish
// (it sets the live/offline baseline for every favorite) before the recurring
// poller starts — this removes the race between the two of them hitting the
// same endpoint at the same time, which is what was causing double alerts.
// Resume the last watched stream (skipped when returning from an OAuth redirect).
function __lsResumeLast(){
  try{
    const wasPlaying = __lsRestore && __lsRestore.screen === 'player' && __lsRestore.kind === 'live' && __lsRestore.channel;
    if(!state.settings.resumeLast && !wasPlaying) return;
    if(/[?&](code|state|error)=/.test(location.search)) return;
    if(navigator.onLine === false) return;
    const last = wasPlaying ? __lsRestore.channel : localStorage.getItem('livescreen_last_channel');
    if(last) setTimeout(() => playChannel(last), 600);
  }catch(e){}
}
window.lsGateReady.then(__lsResumeLast);
window.lsGateReady.then(() => showStartupFavoritesToast()).finally(() => { setupFavoritesLivePolling(); });
</script>
