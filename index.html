<!DOCTYPE html>
<html lang="en" dir="ltr" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0A0A0A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<title>شاشة مباشر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Manrope:wght@400;600;700;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script>window.Hls||document.write('<script src="hls.min.js"><\/script>')</script>
<script>
/* Offline safety net: keep a copy of hls.js in localStorage after one good online load,
   and inject it when the CDN/file can't be reached (so saved downloads still play in our own player). */
(function(){
  try{
    if(window.Hls){
      if(!localStorage.getItem('ls_hls_src') && navigator.onLine){
        fetch('https://cdn.jsdelivr.net/npm/hls.js@1').then(function(r){ return r.text(); }).then(function(t){
          if(t && t.length > 100000) localStorage.setItem('ls_hls_src', t);
        }).catch(function(){});
      }
    } else {
      var src = localStorage.getItem('ls_hls_src');
      if(src){ var el = document.createElement('script'); el.textContent = src; document.head.appendChild(el); }
    }
  }catch(e){}
})();
</script>
<style>
  :root{
    /* ---- Netflix-inspired token system (no Kick branding) ---- */
    --bg:#141414;
    --bg-radial: linear-gradient(180deg, #1a1010 0%, #141414 28%, #0A0A0A 100%);
    --surface:#181818;
    --surface-2:#272727;
    --text:#F5F5F1;
    --muted:#9B9B9B;
    --accent:#E50914;      /* Netflix red — the signature color */
    --accent-hover:#F6121D;
    --accent-ink:#FFFFFF;
    --accent-2:#FF6B4A;    /* saved / secondary — warm red-orange, keeps the palette all-red */
    --live:#E50914;
    --safe: 4.5vh 4vw;
    --radius: 6px;
    --font-display:'Tajawal','Manrope', system-ui, sans-serif;
    --font-body:'Tajawal','Manrope', system-ui, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  /* app-like: no text selection / long-press callout (inputs still selectable) */
  *{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;}
  input,textarea,[contenteditable="true"]{-webkit-user-select:text; user-select:text;}
  html,body{
    background:var(--bg); color:var(--text);
    font-family:var(--font-body);
    height:100%; overflow:hidden;
  }
  body{ background-image:var(--bg-radial); }
  #app{ height:100vh; width:100vw; display:flex; flex-direction:row; }

  /* ---- left icon sidebar ----
     position:fixed and OUT of the #app flex flow on purpose: main reserves
     a constant 5rem via margin-inline-start below, so the sidebar's own
     width can grow from 5rem to 15rem on D-pad focus WITHOUT ever resizing
     or reflowing main — it simply overlays on top of it (with a blur behind
     it) instead of pushing it, exactly like Netflix's TV rail. Doing this as
     a flex item that changes width was the earlier bug: every focus move
     into/out of the sidebar physically squeezed main and everything inside
     it re-laid out and jumped. */
  #sidebar{
    position:fixed; inset-block:0; inset-inline-start:0;
    width:5rem; height:100%; display:flex; flex-direction:column;
    align-items:stretch; padding:1.4rem 0; gap:.5rem; background:rgba(0,0,0,.35);
    border-inline-end:1px solid color-mix(in srgb, #fff 6%, transparent);
    z-index:20; overflow:hidden;
    transition:width .28s cubic-bezier(.22,.9,.35,1), background .28s ease;
  }
  /* Expanded state: driven by JS (applyFocus) whenever D-pad focus is
     currently resting on a sidebar item — 80px icon rail grows to a full
     240px labeled panel, with a blur behind it so the row content underneath
     reads as de-emphasized rather than just covered. main never moves. */
  #sidebar.expanded{
    width:15rem;
    background:rgba(10,10,10,.82);
    box-shadow:12px 0 40px rgba(0,0,0,.5);
  }
  .brand{ display:flex; align-items:center; justify-content:center; margin-bottom:1.2rem; flex-shrink:0; }
  .brand .bolt{
    width:1.6rem; height:1.6rem; flex-shrink:0; color:var(--accent);
    filter:drop-shadow(0 0 8px color-mix(in srgb, var(--accent) 60%, transparent));
  }
  .brand .bolt svg{ width:100%; height:100%; }

  #sidebar nav{ display:flex; flex-direction:column; align-items:stretch; gap:.4rem; flex:1; justify-content:center; }
  #nav-bottom{ display:flex; flex-direction:column; align-items:stretch; margin-top:auto; }

  .navbtn{
    font-size:.8rem; padding:.75rem; border-radius:10px; margin-inline:.4rem;
    background:transparent; color:var(--muted); border:2px solid transparent;
    font-weight:700; cursor:pointer; transition:.18s; position:relative;
    font-family:var(--font-body); display:flex; align-items:center; justify-content:center; gap:.6rem;
    overflow:hidden; white-space:nowrap;
  }
  .navbtn svg{ width:1.3rem; height:1.3rem; flex-shrink:0; color:var(--accent); }
  .navbtn .label{
    max-width:0; opacity:0; overflow:hidden; display:inline-block; white-space:nowrap;
    transition:max-width .26s ease, opacity .18s ease;
  }
  .navbtn.active{ color:var(--text); background:color-mix(in srgb, var(--accent) 16%, transparent); }
  .navbtn.focused{
    border-color:var(--accent); color:var(--text); transform:scale(1.08);
    box-shadow:0 0 0 3px var(--accent), 0 10px 26px rgba(0,0,0,.6);
    transition:transform .2s ease-in-out, box-shadow .2s ease-in-out, border-color .2s ease-in-out;
  }
  #sidebar.expanded .navbtn{ justify-content:flex-start; padding-inline-start:1.1rem; }
  #sidebar.expanded .navbtn .label{ max-width:9rem; opacity:1; margin-inline-start:.2rem; transition-delay:.05s; }
  #sidebar.expanded .brand{ justify-content:flex-start; padding-inline-start:1.1rem; }

  /* ---- notification bell: lives as its own slot inside the sidebar now
     (was pinned to the fixed top-right corner before) — it's a .navbtn
     like the others, just with a badge overlaid on its icon. ---- */
  #notif-bell{ transition:opacity .2s ease, transform .35s cubic-bezier(.34,1.56,.64,1), border-color .18s, box-shadow .18s, background .18s; }
  #notif-bell.toast-active{ opacity:0; transform:scale(.5); pointer-events:none; transition:opacity .15s ease, transform .15s ease; }
  .notif-icon-wrap{ position:relative; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
  #notif-bell svg{ overflow:visible; }
  #notif-bell.ring svg{ animation:bellRing .6s ease; }
  @keyframes bellRing{
    0%,100%{ transform:rotate(0deg); }
    15%{ transform:rotate(18deg); } 30%{ transform:rotate(-16deg); }
    45%{ transform:rotate(12deg); } 60%{ transform:rotate(-8deg); } 80%{ transform:rotate(4deg); }
  }
  /* ---- when the bell "swallows" an incoming toast: a squash-and-stretch
     gulp — it bulges out of shape like it's actually swallowing something —
     while a red triangular "mouth" flashes open at the top, then both
     wobble back to normal ---- */
  .bell-mouth{
    transform-box: view-box; transform-origin: 12px 4.5px;
    opacity:0; transform:scaleY(0);
  }
  #notif-bell.eating .bell-mouth{ animation: bellMouthOpen .9s cubic-bezier(.45,0,.35,1); }
  @keyframes bellMouthOpen{
    0%{ opacity:0; transform:scaleY(0); }
    25%{ opacity:1; transform:scaleY(1); }
    65%{ opacity:1; transform:scaleY(1); }
    100%{ opacity:0; transform:scaleY(0); }
  }
  #notif-bell.eating{ animation: bellGulp .9s cubic-bezier(.45,0,.35,1); }
  @keyframes bellGulp{
    0%{ transform:scale(1,1) translateY(0); }
    20%{ transform:scale(.82,1.32) translateY(-3px); }
    45%{ transform:scale(1.34,.8) translateY(2px); }
    70%{ transform:scale(.92,1.14) translateY(-1px); }
    100%{ transform:scale(1,1) translateY(0); }
  }
  .notif-badge{
    position:absolute; top:-6px; inset-inline-end:-8px;
    min-width:1.1rem; height:1.1rem; padding:0 .25rem; border-radius:999px;
    background:var(--accent); color:#fff; font-size:.68rem; font-weight:800;
    display:none; align-items:center; justify-content:center; line-height:1;
    box-shadow:0 0 0 2px var(--bg); font-family:var(--font-body); direction:ltr;
  }
  .notif-badge.show{ display:flex; }
  #nav-lib{ position:relative; }
  #nav-lib.ring{ animation:libPulse .6s ease; }
  #nav-lib.eating{ animation:bellGulp .9s cubic-bezier(.45,0,.35,1); }
  @keyframes libPulse{ 0%{transform:scale(1)} 40%{transform:scale(1.14)} 100%{transform:scale(1)} }
  .libtab{ position:relative; }
  .libtab .notif-badge{ top:-4px; inset-inline-end:-2px; }
  #screen-notifications .screen-notif-header .row-title{ display:none; }
  #screen-notifications .screen-notif-header{ justify-content:flex-end; }
  #nav-account .na-av{ width:1.9vw; height:1.9vw; min-width:26px; min-height:26px; border-radius:50%; overflow:hidden; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 100%); color:#fff; font-weight:800; font-size:1vw; }
  #nav-account .na-av img{ width:100%; height:100%; object-fit:cover; display:block; }
  #nav-account .na-av svg{ width:60%; height:60%; fill:#fff; stroke:none; }
  /* Collapsed sidebar, not on the notifications screen: a plain dot with no
     number. Expanding the sidebar (D-pad focus resting on the bell) or
     opening the notifications screen itself reveals the real count. */
  #app:not([data-screen="notifications"]) #sidebar:not(.expanded) .notif-badge.show{
    font-size:0; min-width:.6rem; width:.6rem; height:.6rem; padding:0;
    top:-2px; inset-inline-end:-2px;
  }

  /* ---- Notifications: a full screen like Home/Favorites/Settings
     (reached via setScreen('notifications')), not a small anchored popup. ---- */
  .screen-notif-header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:1.8vh;
  }
  .screen-notif-header .row-title{ margin:0; }
  .screen-notif-header .notif-clear{
    color:var(--muted); font-size:.85rem; font-weight:700; cursor:pointer;
    background:none; border:1px solid color-mix(in srgb, #fff 14%, transparent);
    border-radius:8px; padding:.5rem 1rem; font-family:var(--font-body);
  }
  .screen-notif-header .notif-clear.focused{ border-color:var(--accent); color:var(--text); }
  .notif-list{ display:flex; flex-direction:column; max-width:640px; }
  .notif-item{
    display:flex; align-items:center; gap:.9rem; padding:1rem .2rem;
    border-bottom:1px solid rgba(255,255,255,.07); font-size:.95rem; cursor:pointer;
  }
  .notif-item:last-child{ border-bottom:none; }
  .notif-item .dot{ color:var(--accent); font-size:.8em; flex-shrink:0; }
  .notif-item .notif-text{ flex:1; min-width:0; }
  .notif-item .notif-ch{ font-weight:800; direction:ltr; unicode-bidi:isolate; }
  .notif-item .notif-time{ color:var(--muted); font-size:.78rem; margin-top:2px; }
  .notif-item.unread{ background:color-mix(in srgb, var(--accent) 8%, transparent); border-radius:10px; }
  .notif-item.focused{ outline:2px solid var(--accent); border-radius:10px; }
  .notif-del{
    flex-shrink:0; width:2rem; height:2rem; border-radius:999px; cursor:pointer;
    background:none; border:1px solid transparent; color:var(--muted);
    display:flex; align-items:center; justify-content:center; font-size:.9rem;
  }
  .notif-del.focused{ border-color:var(--accent); color:var(--text); }
  .notif-empty{ padding:3vh 1rem; text-align:center; color:var(--muted); font-size:.95rem; }

  /* ---- startup "favorites are live" suggestion — centered, dims the home page behind it.
     Shows a single card for the top (most-viewed) live favorite: a 5s countdown bar,
     thumbnail + live viewer count, the channel name, a stack of avatars for any other
     live favorites, and a Watch button. ---- */
  #startup-suggestion-overlay{
    position:fixed; inset:0; z-index:300;
    display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,0); pointer-events:none;
    transition:background .4s ease;
  }
  #startup-suggestion-overlay.show{ background:rgba(0,0,0,.55); pointer-events:auto; }
  #startup-suggestion-card{
    background:var(--surface); border:1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    border-radius:16px; overflow:hidden; width:min(38vw, 480px);
    box-shadow:0 24px 60px rgba(0,0,0,.7); text-align:center;
    opacity:0; transform:scale(.82) translateY(10px);
    transition:opacity .35s ease, transform .35s ease;
  }
  #startup-suggestion-overlay.show #startup-suggestion-card{
    opacity:1; transform:scale(1) translateY(0);
    animation:suggestionPop .5s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes suggestionPop{
    0%{ opacity:0; transform:scale(.7) translateY(16px); }
    60%{ opacity:1; transform:scale(1.04) translateY(-3px); }
    100%{ opacity:1; transform:scale(1) translateY(0); }
  }
  .ss-progress{ height:3px; width:100%; background:rgba(255,255,255,.1); }
  .ss-progress-bar{
    height:100%; width:100%; background:var(--accent); transform-origin:0% 50%;
    transform:scaleX(1);
  }
  #startup-suggestion-overlay.show .ss-progress-bar{
    animation:ssCountdown 5s linear forwards;
  }
  @keyframes ssCountdown{ from{ transform:scaleX(1); } to{ transform:scaleX(0); } }
  #startup-suggestion-title{
    font-family:var(--font-display); font-weight:800; font-size:.78rem;
    color:var(--muted); padding:.55rem 1rem 0;
  }
  .ss-thumb{
    position:relative; width:calc(100% - 2rem); aspect-ratio:16/9.5; margin:.4rem 1rem 0;
    background:var(--surface-2); overflow:hidden; border-radius:14px;
  }
  .ss-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .ss-thumb .fallback-tile{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:2rem; font-family:var(--font-display); color:var(--text);
    background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 30%, var(--surface-2)) 0%, var(--surface-2) 100%);
  }
  .ss-thumb .grad{
    position:absolute; inset-inline:0; bottom:0; height:55%; pointer-events:none;
    background:linear-gradient(180deg, transparent 0%, rgba(0,0,0,.85) 100%);
  }
  .ss-thumb .badge{ position:absolute; top:8px; inset-inline-start:8px; z-index:1; }
  .ss-thumb .ss-stream-title{
    position:absolute; bottom:7px; inset-inline-start:9px; inset-inline-end:5.5rem;
    font-size:.72rem; color:#fff; font-weight:600; z-index:1; text-shadow:0 1px 3px rgba(0,0,0,.8);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:start;
  }
  .ss-thumb .ss-viewers{
    position:absolute; bottom:7px; inset-inline-end:9px; font-size:.72rem; color:#fff;
    font-weight:700; z-index:1; text-shadow:0 1px 3px rgba(0,0,0,.8);
  }
  #startup-suggestion-name{
    font-family:var(--font-display); font-weight:800; font-size:1.05rem; color:var(--accent-2);
    direction:ltr; unicode-bidi:isolate; cursor:pointer; padding:.5rem 1rem 0;
  }
  /* ---- overlapping avatar stack for the other favorites that are also live ---- */
  #startup-suggestion-others{
    display:flex; align-items:center; justify-content:center;
    padding:.25rem 1rem 0; min-height:1.3rem;
  }
  .ss-avatars{ display:flex; direction:ltr; }
  .ss-avatar{
    width:1.5rem; height:1.5rem; border-radius:50%; margin-inline-start:-.5rem;
    border:2px solid var(--surface); box-shadow:0 2px 6px rgba(0,0,0,.4);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    font-size:.68rem; font-weight:800; color:#fff; font-family:var(--font-display);
    background:linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
  }
  .ss-avatar:first-child{ margin-inline-start:0; }
  .ss-avatar img{ width:100%; height:100%; object-fit:cover; }
  .ss-more{ font-size:.78rem; color:var(--muted); font-weight:700; margin-inline-start:.5rem; }
  .ss-watch{
    display:block; width:calc(100% - 2rem); margin:.6rem 1rem .9rem; padding:.7rem;
    border-radius:10px; border:none; cursor:pointer;
    background:var(--accent); color:#fff; font-weight:800; font-size:1rem;
    font-family:var(--font-body);
  }

  /* ---- in-app live notification toasts — a preview card (thumb + name + category +
     viewers), styled like a stream card. Bell hides while a toast is up and pops back
     with the badge once the toast finishes flying into it ---- */
  #live-alerts{
    position:fixed; top:calc(1.6vh + 2.6vw + 6px); right:1.2vw; z-index:200;
    display:flex; flex-direction:column; align-items:flex-end; gap:.9vh;
    pointer-events:none;
  }
  .live-alert{
    pointer-events:auto; width:15.5vw; min-width:210px; max-width:260px;
    border-radius:12px; overflow:hidden; cursor:pointer; background:var(--surface-2);
    box-shadow:0 14px 34px rgba(0,0,0,.6);
    transform-origin:100% 0%;
    animation:alertPop .4s cubic-bezier(.22,.9,.35,1);
  }
  .live-alert.leaving{
    animation:toastFlyIntoBell .9s cubic-bezier(.45,0,.7,.1) forwards;
  }
  @keyframes alertPop{
    0%{ opacity:0; transform:translateY(-22px) scale(.55); }
    100%{ opacity:1; transform:translateY(0) scale(1); }
  }
  /* --fly-x/--fly-y are set in JS (dismissLiveAlert) from the bell's actual
     on-screen position right before this animation starts, since the bell
     now sits inside the sidebar instead of a fixed spot next to the toast. */
  .live-alert{ --fly-x:0px; --fly-y:-40px; }
  @keyframes toastFlyIntoBell{
    0%{ opacity:1; transform:translate(0,0) scale(1); }
    65%{ opacity:.95; transform:translate(calc(var(--fly-x) * .65), calc(var(--fly-y) * .65)) scale(.42); }
    100%{ opacity:0; transform:translate(var(--fly-x), var(--fly-y)) scale(.05); }
  }
  .live-alert-thumb{
    position:relative; width:100%; aspect-ratio:16/9; background:var(--surface-2);
    display:flex; align-items:center; justify-content:center; color:var(--muted); overflow:hidden;
  }
  .live-alert-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .live-alert-thumb .fallback-tile{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:1.8rem; font-family:var(--font-display); color:var(--text);
    background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 30%, var(--surface-2)) 0%, var(--surface-2) 100%);
  }
  .live-alert-thumb .grad{
    position:absolute; inset-inline:0; bottom:0; height:65%; pointer-events:none;
    background:linear-gradient(180deg, transparent 0%, rgba(0,0,0,.88) 100%);
  }
  .live-alert-thumb .close{
    position:absolute; top:6px; right:6px; z-index:2; width:20px; height:20px; border-radius:50%;
    background:rgba(0,0,0,.55); color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:.65rem; font-weight:800;
  }
  .live-alert-thumb .meta{ position:absolute; bottom:8px; inset-inline-start:10px; inset-inline-end:10px; z-index:1; }
  .live-alert-thumb .meta .cat{
    color:var(--muted); font-size:.66rem; margin-bottom:1px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .live-alert-thumb .meta .name{
    font-weight:800; font-size:.85rem; color:#fff; direction:ltr; unicode-bidi:isolate;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .live-alert-thumb .viewers{
    position:absolute; bottom:8px; inset-inline-end:8px; font-size:.64rem; color:#fff;
    font-weight:700; z-index:1; text-shadow:0 1px 3px rgba(0,0,0,.8);
  }

  /* isolation:isolate caps every stacking context created anywhere inside
     main (including ones content-visibility:auto silently creates on .row,
     or ones a compositor layer like the hero-preview <video> creates) so
     none of them can ever out-rank #sidebar's z-index on paint order —
     this is what stops a focused/scaled card from visually landing on
     top of the sidebar or the notification rail. */
  main{ flex:1; min-width:0; overflow:hidden; position:relative; isolation:isolate; padding:var(--safe); padding-inline-start:1.6vw; margin-inline-start:5rem; }

  /* watching a channel: standalone fullscreen surface — sidebar hidden,
     no page padding, video-stage gets the entire viewport */
  #app.player-active #sidebar{ display:none; }
  #app.player-active main{ padding:0; margin-inline-start:0; }
  .screen{ display:none; height:100%; overflow-y:auto; padding-bottom:4vh; }
  .screen.active{ display:block; animation:screenFade .28s ease; }
  @keyframes screenFade{ from{ opacity:0; transform:translateY(1.2vh); } to{ opacity:1; transform:translateY(0); } }

  .row-title{ font-size:2.15vw; font-weight:800; margin:0 0 1.8vh; font-family:var(--font-display); }
  .row{
    margin-bottom:3.6vh;
    content-visibility:auto; contain-intrinsic-size:0 32vh;
  }
  .row .row-title{ display:flex; align-items:baseline; gap:.8vw; }
  .row .row-title .row-count{ font-size:1.23vw; font-weight:600; color:var(--muted); }
  .hrow{
    display:flex; gap:1.1vw; overflow-x:auto; overflow-y:visible; scroll-behavior:smooth;
    padding:1.6vh 1.8vw 1.4vh; margin:-1.6vh -1.8vw 0;
  }
  .hrow .card{ flex:0 0 auto; width:calc((100% - 2 * 1.1vw)/3); }
  .hrow .card.hero{ width:calc((100% - 1 * 1.1vw)/2); }
  /* The scaled-up focus frame grows from the card's own center by default,
     which pushed the left edge of the very first card (and the right edge
     of the very last) past the row's own scrollable box — since the row is
     already at scrollLeft 0 (or fully scrolled right), that overshoot had
     nowhere to scroll into and was simply clipped off-screen. Anchoring the
     scale to the outer edge on those two cards keeps growth pointed inward,
     toward the row's own visible area, instead. */
  .hrow > .card:first-child{ transform-origin:0% 50%; }
  .hrow > .card:last-child{ transform-origin:100% 50%; }

  @keyframes fadeInContent{ from{ opacity:0; } to{ opacity:1; } }
  .fade-in{ animation:fadeInContent .4s ease; }

  .grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(19.5vw,1fr));
    gap:1.8vw 1.3vw;
  }
  .card{
    background:var(--surface); border-radius:var(--radius); overflow:hidden;
    border:3px solid transparent; cursor:pointer; transition:transform .2s ease-in-out, box-shadow .2s ease-in-out, border-color .2s ease-in-out;
    outline:none; position:relative; transform-origin:50% 50%;
  }
  .card.focused{
    transform:scale(1.08);
    border-color:#fff;
    box-shadow:0 18px 44px rgba(0,0,0,.7);
    z-index:3;
  }
  .thumb{
    width:100%; aspect-ratio:16/9; background:var(--surface-2); border-radius:var(--radius);
    display:flex; align-items:center; justify-content:center;
    color:var(--muted); font-size:1.44vw; position:relative; overflow:hidden;
  }
  /* A channel card showing the streamer's own logo (no live thumbnail to
     show instead) gets a square frame — matching the logo's own shape —
     instead of the 16:9 box meant for a stream screenshot, so it isn't
     letterboxed with empty bars on the sides. Stream/VOD/clip thumbnails
     never get this class, so they keep their normal 16:9 box. */
  .thumb.thumb-avatar{ aspect-ratio:1/1; }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; transition:opacity .35s ease; }
  .thumb-preview-video{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    z-index:0; background:var(--surface-2); animation:fadeInContent .35s ease;
  }
  .thumb .fallback-tile{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:2.30vw; font-family:var(--font-display); color:var(--text);
    background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 30%, var(--surface-2)) 0%, var(--surface-2) 100%);
  }
  .thumb .grad{
    position:absolute; inset-inline:0; bottom:0; height:65%; pointer-events:none;
    background:linear-gradient(180deg, transparent 0%, rgba(0,0,0,.85) 100%);
  }
  .badge{
    position:absolute; top:8px; inset-inline-start:8px; z-index:1;
  }
  .badge.dot{
    width:8px; height:8px; border-radius:50%; background:var(--muted);
    box-shadow:0 1px 4px rgba(0,0,0,.6);
  }
  .badge.dot.live{ background:var(--live); box-shadow:0 0 0 2px color-mix(in srgb, var(--live) 35%, transparent), 0 1px 4px rgba(0,0,0,.6); }
  .viewers{
    position:absolute; bottom:8px; inset-inline-end:8px; font-size:1.04vw; color:#fff;
    font-weight:600; z-index:1; text-shadow:0 1px 3px rgba(0,0,0,.8);
  }
  .meta{ position:absolute; bottom:8px; inset-inline-start:10px; inset-inline-end:10px; z-index:1; }
  .meta .name{ font-weight:800; font-size:1.51vw; margin-bottom:1px; color:#fff;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meta .cat{ color:var(--muted); font-size:1.17vw;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hrow .card.hero .meta{ inset-inline-end:auto; max-width:80%; }
  .hrow .card.hero .meta .name{ font-size:2.44vw; letter-spacing:-0.01em; }

  /* ---------- Spotlight: Netflix-TV-style rotating hero ----------
     One full-bleed banner that quietly cycles through the top live
     streams (crossfading, then waking up into a live preview once a
     slide has settled), with a synced "next up" thumbnail rail below —
     the same idea as Netflix's new TV home. */
  .spotlight-row{ margin-bottom:3.6vh; }
  .spotlight{
    position:relative; width:100%; height:60vh; min-height:300px; border-radius:8px;
    overflow:hidden; outline:none; cursor:pointer; background:var(--surface-2);
    border:3px solid transparent; transform-origin:50% 50%;
    transition:border-color .2s ease-in-out, box-shadow .2s ease-in-out, transform .2s ease-in-out;
  }
  .spotlight.focused{
    border-color:#fff; box-shadow:0 20px 50px rgba(0,0,0,.7); transform:scale(1.008); z-index:3;
  }
  .spotlight-bg{ position:absolute; inset:0; }
  .spot-img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    opacity:0; transition:opacity .9s ease; background:var(--surface-2);
  }
  .spot-img.show{ opacity:1; }
  .spot-video{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    opacity:0; transition:opacity .7s ease; z-index:1;
  }
  .spot-video.show{ opacity:1; }
  .spotlight-grad{
    position:absolute; inset:0; z-index:2; pointer-events:none;
    background:
      linear-gradient(180deg, rgba(10,10,10,0) 30%, rgba(10,10,10,.55) 78%, rgba(10,10,10,.94) 100%),
      linear-gradient(90deg, rgba(10,10,10,.8) 0%, rgba(10,10,10,.25) 42%, rgba(10,10,10,0) 65%);
  }
  [dir="rtl"] .spotlight-grad{
    background:
      linear-gradient(180deg, rgba(10,10,10,0) 30%, rgba(10,10,10,.55) 78%, rgba(10,10,10,.94) 100%),
      linear-gradient(270deg, rgba(10,10,10,.8) 0%, rgba(10,10,10,.25) 42%, rgba(10,10,10,0) 65%);
  }
  .spotlight-content{
    position:absolute; inset-inline-start:0; bottom:0; z-index:3; max-width:58%;
    padding:0 3vw 3.4vh;
  }
  .spotlight-badge-live{
    display:inline-flex; align-items:center; gap:.5vw; background:var(--accent); color:#fff;
    font-weight:800; font-size:1.02vw; padding:.4vh .8vw; border-radius:4px; margin-bottom:1.4vh;
    letter-spacing:.04em;
  }
  .spotlight-badge-live::before{ content:''; width:7px; height:7px; border-radius:50%; background:#fff; flex-shrink:0; }
  .spotlight-name{
    font-family:var(--font-display); font-weight:900; font-size:3.38vw; color:#fff;
    margin-bottom:1vh; line-height:1.1; text-shadow:0 2px 16px rgba(0,0,0,.55);
    direction:ltr; unicode-bidi:isolate; text-align:start;
    overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical;
  }
  .spotlight-meta{ color:#EDEDE9; font-size:1.25vw; font-weight:700; margin-bottom:1.3vh; opacity:.92; }
  .spotlight-desc{
    color:#D6D6D2; font-size:1.25vw; line-height:1.55; font-weight:500; margin-bottom:2.1vh;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .spotlight-watch-btn{
    display:inline-flex; align-items:center; gap:.6vw; background:#fff; color:#111;
    border:none; border-radius:6px; padding:1.15vh 1.8vw; font-weight:800; font-size:1.27vw;
    font-family:var(--font-body); cursor:pointer; transition:transform .15s ease, background .15s ease;
  }
  .spotlight-watch-btn:hover{ background:#e2e2e2; }
  .spotlight-watch-btn svg{ width:1.05vw; height:1.05vw; flex-shrink:0; }
  .spotlight-dots{
    position:absolute; bottom:2.2vh; inset-inline-end:2.6vw; z-index:3; display:flex; gap:.5vw;
  }
  .spotlight-dots .dot{
    width:.5vw; height:.5vw; min-width:5px; min-height:5px; border-radius:50%;
    background:rgba(255,255,255,.35); transition:.25s ease;
  }
  .spotlight-dots .dot.active{ background:#fff; width:1.5vw; min-width:14px; border-radius:3px; }

  @media (max-width:720px){
    .spotlight{ height:52vh; }
    .spotlight-content{ max-width:82%; }
    .spotlight-name{ font-size:6.75vw; }
    .spotlight-meta, .spotlight-desc{ font-size:3.88vw; }
    .spotlight-watch-btn{ font-size:4.00vw; padding:1.3vh 3.4vw; }
  }
  .card-desc{ padding:1.1vh .2vw 0; }
  .card-desc-tags{ color:var(--muted); font-size:1.17vw; font-weight:700; margin-bottom:.6vh; }
  .card-desc-text{ color:var(--text); font-size:1.26vw; line-height:1.5; font-weight:600;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

  .empty{ color:var(--muted); text-align:center; padding:9vh 4vw; font-size:1.51vw; }
  .empty .big{ font-size:2.73vw; margin-bottom:1.2vh; color:var(--text); font-weight:800; font-family:var(--font-display); }
  .debug{ margin-top:2vh; color:#FF8C7A; font-size:1.23vw; direction:ltr; text-align:center; font-family:monospace; }

  /* search */
  .search-box{
    display:flex; align-items:center; gap:1vw; background:var(--surface);
    border-radius:12px; padding:1.4vh 1.4vw; margin-bottom:3vh; font-size:1.80vw;
    border:3px solid transparent;
  }
  .search-box.focused{ border-color:var(--accent); }
  .search-layout{ display:flex; gap:2.4vw; align-items:flex-start; }
  .search-left{ flex:0 0 27vw; }
  .search-right{ flex:1; min-width:0; }
  .search-right .grid{ grid-template-columns:repeat(2, 1fr); gap:2vw 1.6vw; }
  .search-textlist{ margin-top:2.4vh; display:flex; flex-direction:column; gap:.2vh; }
  .search-textlist .text-item{
    font-size:1.44vw; color:var(--muted); padding:.7vh .6vw; border-radius:8px; cursor:pointer;
    border:2px solid transparent; font-weight:600; transition:color .15s ease, border-color .15s ease, background .15s ease;
  }
  .search-textlist .text-item.focused{
    color:var(--text); border-color:var(--accent); background:var(--surface-2);
  }
  .search-box .val{ flex:1; }
  .search-box .cursor{ color:var(--accent); }
  .kbd{ display:grid; grid-template-columns:repeat(10,1fr); gap:.6vw; max-width:62vw; }
  .key{
    background:var(--surface); text-align:center; padding:1.2vh 0; border-radius:8px;
    font-size:1.51vw; font-weight:700; cursor:pointer; border:3px solid transparent;
  }
  .key.focused{ border-color:var(--accent); background:var(--surface-2); }
  .key.wide{ grid-column:span 2; }

  /* player */
  #player-screen{ padding:0; display:none; }
  #player-screen.active{ display:flex; flex-direction:column; height:100%; overflow:hidden; }
  /* #player-body is a vertical scroller: the video (+ chat) fills the whole
     viewport first, and the suggestions/VODs bar sits right below it in
     normal flow — reachable by scrolling down, never covering the stream. */
  #player-body{ flex:1; min-height:0; display:flex; flex-direction:column; overflow-y:auto; overflow-x:hidden; }
  #player-top-row{ flex:0 0 auto; height:100%; min-height:100%; display:flex; gap:1vw; position:sticky; top:0; z-index:3; background:#000; }
  #video-stage{ flex:1; min-width:0; position:relative; overflow:hidden; background:#000; }
  #player-iframe-wrap{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  #player-iframe-wrap iframe, #player-iframe-wrap video{ width:100%; height:100%; border:0; }
  .offline-wrap{ display:flex; flex-direction:column; align-items:center; width:100%; max-height:100%; overflow-y:auto; padding:2vh 0; }
  .offline-wrap > .empty{ padding:2vh 4vw 3vh; }
  #screen-channel .offline-wrap{ max-height:none; overflow:visible; padding:4vh 0 6vh; }
  #vods-hrow .empty{ padding:2vh 1vw; font-size:1.23vw; }
  /* Approximate visual cover for the fallback embed's chrome (logo / watermark / viewer badge).
     Physical left/right (not inline-start/end) so it stays put regardless of app RTL direction.
     Positions are estimates and may drift a little depending on viewport size. */
  .iframe-mask{ position:absolute; background:#000; pointer-events:none; z-index:2; }
  .iframe-mask.mask-tl{ top:0; left:0; width:11%; height:9%; border-end-end-radius:10px; }
  .iframe-mask.mask-tr{ top:0; right:0; width:19%; height:7%; border-end-start-radius:10px; }
  .iframe-mask.mask-bl{ bottom:0; left:0; width:15%; height:11%; border-start-end-radius:10px; }
  /* ---------- Floating live chat (built from scratch, not Kick's iframe) ----------
     Sits ON TOP of the video, transparent background, aligned to one side so
     the stream itself is never covered — only the message column is. */
  #chat-overlay{
    position:absolute; inset-block:4vh 26vh; inset-inline-end:1.4vw; width:min(32vw, 560px);
    z-index:4; display:none; flex-direction:column; justify-content:flex-end;
    pointer-events:none;
  }
  #chat-overlay.visible{ display:flex; }
  #chat-messages{
    flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:.7vh;
    padding:1vh .2vw; mask-image:linear-gradient(180deg, transparent 0, #000 6%, #000 100%);
    scroll-behavior:auto; pointer-events:none; overflow-y:hidden;
  }
  .chat-msg{
    background:color-mix(in srgb, #000 74%, transparent);
    border-radius:8px; padding:.6vh .8vw; font-size:1.23vw; line-height:1.5; color:var(--text);
    animation:chatMsgIn .25s ease; word-break:break-word;
  }
  @keyframes chatMsgIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
  .chat-msg .chat-author{ font-weight:800; margin-inline-end:.4em; }
  .chat-msg .chat-emote{ height:1.7em; width:auto; vertical-align:middle; margin:0 .1em; }
  .chat-msg .chat-badge{
    display:inline-block; font-size:1.00vw; font-weight:800; padding:.05vh .45vw; border-radius:4px;
    margin-inline-end:.4em; background:var(--accent); color:var(--accent-ink); vertical-align:middle;
  }
  #chat-new-pill{
    display:none !important; align-self:center; margin-bottom:.6vh; padding:.5vh 1vw; border-radius:20px;
    background:var(--accent); color:var(--accent-ink); font-size:1.15vw; font-weight:700; cursor:pointer;
    pointer-events:auto; border:3px solid transparent;
  }
  #chat-new-pill.show{ display:none !important; }
  #chat-new-pill.focused{ border-color:#fff; }
  #chat-compose-bar{ display:flex; justify-content:flex-end; margin-top:.8vh; pointer-events:auto; }
  #chat-compose-btn svg{ width:1.3vw; height:1.3vw; }

  /* ---------- Hype meter + AI chat summary ---------- */
  #chat-hype-row{ display:flex; align-items:center; gap:.5vw; pointer-events:auto; margin-bottom:.6vh; }
  #chat-hype-bar{
    flex:1; height:.7vh; border-radius:4px; background:color-mix(in srgb, #000 55%, transparent);
    overflow:hidden;
  }
  #chat-hype-fill{
    height:100%; width:0%; border-radius:4px; background:linear-gradient(90deg, #4ade80, #facc15, #E50914);
    transition:width .6s ease;
  }
  #viewers-bar:has(#player-viewers-count:empty){ display:none; }
  #chat-hype-label{ font-size:1.02vw; font-weight:700; color:var(--muted); white-space:nowrap; }

  #chat-compose-overlay{
    position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,.7);
  }
  #chat-compose-overlay.show{ display:flex; }
  #chat-compose-card{
    width:min(70vw, 720px); background:var(--surface); border-radius:var(--radius); padding:2.4vh 2vw;
    display:flex; flex-direction:column; gap:1.4vh;
  }
  .cc-header{ display:flex; align-items:center; justify-content:space-between; font-weight:800; font-size:1.44vw; }
  #chat-compose-send{ align-self:flex-end; }

  /* ---------- Remote-test D-pad ----------
     A same-device on-screen D-pad for QA: taps drive the exact same
     handleRemoteKey() path a physical remote does (focus-based nav), so you
     can find spots the real remote can't reach without a second device. */
  #remote-test-pad{
    position:fixed; bottom:2vh; inset-inline-end:2vw; z-index:80; display:none;
    background:rgba(10,10,10,.85); border-radius:16px; padding:1.4vh;
    grid-template-columns:repeat(3, 44px); grid-template-rows:repeat(3, 44px); gap:6px;
    box-shadow:0 4px 24px rgba(0,0,0,.5);
  }
  body.remote-test-on #remote-test-pad{ display:grid; }
  #remote-test-pad button{
    border:0; border-radius:10px; background:#242424; color:var(--text); font-size:1.1rem;
    display:flex; align-items:center; justify-content:center;
  }
  #remote-test-pad button:active{ background:var(--accent); }
  #rtp-up{ grid-column:2; grid-row:1; } #rtp-left{ grid-column:1; grid-row:2; }
  #rtp-ok{ grid-column:2; grid-row:2; background:var(--accent); font-weight:800; font-size:.75rem; }
  #rtp-right{ grid-column:3; grid-row:2; } #rtp-down{ grid-column:2; grid-row:3; }
  #rtp-back{ grid-column:1; grid-row:1; font-size:.8rem; }
  #rtp-close{ grid-column:3; grid-row:1; font-size:.9rem; color:var(--muted); }

  /* ---------- Temporary nav-info panel (YouTube-TV style) shown while
     paging through the suggestions row with the remote. ---------- */
  #nav-info-panel{
    position:absolute; inset-inline-start:1.4vw; bottom:1.6vh; z-index:5; max-width:60%;
    background:color-mix(in srgb, #000 78%, transparent);
    border-radius:var(--radius); padding:1.2vh 1.4vw; pointer-events:none;
    opacity:0; transform:translateY(8px); transition:opacity .25s ease, transform .25s ease;
  }
  #nav-info-panel.show{ opacity:1; transform:translateY(0); }
  #nav-info-panel .nip-name{ font-weight:800; font-size:1.51vw; color:var(--text); }
  #nav-info-panel .nip-meta{ font-size:1.23vw; color:var(--muted); margin-top:.3vh; }

  /* Overlay panel: floats ON TOP of the video (bottom edge), holds the
     timer/scrub bar + control bar only, and fades out together as one unit.
     Suggestions/VODs live outside this overlay now, below the video. */
  #player-overlay{
    position:absolute; inset-inline:0; bottom:0; z-index:5;
    display:flex; flex-direction:column; gap:.8vh;
    padding:9vh 1.4vw 1.6vh;
    background:linear-gradient(180deg, transparent 0%, rgba(0,0,0,.5) 55%, rgba(0,0,0,.88) 100%);
    pointer-events:none;
    transition:opacity .35s ease, transform .35s ease;
  }
  #player-overlay.ui-hidden{ opacity:0; transform:translateY(1.4vh); }
  #player-title{
    position:absolute; top:0; inset-inline:0; z-index:5; padding:2.4vh 2vw 7vh; pointer-events:none;
    background:linear-gradient(0deg, transparent 0%, rgba(0,0,0,.55) 45%, rgba(0,0,0,.88) 100%);
    transition:opacity .35s ease, transform .35s ease;
  }
  #player-overlay.ui-hidden ~ #player-title{ opacity:0; transform:translateY(-1.4vh); }
  #player-title:empty, #player-title.empty{ display:none; }
  #player-title .pt-title{ color:#fff; font-weight:800; font-size:3.2vh; line-height:1.3; text-shadow:0 2px 8px rgba(0,0,0,.8); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  #player-title .pt-sub{ color:rgba(255,255,255,.78); font-weight:600; font-size:2.3vh; margin-top:.4vh; }
  #player-overlay .player-bar, #player-overlay .player-timeline{ pointer-events:auto; }
  #player-overlay.ui-hidden .player-bar, #player-overlay.ui-hidden .player-timeline{ pointer-events:none; }

  /* timer: scrub bar + elapsed/duration readout, just above the control row */
  .player-timeline{ display:none; flex-direction:column; gap:.9vh; flex-shrink:0; }
  .player-timeline.show{ display:flex; }
  .player-timeline-track{
    position:relative; height:1.4vh; min-height:9px; border-radius:999px; cursor:pointer;
    background:color-mix(in srgb, #fff 20%, transparent); overflow:hidden;
  }
  .ptl-wrap{ position:relative; }
  .player-timeline-track{ transition:height .12s ease; }
  .player-timeline-track.focused{ height:2.2vh; outline:3px solid #fff; outline-offset:4px; }
  #seek-preview{
    display:none; position:absolute; bottom:calc(100% + 2vh); left:0; width:19vw; z-index:8;
    border-radius:12px; overflow:hidden; background:#000; border:3px solid var(--accent);
    box-shadow:0 12px 28px rgba(0,0,0,.7); pointer-events:none;
  }
  #seek-preview.show{ display:block; }
  #seek-preview video{ display:block; width:100%; aspect-ratio:16/9; object-fit:cover; background:#000; }
  #seek-preview.no-frame video{ display:none; }
  #seek-preview-time{ text-align:center; font-weight:800; font-size:1.9vw; padding:.5vh 0; background:rgba(0,0,0,.88); color:#fff; }
  .player-timeline-fill{ position:absolute; inset-inline-start:0; top:0; bottom:0; width:0%; background:var(--accent); border-radius:999px; }
  .player-timeline-times{ display:flex; justify-content:space-between; font-size:1.8vw; font-weight:700; color:var(--text); }
  .player-timeline-times .live-dot-label{ display:inline-flex; align-items:center; gap:.4vw; color:var(--live); }
  .player-timeline-times .live-dot-label::before{ content:''; width:6px; height:6px; border-radius:50%; background:var(--live); }

  /* quality / speed menu — opens above the settings (gear) button next to mute */
  .quality-menu{
    display:none; position:absolute; bottom:24vh; inset-inline-end:1.4vw; z-index:7;
    background:color-mix(in srgb, var(--surface) 96%, transparent);
    border:1px solid color-mix(in srgb, #fff 12%, transparent);
    border-radius:var(--radius); padding:1.6vh 1.2vw; min-width:26vw; max-height:68vh; overflow-y:auto;
    box-shadow:0 14px 30px rgba(0,0,0,.55); pointer-events:auto;
  }
  .quality-menu.show{ display:block; }
  .quality-menu-title{ font-size:1.7vw; font-weight:800; color:var(--muted); margin-bottom:1vh; }
  .quality-menu-item{
    display:flex; justify-content:space-between; align-items:center; gap:2vw;
    font-size:2.1vw; font-weight:800; color:var(--text); padding:1.3vh 1.2vw; border-radius:10px;
    cursor:pointer; border:3px solid transparent; white-space:nowrap;
  }
  .quality-menu-item .qm-val{ color:var(--muted); font-size:1.8vw; font-weight:700; }
  .quality-menu-item.active{ color:var(--accent-2); }
  .quality-menu-item.focused{ border-color:var(--accent); background:var(--surface-2); }

  .player-bar{
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    padding:1.3vh 1.4vw; gap:1vw; flex-shrink:0; position:relative;
  }
  .player-hint.sr-only{
    position:absolute; width:1px; height:1px; overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap; border:0; padding:0; margin:-1px;
  }
  .side-bar{
    display:flex; align-items:center; gap:1.2vw;
    background:color-mix(in srgb, var(--surface) 86%, transparent);
    border:1px solid color-mix(in srgb, #fff 8%, transparent);
    border-radius:999px; padding:1.2vh 1.5vw;
    width:fit-content;
  }
  .side-left{ justify-self:start; }
  .side-right{ justify-self:end; }
  .side-bar .mini-icon{ width:2vw; height:2vw; color:var(--accent); flex-shrink:0; display:flex; }
  .side-bar .mini-icon svg{ width:100%; height:100%; }
  #player-viewers-count{ font-weight:800; font-size:1.9vw; color:var(--text); white-space:nowrap; }
  .channel-avatar{
    width:4vw; height:4vw; border-radius:50%; flex-shrink:0; overflow:hidden;
    background:var(--surface-2); border:3px solid var(--accent); cursor:pointer;
  }
  .channel-avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
  .channel-avatar .fallback-tile{ position:static; font-size:1.29vw; }

  /* big centered streamer logo on the "channel offline" screen, Kick-style */
  .offline-avatar{
    width:9vh; height:9vh; border-radius:50%; overflow:hidden; margin:0 auto 1.6vh;
    background:var(--surface-2); border:3px solid var(--accent); cursor:pointer;
    box-shadow:0 0 0 6px color-mix(in srgb, var(--accent) 14%, transparent), 0 14px 30px rgba(0,0,0,.55);
    transition:transform .2s ease;
  }
  .offline-avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
  .offline-avatar .fallback-tile{ position:static; font-size:2.6vh; }
  /* channel page header: avatar on the left, name beside it, Follow button in the right corner */
  .chan-head{ display:flex; align-items:center; gap:1.6vw; width:100%; box-sizing:border-box; direction:ltr; margin:0 0 2.4vh; }
  .chan-head .offline-avatar{ margin:0; flex:0 0 auto; }
  .chan-head-text{ flex:1 1 auto; min-width:0; text-align:start; }
  .chan-name{ font-size:2.73vw; font-weight:800; color:var(--text); font-family:var(--font-display); line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; unicode-bidi:isolate; }
  .chan-sub{ font-size:1.36vw; font-weight:700; color:#cfcfcf; margin-top:.4vh; }
  .chan-sub.live{ color:var(--live); }
  .chan-follow{ flex:0 0 auto; margin-inline-start:auto; padding:.9vw 2.6vw; border-radius:999px; font-size:1.6vw; font-weight:800; cursor:pointer; white-space:nowrap;
    background:var(--accent); color:var(--accent-ink); border:3px solid var(--accent); transition:background .2s ease, color .2s ease, transform .2s ease; }
  .chan-follow.on{ background:transparent; color:#fff; border-color:#fff; }
  .chan-follow.focused{ background:#fff; color:#000; border-color:#fff; transform:scale(1.05); }
  .channel-page-status{ color:var(--muted); font-size:1.36vw; font-weight:700; margin-top:.6vh; }
  .channel-page-status.live{ color:var(--live); }
  .channel-page-watch{ width:26vw; margin:0 auto 3vh; }
  .channel-page-live-row{ max-width:60vw; margin:0 auto; }
  .channel-page-live-row .row-title{ text-align:center; }

  .mini-btn{
    width:4vw; height:4vw; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    color:var(--accent); border:3px solid transparent; cursor:pointer;
    transition:transform .15s ease, background .15s ease, border-color .15s ease;
  }
  .mini-btn svg{ width:2.1vw; height:2.1vw; }
  .mini-btn.focused{
    border-color:var(--accent); background:color-mix(in srgb, var(--accent) 18%, transparent);
    transform:translateY(-2px);
  }
  .mini-btn.active{ background:color-mix(in srgb, var(--accent) 28%, transparent); }

  /* Labels (Volume / Chat / More ...) are hidden by default and only pop up
     ABOVE the icon while it holds the focus (TV remote / touch). */
  .mini-btn{ position:relative; }
  .mini-btn[data-label]::after{
    content:attr(data-label); position:absolute; bottom:calc(100% + 1vh); left:50%;
    transform:translateX(-50%); background:rgba(0,0,0,.9); color:#fff;
    padding:.6vh 1vw; border-radius:10px; font-size:1.6vw; font-weight:800; line-height:1.2;
    white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .15s ease; z-index:9;
  }
  .mini-btn[data-label].focused::after{ opacity:1; }

  /* Play/Pause: solid filled red circle, the visual anchor of the bar */
  .center-playbtn{
    justify-self:center;
    width:6.6vw; height:6.6vw; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--accent);
    border:3px solid transparent;
    color:#fff; cursor:pointer;
    box-shadow:0 8px 22px color-mix(in srgb, var(--accent) 55%, transparent);
    transition:transform .15s ease, background .15s ease, border-color .15s ease;
  }
  .center-playbtn svg{ width:3vw; height:3vw; }
  .center-playbtn.focused{
    border-color:#fff; transform:scale(1.06);
    box-shadow:0 10px 26px rgba(0,0,0,.45), 0 0 0 6px color-mix(in srgb, var(--accent) 30%, transparent);
  }

  /* play/pause + the two 10s seek buttons, grouped together in the middle
     of the control bar */
  .center-controls{ justify-self:center; display:flex; align-items:center; gap:1vw; }
  .seek-btn{ width:5vw; height:5vw; }
  .seek-btn svg{ width:2.6vw; height:2.6vw; }

  /* Bottom-left cluster: viewer-count pill + "Back to Live" pill stacked
     together in the corner, Kick/Stream-Hub style, instead of floating
     centered above the control row. */
  .bottomleft-cluster{
    justify-self:start; display:flex; flex-direction:row; align-items:center; gap:1vw;
  }
  /* "Back to Live" pill: only shown once the viewer has seeked back from
     the live edge while watching a live stream */
  .live-pill{
    display:none; align-items:center; gap:.6vw;
    background:var(--accent); color:#fff; font-weight:800; font-size:1.7vw;
    padding:1.3vh 1.6vw; border-radius:999px; cursor:pointer; border:3px solid transparent;
    box-shadow:0 8px 20px rgba(0,0,0,.5); white-space:nowrap;
  }
  .live-pill.show{ display:flex; }
  .live-pill.focused{ border-color:#fff; }
  .live-pill-dot{ width:7px; height:7px; border-radius:50%; background:#fff; flex-shrink:0; }

  /* player: suggestions — ONE single vertical list (YouTube "up next" style),
     never horizontal/side-scrolling. Sits BELOW the video in normal document
     flow (scroll down to reach it) — #player-top-row is pinned via
     position:sticky above, so the video stays in place while this scrolls,
     it never gets scrolled away with it. */
  #player-suggestions{ flex-shrink:0; padding:2.6vh 1.6vw 4vh; scroll-behavior:smooth; }
  #player-suggestions .row-title{ font-size:1.57vw; margin-bottom:1.4vh; color:var(--text); font-family:var(--font-display); font-weight:800; }
  #player-suggestions-list{ display:flex; flex-direction:column; gap:1.4vh; }
  .suggest-row{
    display:flex; gap:1vw; align-items:stretch; cursor:pointer; border-radius:12px;
    padding:.6vh; border:2px solid transparent; transition:background .2s ease, border-color .2s ease;
  }
  .suggest-row.focused{ background:var(--surface); border-color:var(--accent); }
  .suggest-row .thumb{
    position:relative; flex:0 0 16vw; max-width:220px; aspect-ratio:16/9; border-radius:10px;
    overflow:hidden; background:var(--surface-2);
  }
  .suggest-row .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .suggest-row .info{ flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:.5vh; }
  .suggest-row .s-title{ font-weight:700; font-size:1.44vw; line-height:1.4; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .suggest-row .s-channel{ color:var(--muted); font-size:1.26vw; }
  .suggest-row .s-meta{ color:var(--muted); font-size:1.26vw; }

  /* offline screen: past broadcasts (VODs) + clips rows */
  #offline-vods, #offline-clips{ margin-top:3vh; text-align:start; max-width:60vw; }
  #offline-vods .row-title, #offline-clips .row-title{ font-size:1.57vw; font-weight:800; margin-bottom:1.2vh; color:var(--text); font-family:var(--font-display); }
  .vod-card, .clip-card{
    flex:0 0 auto; width:calc((100% - 3 * 1.1vw)/4); cursor:pointer;
    border:3px solid transparent; border-radius:var(--radius); overflow:hidden;
    transition:transform .3s cubic-bezier(.22,.9,.35,1), border-color .3s ease;
  }
  .vod-card.focused, .clip-card.focused{ transform:translateY(-.6vh) scale(1.03); border-color:var(--accent); }
  .vod-card .thumb, .clip-card .thumb{ aspect-ratio:16/9; }
  .vod-card .thumb::after, .clip-card .thumb::after{
    content:'\25B6'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:2.30vw; color:#fff; text-shadow:0 2px 8px rgba(0,0,0,.7); opacity:.9; pointer-events:none;
  }
  .vod-meta, .clip-meta{ font-size:1.2vw; color:#d8d8d8; margin-top:.35vh; font-weight:600; }
  .vod-title, .clip-title{ font-size:1.23vw; color:var(--text); font-weight:700; margin-top:.2vh;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }


  /* settings */
  .field-label{ color:var(--muted); font-size:1.44vw; margin:2vh 0 .6vh; }
  .field{
    background:var(--surface); border-radius:10px; padding:1.2vh 1.2vw; font-size:1.57vw;
    border:3px solid transparent; margin-bottom:1vh; word-break:break-all; direction:ltr; text-align:start;
  }
  .field.focused{ border-color:var(--accent); }
  .hint{ color:var(--muted); font-size:1.33vw; line-height:1.7; margin-top:2.4vh; max-width:52vw; }

  .setting-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--surface); border-radius:10px; padding:1.5vh 1.4vw; font-size:1.51vw;
    border:3px solid transparent; margin-bottom:1vh; cursor:pointer;
  }
  .setting-row.focused{ border-color:var(--accent); }
  .setting-row .setting-label{ color:var(--text); font-weight:600; }
  .setting-row .setting-val{ color:var(--accent-2); font-weight:800; }
  .setting-row.action .setting-label{ color:#FF8C7A; }
  .setting-row.action .setting-val{ color:#FF8C7A; }
  .setting-row.acct-switch{ justify-content:flex-start; gap:1.2vw; padding:1.3vh 1.4vw; margin-bottom:3vh; }
  .acct-switch .as-av{ width:3.6vw; height:3.6vw; min-width:44px; min-height:44px; border-radius:50%; overflow:hidden; flex:none; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 100%); color:#fff; font-weight:800; font-size:1.8vw; }
  .acct-switch .as-av img{ width:100%; height:100%; object-fit:cover; display:block; }
  .acct-switch .as-av svg{ width:55%; height:55%; fill:#fff; }
  .acct-switch .as-txt{ flex:1; min-width:0; }
  .acct-switch .as-name{ font-weight:800; font-size:1.6vw; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .acct-switch .as-sub{ font-size:1.25vw; color:var(--muted); margin-top:.3vh; }
  .acct-switch .as-arrow{ width:1.8vw; height:1.8vw; min-width:20px; color:var(--muted); flex:none; }
  html[dir="rtl"] .acct-switch .as-arrow{ transform:scaleX(-1); }
  .acct-switch.focused .as-arrow{ color:var(--text); }

  /* ---- Account card at the top of Settings: avatar, level progress, and a
     daily-claim streak (all tracked locally in this app — Kick's own
     account level/streak/collectibles aren't exposed by the public API) ---- */
  .acct-card{
    background:var(--surface); border-radius:16px; padding:3vh 2vw 2.4vh;
    margin-bottom:3vh; text-align:center;
  }
  .acct-avatar{
    width:4.6vw; height:4.6vw; min-width:56px; min-height:56px; border-radius:50%;
    margin:0 auto 1.4vh; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:800; font-size:2.30vw; color:#fff;
    background:linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
  }
  .acct-name{ font-family:var(--font-display); font-weight:800; font-size:1.86vw; margin-bottom:.8vh; }
  .acct-sub{ color:var(--muted); font-size:1.36vw; max-width:36vw; margin:0 auto 1.8vh; line-height:1.6; }
  .acct-levelbar{ height:8px; border-radius:5px; background:var(--surface-2); overflow:hidden; }
  .acct-levelbar-fill{ height:100%; background:#fff; border-radius:5px; transition:width .4s ease; }
  .acct-level-pct{ font-size:1.36vw; margin-top:1vh; margin-bottom:2vh; }
  .acct-level-pct b{ color:#3ddc84; }
  .acct-streak-row{
    display:flex; align-items:center; gap:1vw; background:var(--surface-2);
    border-radius:12px; padding:1.4vh 1.2vw; text-align:start;
  }
  .acct-streak-icon{ font-size:2.30vw; flex-shrink:0; }
  .acct-streak-info{ flex:1; min-width:0; }
  .acct-streak-title{ font-weight:800; font-size:1.51vw; margin-bottom:.8vh; }
  .acct-streak-bar{ display:flex; gap:4px; direction:ltr; }
  .acct-streak-seg{
    flex:1; height:14px; background:var(--surface); border-radius:2px;
    transform:skewX(-20deg);
  }
  .acct-streak-seg.filled{ background:var(--accent-2); }
  .acct-claim-hint{ color:var(--muted); font-size:1.26vw; text-align:start; margin-top:1.2vh; }
  .acct-claim-btn{
    display:block; width:100%; margin-top:1.8vh; padding:1.3vh; border-radius:10px; border:none;
    cursor:pointer; background:var(--accent); color:#fff; font-weight:800; font-size:1.44vw;
    font-family:var(--font-body);
  }
  .acct-claim-btn[disabled]{ background:var(--surface-2); color:var(--muted); cursor:default; }

  ::-webkit-scrollbar{ display:none; }
  /* ---- download progress toast ---- */
  #dl-toast{
    position:fixed; inset-inline:0; bottom:4vh; margin-inline:auto; width:max-content; max-width:80vw;
    display:none; align-items:center; gap:.6rem; z-index:90; pointer-events:none;
    padding:.7rem 1.5rem; border-radius:999px; font-size:.95rem; font-weight:700; color:var(--text);
    border:1px solid color-mix(in srgb, var(--accent) 55%, transparent);
    background:linear-gradient(90deg, color-mix(in srgb, var(--accent) 38%, #0A0A0A) var(--p,0%), rgba(10,10,10,.94) var(--p,0%));
    box-shadow:0 10px 30px rgba(0,0,0,.55);
  }
  #dl-toast.show{ display:flex; }
  #dl-toast.err{ border-color:#ff5252; }
  #dl-toast.rec::before{
    content:''; width:.65rem; height:.65rem; border-radius:50%; background:var(--accent);
    animation:dlPulse 1.1s ease-in-out infinite;
  }
  @keyframes dlPulse{ 0%,100%{ opacity:1; } 50%{ opacity:.25; } }
  /* ---- Downloads screen ---- */
  #dl-sub{ color:var(--muted); font-size:1.31vw; font-weight:600; margin:-1vh 0 2vh; }
  #dl-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:2.6vh 1.3vw; padding:.6vh .3vw 2vh; }
  .dl-item{ display:flex; flex-direction:column; gap:.9vh; min-width:0; }
  .dl-card{ width:auto; }
  .dl-del{
    align-self:flex-start; font-size:1.15vw; font-weight:700; color:var(--muted); cursor:pointer;
    border:2px solid color-mix(in srgb, #fff 14%, transparent); border-radius:8px; padding:.5vh 1.1vw;
    transition:.18s; font-family:var(--font-body);
  }
  .dl-del.focused{ border-color:var(--accent); color:var(--text); background:color-mix(in srgb, var(--accent) 22%, transparent); transform:scale(1.05); }

  /* ===== Player v2: white accent / black ink, sizes in vh like the reference ===== */
  #player-overlay{ --accent:#fff; }
  #player-overlay .mini-btn{ width:6.4vh; height:6.4vh; color:#fff; border:.35vh solid transparent; }
  #player-overlay .mini-btn svg{ width:3.3vh; height:3.3vh; }
  #player-overlay .mini-btn.focused{ background:#000; color:#fff; border-color:#fff; transform:none; }
  #player-overlay .mini-btn.active{ background:rgba(255,255,255,.2); }
  #player-overlay .mini-btn[data-label]::after{ font-size:2.6vh; padding:.7vh 1.4vh; bottom:calc(100% + 1.2vh); }
  #player-overlay .seek-btn{ width:6.4vh; height:6.4vh; }
  #player-overlay .center-playbtn{ width:9vh; height:9vh; background:#fff; color:#000; border:.35vh solid transparent; box-shadow:0 6px 18px rgba(0,0,0,.5); }
  #player-overlay .center-playbtn svg{ width:4.4vh; height:4.4vh; }
  #player-overlay .center-playbtn.focused{ border-color:#000; box-shadow:0 0 0 .6vh rgba(255,255,255,.55); transform:scale(1.06); }
  #player-overlay .player-bar{ padding:1vh 1.4vw 1.8vh; }
  #player-overlay .side-bar{ background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.12); padding:.8vh 1.2vh; gap:1vh; }
  #player-overlay .side-left{ padding:.5vh 2.2vh .5vh 1.8vh; gap:1.2vh; }
  #player-overlay .side-bar .mini-icon{ width:3vh; height:3vh; color:#fff; }
  .vcol{ display:flex; flex-direction:column; align-items:flex-start; line-height:1.05; }
  #player-viewers-count{ font-size:3.2vh !important; font-weight:800; color:#fff; }
  .vlabel{ font-size:1.4vh; font-weight:700; letter-spacing:.12em; color:rgba(255,255,255,.65); text-transform:uppercase; }
  #player-overlay .channel-avatar{ width:7.6vh; height:7.6vh; border:.4vh solid #fff; }
  #player-overlay .bottomleft-cluster{ gap:1.4vh; }
  #player-overlay .live-pill{ background:#000; color:#fff; border:.4vh solid #fff; font-size:3vh; padding:0 2.4vh; height:7vh; box-shadow:none; gap:1vh; }
  #player-overlay .live-pill.focused{ background:#fff; color:#000; }
  #player-overlay .live-pill.focused .live-pill-dot{ background:#000; }
  #player-overlay .live-pill-dot{ width:1.3vh; height:1.3vh; }
  #player-overlay .player-timeline{ padding:0 1.4vw; gap:.6vh; }
  #player-overlay .player-timeline-track{ height:1.7vh; min-height:8px; background:rgba(255,255,255,.28); }
  #player-overlay .player-timeline-track.focused{ height:1.7vh; outline:none; }
  #player-overlay .player-timeline-fill{ background:#fff; }
  #player-overlay .player-timeline-times{ font-size:2.6vh; }
  #ptl-knob{
    display:none; position:absolute; top:.85vh; width:4.2vh; height:4.2vh; border-radius:50%;
    background:#fff; border:.5vh solid #fff; transform:translate(-50%,-50%); pointer-events:none; z-index:3;
    box-shadow:0 2px 8px rgba(0,0,0,.6);
  }
  /* focused bar: red progress + white knob; times row swapped (live/duration on the start side, -behind on the end side) */
  #player-overlay .player-timeline-track.focused .player-timeline-fill,
  #player-screen.scrubbing #player-overlay .player-timeline-fill{ background:var(--live,#ff1f1f); }
  #player-overlay .player-timeline-times{ flex-direction:row-reverse; }
  .player-timeline-track.focused + #ptl-knob, #player-screen.scrubbing #ptl-knob{ display:block; }
  #seek-preview{ bottom:calc(100% + 3.4vh); width:min(24vw, 34vh*1.78); }
  #seek-preview-time{ font-size:3vh; }
  #player-screen.scrubbing #player-overlay .player-bar{ visibility:hidden; }
  #player-screen.scrubbing #chat-overlay{ opacity:0; }
  /* chat: taller, tucked BEHIND the controls, no "High hype" meter */
  #chat-overlay{ inset-block:2vh 15vh; }
  #chat-hype-row, #chat-hype-bar, #chat-hype-label{ display:none !important; }
  #chat-overlay{ inset-block:2vh 7vh; }
  /* name tag above ANY focused control in the bar (play/pause, 10s buttons, avatar) */
  #player-overlay .center-playbtn[data-label], #player-overlay .channel-avatar[data-label]{ position:relative; overflow:visible; }
  #player-overlay .center-playbtn[data-label]::after, #player-overlay .channel-avatar[data-label]::after{
    content:attr(data-label); position:absolute; bottom:calc(100% + 1.2vh); left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.9); color:#fff; padding:.7vh 1.4vh; border-radius:10px; font-size:2.6vh; font-weight:800;
    line-height:1.2; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .15s ease; z-index:9;
  }
  #player-overlay .center-playbtn[data-label].focused::after, #player-overlay .channel-avatar[data-label].focused::after{ opacity:1; }
  #player-overlay .channel-avatar.focused{ outline:.35vh solid #fff; outline-offset:.4vh; }

  /* ===== Library / history ===== */
  #lib-grid{ display:flex; flex-wrap:wrap; gap:3vh 1.4vw; margin-top:1.6vh; }
  .lib-card{
    flex:0 0 auto; width:calc((100% - 2 * 1.4vw)/3); cursor:pointer; position:relative;
    border:3px solid transparent; border-radius:var(--radius); overflow:hidden;
    transition:transform .3s cubic-bezier(.22,.9,.35,1), border-color .3s ease;
  }
  .lib-card.focused{ transform:translateY(-.6vh) scale(1.03); border-color:var(--accent); }
  .lib-card .thumb{ position:relative; aspect-ratio:16/9; background:var(--surface-2); border-radius:10px; overflow:hidden; }

<script>
/* Profile loading screen: avatar alone in the middle, name under it, a ring turning around the avatar.
   Shown right away after a profile is chosen (also after the page reload a profile switch causes). */
(function(){
  var L=document.getElementById('ls-loader'); if(!L) return;
  var pic=document.getElementById('ll-pic'), nm=document.getElementById('ll-name');
  var PERSON='<svg viewBox="0 0 24 24" style="width:50%;height:50%;fill:#fff"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>';
  function letter(n){ return (n||'?').slice(0,1).toUpperCase(); }
  window.lsLoaderShow=function(info){
    info=info||{}; nm.textContent=info.name||''; pic.innerHTML='';
    if(info.pic){ var im=new Image(); im.onerror=function(){ if(im.parentNode) im.parentNode.removeChild(im); pic.textContent=letter(info.name); }; im.src=info.pic; pic.appendChild(im); }
    else if(info.guest){ pic.innerHTML=PERSON; } else { pic.textContent=letter(info.name); }
    L.classList.remove('out'); L.classList.add('show'); L.setAttribute('aria-hidden','false');
    window.__lsLoaderOn=true;
  };
  window.lsLoaderSetPic=function(url){
    if(!url||!window.__lsLoaderOn) return;
    var cur=pic.querySelector('img'); if(cur && cur.getAttribute('src')===url) return;
    var im=new Image(); im.onload=function(){ pic.innerHTML=''; pic.appendChild(im); }; im.src=url;
  };
  window.lsLoaderHide=function(){
    L.classList.add('out');
    setTimeout(function(){ L.classList.remove('show','out'); L.setAttribute('aria-hidden','true'); window.__lsLoaderOn=false; },480);
  };
  function swallow(e){ if(!window.__lsLoaderOn) return; e.preventDefault(); e.stopPropagation(); if(e.stopImmediatePropagation) e.stopImmediatePropagation(); }
  window.addEventListener('keydown',swallow,true); window.addEventListener('keyup',swallow,true); window.addEventListener('keypress',swallow,true);
  try{
    var raw=sessionStorage.getItem('ls_loading');
    if(raw){ sessionStorage.removeItem('ls_loading'); var intro=document.getElementById('intro'); if(intro&&intro.parentNode) intro.parentNode.removeChild(intro); window.lsLoaderShow(JSON.parse(raw)||{}); }
  }catch(e){}
})();
</script>
<script>

(function(){ try{

<script>
/* Intro: runs once per cold start of the page. Coming back from the background does not
   reload the page, so it never replays. Any key / tap skips it (and is swallowed). */
(function(){
  var el=document.getElementById('intro'); if(!el) return;
  if(window.__lsLoaderOn){ if(el.parentNode) el.parentNode.removeChild(el); return; }   // profile switch: loading screen instead of the intro
  var done=false, tFade, tEnd;
  function finish(fast){
    if(done) return; done=true;
    clearTimeout(tFade); clearTimeout(tEnd);
    window.removeEventListener('keydown',skip,true);
    el.removeEventListener('click',skip,true);
    el.removeEventListener('touchstart',skip,true);
    if(fast) el.style.transitionDuration='.2s';
    el.classList.add('out');
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },fast?260:560);
  }
  var t0=Date.now();
  function skip(e){ if(e && (Date.now()-t0<800 || e.repeat)){ e.preventDefault(); e.stopPropagation(); return; } var wasKey=e&&e.type==='keydown'; if(e){ e.preventDefault(); e.stopPropagation(); if(e.stopImmediatePropagation) e.stopImmediatePropagation(); } if(wasKey){ window.addEventListener('keyup',swallow,true); setTimeout(function(){ window.removeEventListener('keyup',swallow,true); },1500); } finish(true); }
  // swallow the matching keyup of the key that skipped, so the app never sees half a key press
  function swallow(e){ e.stopPropagation(); e.preventDefault(); window.removeEventListener('keyup',swallow,true); }
  window.addEventListener('keydown',skip,true);
  el.addEventListener('click',skip,true);
  el.addEventListener('touchstart',skip,true);
  // If the logo image can't load, don't hold the app back
  var im=new Image(); im.onerror=function(){ finish(true); }; im.src='./icon-512.png';
  tFade=setTimeout(function(){ finish(false); },2050); // fade-out starts here (≈2.6s total)
})();
</script>

<script>
/* ---------- Visible error banner ----------
   Taps doing nothing (no console access on a TV/phone) usually means a JS
   error fired somewhere and silently stopped the rest of the script. This
   surfaces it on-screen instead of failing invisibly. Remove once the app
   is stable. */
window.addEventListener('error', function(e){
  var b = document.createElement('div');
  b.style.cssText = 'position:fixed;inset-inline:0;top:0;z-index:99999;background:#b00020;color:#fff;font:12px/1.4 monospace;padding:8px 12px;white-space:pre-wrap;direction:ltr;text-align:left;';
  b.textContent = 'JS error: ' + (e.message || e) + '  @' + (e.filename||'') + ':' + (e.lineno||'');
  document.body.appendChild(b);
});

  var b = document.createElement('div');

function labelFor(key, val){
  switch(key){
    case 'autoplay': case 'autoFullscreen': case 'showChat': case 'hideMature': case 'remoteTestMode':
    case 'hoverPreview': case 'resumeLast': case 'bgAudio':
      return val ? t('on') : t('off');
    case 'defaultQuality': return val ? val + 'p' : t('qualityAuto');
    case 'defaultScreen':
      return val === 'discover' ? t('navLive') : val === 'favorites' ? t('navFav') : t('navSearch');
    case 'discoverLimit': return String(val);
    case 'languageFilter': return val === 'ar' ? t('langAr') : val === 'en' ? t('langEn') : t('langAll');
    case 'refreshInterval':
      return val === 0 ? t('off') : val === 30 ? t('every30') : val === 60 ? t('every60') : t('every5m');
  }
  return String(val);
}

(function migrateFullscreenDefault(){
  try{
    if(localStorage.getItem('livescreen_fs_migrated')) return;
    localStorage.setItem('livescreen_fs_migrated','1');
    if(IS_TOUCH_ONLY){
      const cur = JSON.parse(localStorage.getItem('livescreen_settings') || '{}');
      cur.autoFullscreen = false;
      localStorage.setItem('livescreen_settings', JSON.stringify(cur));

// Records that the viewer just opened a live channel (local-only, last 60 plays).
function logWatchHistory(channel){
  const key = (channel || '').toLowerCase();
  const match = state.lastStreams.find(s => (s.slug || '').toLowerCase() === key);
  const cat = match && match.category ? match.category.name : '';
  state.watchHistory.push({ channel, cat, ts: Date.now() });
  if(state.watchHistory.length > 60) state.watchHistory = state.watchHistory.slice(-60);
  localStorage.setItem('livescreen_watch_history', JSON.stringify(state.watchHistory));
}

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function claimDailyStreak(){
  const today = todayStr();
  if(state.account.lastClaim === today) return; // already claimed today
  const yesterday = (()=>{ const d = new Date(); d.setDate(d.getDate()-1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); })();
  state.account.streak = (state.account.lastClaim === yesterday) ? (state.account.streak + 1) : 1;
  state.account.lastClaim = today;
  state.account.xp += 10; // a small XP bonus for claiming
  saveAccount();
  renderAccountCard();
}

function renderNavAccount(){
  try{
    const av = document.getElementById('na-av'), nm = document.getElementById('na-name');
    if(!av) return;
    const ku = state.kickUser, name = (ku && (ku.username || ku.name)) || t('acctGuestName');
    const pic = ku && (ku.profile_picture || ku.profile_pic || ku.profilepic);
    if(nm) nm.textContent = name;
    const fallback = () => { if(ku){ av.innerHTML = ''; av.textContent = name.slice(0,1).toUpperCase(); } else av.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>'; };
    if(pic){
      if(av.dataset.src !== pic){ av.dataset.src = pic; av.innerHTML = ''; const im = document.createElement('img'); im.src = pic; im.onerror = fallback; av.appendChild(im); }
    } else { av.dataset.src = ''; fallback(); }
  }catch(e){}
}

  const fillEl = document.getElementById('acct-levelbar-fill');
  const pctEl = document.getElementById('acct-level-pct');
  const streakTitleEl = document.getElementById('acct-streak-title');
  const streakBarEl = document.getElementById('acct-streak-bar');
  const claimBtn = document.getElementById('acct-claim-btn');
  if(!avatarEl || !nameEl) return;

  const uname = (state.kickUser && (state.kickUser.username || state.kickUser.name)) || t('acctGuestName');
  nameEl.textContent = uname;
  avatarEl.textContent = (uname || '?').slice(0,1).toUpperCase();
  renderNavAccount();

  const XP_PER_LEVEL = 60; // ~1 "level" per hour of watch time tracked in this app
  const xp = state.account.xp || 0;
  const level = Math.floor(xp / XP_PER_LEVEL) + 1;
  const pct = Math.round((xp % XP_PER_LEVEL) / XP_PER_LEVEL * 100);
  fillEl.style.width = pct + '%';
  pctEl.innerHTML = `<b>${pct}%</b> ${t('acctLevel')} ${level + 1}`;

  const streak = state.account.streak || 0;
  streakTitleEl.textContent = `${streak} ${t('acctStreakDays')}`;
  const segs = 7;
  streakBarEl.innerHTML = Array.from({length:segs}).map((_,i) =>
    `<div class="acct-streak-seg${i < Math.min(streak, segs) ? ' filled' : ''}"></div>`
  ).join('');

  const claimedToday = state.account.lastClaim === todayStr();
  claimBtn.textContent = claimedToday ? t('acctClaimedBtn') : t('acctClaimBtn');
  claimBtn.disabled = claimedToday;
  claimBtn.onclick = claimedToday ? null : claimDailyStreak;
}
