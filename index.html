/* ---------- Focus / remote navigation ---------- */
let focusables = [];
let focusIndex = 0;

// Overlays that behave like modals: while any of these is open, remote
// navigation must stay trapped inside it (otherwise arrow keys silently move
// focus to cards/buttons hidden underneath, which is invisible and confusing
// on a TV). Listed in the order they should be checked.
// Reliable visibility check for the focus system. offsetParent is NOT safe
// for this: per spec it returns null for any element whose own computed
// position is "fixed" — even when that element is perfectly visible on
// screen (this is exactly what was hiding the notification bell, which is
// position:fixed, from remote navigation). getClientRects() has no such
// blind spot: empty only for display:none / detached elements.
function isNavVisible(el){
  if(el.getClientRects().length === 0) return false;
  if(el.closest && el.closest('#chat-overlay:not(.visible)')) return false;   // hidden side-chat must never catch focus
  return true;
}

function activeModalRoot(){
  const ctxM = document.getElementById('ctx-menu');
  if(ctxM && ctxM.classList.contains('show')) return ctxM;
  const gateEl = document.getElementById('ls-gate');
  if(gateEl && gateEl.classList.contains('show')) return gateEl;
  const ssOverlay = document.getElementById('startup-suggestion-overlay');
  if(ssOverlay && ssOverlay.classList.contains('show')) return ssOverlay;
  const bellM = document.getElementById('bell-menu');
  if(bellM && bellM.classList.contains('show')) return bellM;
  const qualityMenu = document.getElementById('quality-menu');
  if(qualityMenu && qualityMenu.classList.contains('show')) return qualityMenu;
  const composeOverlay = document.getElementById('chat-compose-overlay');
  if(composeOverlay && composeOverlay.classList.contains('show')) return composeOverlay;
  return null;
}

function isLibScreen(n){ return n === 'favorites' || n === 'library' || n === 'downloads' || n === 'notifications'; }
function navBtnFor(n){ return isLibScreen(n) ? document.getElementById('nav-lib') : document.querySelector(`.navbtn[data-screen="${n}"]`); }
function refreshFocusables(preserveEl){
  const prevEl = focusables[focusIndex];
  const modalRoot = activeModalRoot();
  if(modalRoot){
    // Trap: only elements inside the open overlay are reachable until it closes.
    focusables = Array.from(modalRoot.querySelectorAll('[data-nav]')).filter(el => isNavVisible(el));
  } else {
    const screenEl = document.querySelector('.screen.active') || document.body;
    // Hidden sidebar (player-active) must not stay focusable: index 0 would be
    // the Search button and applyFocus() would open the Search screen.
    const navEls = Array.from(document.querySelectorAll('#nav [data-nav], #nav-bottom [data-nav]')).filter(el => isNavVisible(el));
    // Elements that float above every screen (notification bell, the floating
    // chat panel) but aren't inside #nav or the active screen either.
    const globalEls = Array.from(document.querySelectorAll('#app > [data-nav], #chat-overlay [data-nav]'))
      .filter(el => isNavVisible(el));
    const screenEls = Array.from(screenEl.querySelectorAll('[data-nav], .card, .key')).filter(el => isNavVisible(el));
    focusables = [...navEls, ...globalEls, ...screenEls];
  }
  if(preserveEl){
    const idx = focusables.indexOf(preserveEl);
    focusIndex = idx >= 0 ? idx : Math.min(focusIndex, focusables.length - 1);
  } else {
    focusIndex = Math.min(focusIndex, focusables.length - 1);
  }
  if(focusIndex < 0) focusIndex = 0;
  {
    // v14: if the focused element vanished (e.g. last card removed) the index used to clamp onto the
    // last top-bar button (Settings) and the "rest focus opens that screen" rule jumped to Settings.
    const nel = focusables[focusIndex];
    if(nel && nel.closest && nel.closest('#sidebar') && !preserveEl && prevEl && !(prevEl.closest && prevEl.closest('#sidebar')) && nel.dataset && nel.dataset.screen && nel.dataset.screen !== state.screen){
      let ni = focusables.findIndex(e => !(e.closest && e.closest('#sidebar')));
      if(ni < 0){ const cur = navBtnFor(state.screen); ni = cur ? focusables.indexOf(cur) : -1; }
      if(ni >= 0) focusIndex = ni;
    }
  }
  applyFocus();
}

function applyFocus(){
  document.querySelectorAll('.focused').forEach(el => el.classList.remove('focused'));
  const el = focusables[focusIndex];
  if(el){
    el.classList.add('focused');
    if(!(el.closest && el.closest('#sidebar'))) lastContentEl = el;
    {
      // v28: moving down to a row puts that row (title + cards) at the top of the screen,
      // so the previous row no longer peeks in above it and the next row shows below.
      const rowBox = (el.closest && !el.closest('#sidebar') && el.closest('.hrow')) ? el.closest('#offline-vods, #offline-clips, .row') : null;
      if(rowBox) rowBox.scrollIntoView({block:'start', inline:'nearest', behavior:'smooth'});
      else el.scrollIntoView({block:'nearest', inline:'nearest', behavior:'smooth'});
    }
    // Sidebar-overlap fix: scrollIntoView({inline:'nearest'}) only scrolls the
    // row's own scrollport the minimum distance needed, with no idea the fixed
    // #sidebar visually sits on top of it — so after paging deep into a row and
    // coming back to its first card, the row can stop short of scrollLeft:0 (or
    // its RTL/right-edge equivalent), leaving that card's edge sitting under the
    // sidebar. This does not touch moveFocus() or how focus is chosen — it only
    // adds an extra correction once focus has actually landed on a row's real
    // first/last item, forcing that row fully home the same as on first load.
    const hrow = el.closest('.hrow');
    if(hrow){
      // v14: the focused card becomes the FIRST card of the row (half of the next one peeks in),
      // instead of leaving half of the previous card on the other side.
      const rowItem = el.closest('.hrow > *');
      const rtl = document.getElementById('html-root').getAttribute('dir') === 'rtl';
      const items = Array.from(hrow.children);
      if(rowItem === items[0]){
        hrow.scrollTo({ left: rtl ? hrow.scrollWidth : 0, behavior:'smooth' });
      } else if(rowItem){
        const rr = hrow.getBoundingClientRect(), ir = rowItem.getBoundingClientRect();
        const pad = parseFloat(getComputedStyle(hrow).paddingInlineStart) || 0;
        const delta = rtl ? (ir.right - (rr.right - pad)) : (ir.left - (rr.left + pad));
        if(Math.abs(delta) > 2) hrow.scrollTo({ left: hrow.scrollLeft + delta, behavior:'smooth' });
      }
    }
  }
  updateNavInfoPanel(el);
  const sidebar = document.getElementById('sidebar');
  updateHeroPreview(el);
  spotlightPaused = !!(el && el.closest && el.closest('#spotlight'));

  // Netflix-rail style live switching: just resting D-pad focus on a sidebar
  // item (Home / Favorites / Notifications / Settings) while scrolling up/down
  // the rail opens that screen right away — no separate OK/Enter press needed.
  // keepFocus:true keeps the highlight on the sidebar button itself so paging
  // further up/down the rail keeps switching screens; only actually moving
  // focus off the sidebar (via moveFocus) hands control to the new screen's
  // own content.
  if(el && el.dataset && el.dataset.screen && el.dataset.screen !== 'search' && el.closest && el.closest('#sidebar') && state.screen !== el.dataset.screen){
    setScreen(el.dataset.screen, { keepFocus:true });
  }
}

/* ---------- Hero live preview ----------
   Netflix-TV-style behaviour: resting D-pad focus on a live card for a
   short beat (1.5s, so quick scrolling through a row never fires a burst
   of stream lookups) swaps that card's static thumbnail for a small,
   silent, autoplaying preview of the actual stream. Moving focus away
   before the debounce fires cancels it; moving away after it started
   tears the preview back down to the thumbnail image. */
let heroPreviewTimer = null;
let heroPreviewHls = null;
let heroPreviewChannel = null;

function clearHeroPreview(){
  clearTimeout(heroPreviewTimer);
  heroPreviewTimer = null;
  if(heroPreviewHls){ try{ heroPreviewHls.destroy(); }catch(e){} heroPreviewHls = null; }
  if(heroPreviewChannel){
    const prevCard = document.querySelector(`.card[data-channel="${CSS.escape(heroPreviewChannel)}"]`);
    if(prevCard){
      const vid = prevCard.querySelector('.thumb-preview-video');
      if(vid) vid.remove();
      const img = prevCard.querySelector('.thumb > img');
      if(img) img.style.opacity = '';
    }
    heroPreviewChannel = null;
  }
}

function updateHeroPreview(el){
  clearHeroPreview();
  if(!state.settings.hoverPreview) return;
  // Only in the browsing screens (not mid-playback, not search/settings) —
  // and only for an actual channel card that's currently marked live.
  if(!el || !el.classList || !el.classList.contains('card')) return;
  if(state.screen !== 'discover' && state.screen !== 'favorites') return;
  const channel = el.dataset.channel;
  if(!channel) return;
  if(!el.querySelector('.badge.dot.live')) return;
  heroPreviewTimer = setTimeout(async () => {
    let info;
    try{ info = await fetchPlaybackInfo(channel); }catch(e){ return; }
    if(focusables[focusIndex] !== el) return; // focus moved on while we were fetching
    if(!info || !info.isLive || !info.playbackUrl) return;
    const thumb = el.querySelector('.thumb');
    if(!thumb) return;
    const img = thumb.querySelector('img');
    let video = thumb.querySelector('.thumb-preview-video');
    if(!video){
      video = document.createElement('video');
      video.className = 'thumb-preview-video';
      video.muted = true; video.playsInline = true; video.autoplay = true; video.loop = true;
      thumb.insertBefore(video, thumb.firstChild);
    }
    if(img) img.style.opacity = '0';
    if(window.Hls && Hls.isSupported()){
      heroPreviewHls = new Hls({ maxBufferLength:8, capLevelToPlayerSize:true });
      heroPreviewHls.loadSource(info.playbackUrl);
      heroPreviewHls.attachMedia(video);
      heroPreviewHls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(()=>{}));
    } else if(video.canPlayType('application/vnd.apple.mpegurl')){
      video.src = info.playbackUrl;
      video.play().catch(()=>{});
    }
    heroPreviewChannel = channel;
  }, 1500);
}

/* Temporary "what's this" info panel — shown near the video while paging
   through the suggestions/VODs/clips row below it with the remote, like
   the preview panel on YouTube TV. Reads straight from the card's own
   rendered text so it always matches what's on screen. */
state.navInfoTimer = null;

function extractNavInfo(el){
  if(!el) return null;
  if(el.classList.contains('suggest-row')){
    const nameEl = el.querySelector('.s-channel'), metaEl = el.querySelector('.s-meta');
    return { name: nameEl ? nameEl.textContent : '', meta: metaEl ? metaEl.textContent : '' };
  }
  if(el.classList.contains('vod-card')){
    const nameEl = el.querySelector('.vod-title'), metaEl = el.querySelector('.vod-meta');
    return { name: nameEl ? nameEl.textContent : '', meta: metaEl ? metaEl.textContent : '' };
  }
  if(el.classList.contains('clip-card')){
    const nameEl = el.querySelector('.clip-title'), metaEl = el.querySelector('.clip-meta');
    return { name: nameEl ? nameEl.textContent : '', meta: metaEl ? metaEl.textContent : '' };
  }
  return null;
}

function updateNavInfoPanel(el){
  if(state.screen !== 'player'){ hideNavInfoPanel(true); return; }
  const info = extractNavInfo(el);
  if(!info){ hideNavInfoPanel(); return; }
  const panel = document.getElementById('nav-info-panel');
  if(!panel) return;
  document.getElementById('nav-info-name').textContent = info.name || '';
  document.getElementById('nav-info-meta').textContent = info.meta || '';
  panel.classList.add('show');
  clearTimeout(state.navInfoTimer);
  state.navInfoTimer = setTimeout(() => hideNavInfoPanel(), 5000);
}

function hideNavInfoPanel(immediate){
  clearTimeout(state.navInfoTimer);
  const panel = document.getElementById('nav-info-panel');
  if(panel) panel.classList.remove('show');
}

var lastContentEl = null; // last focused element outside the sidebar (so "back to content" returns to where you were)

function moveFocus(dir){
  if(!focusables.length) return;
  const el = focusables[focusIndex];
  if(!el) return;
  // Timeline bar: left/right scrub the bar itself (with the thumbnail window).
  if(el.id === 'player-timeline-track' && (dir === 'left' || dir === 'right')){
    const r = document.getElementById('html-root').getAttribute('dir') === 'rtl';
    scrubStep((dir === 'right') !== r, KEY_REPEAT); return;
  }
  // On-screen keyboard: step through the key grid row by row (stable, no jumps).
  if(el.classList && el.classList.contains('key')){
    const keys = focusables.filter(f => f.classList && f.classList.contains('key'));
    const rows = [];
    keys.forEach(k => {
      const r = k.getBoundingClientRect(), cy = r.top + r.height/2;
      let row = rows.find(x => Math.abs(x.cy - cy) < r.height/2);
      if(!row){ row = { cy, items: [] }; rows.push(row); }
      row.items.push(k);
    });
    rows.sort((a, b) => a.cy - b.cy);
    rows.forEach(r => r.items.sort((a, b) => a.getBoundingClientRect().left - b.getBoundingClientRect().left));
    const ri = rows.findIndex(r => r.items.indexOf(el) >= 0);
    if(ri >= 0){
      const row = rows[ri], ci = row.items.indexOf(el);
      let target = null;
      if(dir === 'left' || dir === 'right'){
        target = row.items[ci + (dir === 'right' ? 1 : -1)];
        if(!target){
          if(dir === 'right'){                                    // end of the keyboard row: go to the results
            const res = focusables.find(f => f.closest && f.closest('#suggest-grid')) || focusables.find(f => f.closest && f.closest('#search-media'));
            if(res){ focusIndex = focusables.indexOf(res); applyFocus(); }
          }
          return;
        }
      } else {
        const nr = rows[ri + (dir === 'down' ? 1 : -1)];
        if(nr){
          const er = el.getBoundingClientRect(), cx = er.left + er.width/2;
          target = nr.items.slice().sort((a, b) => {
            const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
            return Math.abs(ra.left + ra.width/2 - cx) - Math.abs(rb.left + rb.width/2 - cx);
          })[0];
        }
      }
      if(target){ focusIndex = focusables.indexOf(target); applyFocus(); return; }
    }
  }
  // v47: channel page header — Back and Follow are reachable by the remote.
  // Up from the first row goes to Follow; Left/Right switch between Follow and Back.
  {
    const fol = focusables.find(f => f.id === 'chan-follow'), bk = focusables.find(f => f.id === 'chan-back');
    if(fol && (state.screen === 'channel' || document.getElementById('chan-follow'))){
      const go = t => { if(t){ focusIndex = focusables.indexOf(t); applyFocus(); } };
      if(el === bk && dir === 'right'){ go(fol); return; }
      if(el === fol && (dir === 'left' || dir === 'up')){ go(bk); return; }
      if(el === bk && dir === 'down'){ go(fol); return; }
      if(el !== fol && el !== bk && dir === 'up' && !(el.closest && el.closest('#sidebar'))){
        const body = focusables.filter(f => f !== fol && f !== bk && !(f.closest && f.closest('#sidebar')));
        const top = Math.min.apply(null, body.map(f => f.getBoundingClientRect().top));
        if(el.getBoundingClientRect().top <= top + 8){ go(fol); return; }
      }
    }
  }
  const rect = el.getBoundingClientRect();
  const vertical = (dir === 'up' || dir === 'down');
  const inSidebar = !!(el.closest && el.closest('#sidebar'));
  const fromHrow = vertical ? null : el.closest('.hrow');

  // Inside the sidebar, up/down just steps through the buttons in order.
  // (Using screen geometry here was the bug: the sidebar widens/narrows while
  // it animates, so the "nearest" element changed mid-tap and focus jumped
  // into the keyboard or skipped buttons.)
  if(inSidebar){
    // Top bar: left/right step through the buttons in their on-screen order; down returns to content.
    if(dir === 'left' || dir === 'right'){
      const side = focusables.filter(f => f.closest && f.closest('#sidebar'))
        .sort((a, b) => a.getBoundingClientRect().left - b.getBoundingClientRect().left);
      const next = side[side.indexOf(el) + (dir === 'right' ? 1 : -1)];
      if(next){ focusIndex = focusables.indexOf(next); applyFocus(); }
    } else if(dir === 'down'){
      let target = lastContentEl && focusables.indexOf(lastContentEl) >= 0 ? lastContentEl : null;
      if(!target){
        target = focusables.filter(f => !(f.closest && f.closest('#sidebar')))
          .sort((a, b) => { const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect(); return (ra.top - rb.top) || (ra.left - rb.left); })[0];
      }
      if(target){ focusIndex = focusables.indexOf(target); applyFocus(); }
    }
    return;
  }

  let best = -1, bestDist = Infinity;
  let bestInRow = -1, bestInRowDist = Infinity;
  focusables.forEach((cand, i) => {
    if(i === focusIndex) return;
    // Pressing up/down on content never jumps into the sidebar (it is only
    // reachable sideways) — otherwise the last key row fell into "Notifications".
    if(vertical && cand.closest && cand.closest('#sidebar')) return;
    const r = cand.getBoundingClientRect();
    const dx = (r.left+r.width/2) - (rect.left+rect.width/2);
    const dy = (r.top+r.height/2) - (rect.top+rect.height/2);
    let ok = false;
    // up/down prefer the element that is really above/below (aligned), not just closest.
    const dist = vertical ? (Math.abs(dy) + 3*Math.abs(dx)) : Math.hypot(dx,dy);
    if(dir==='right' && dx>10 && Math.abs(dy)<r.height*1.3) ok=true;
    if(dir==='left'  && dx<-10 && Math.abs(dy)<r.height*1.3) ok=true;
    if(dir==='down'  && dy>10) ok=true;
    if(dir==='up'    && dy<-10) ok=true;
    if(!ok) return;
    if(dist < bestDist){ bestDist = dist; best = i; }
    if(fromHrow && cand.closest('.hrow') === fromHrow && dist < bestInRowDist){ bestInRowDist = dist; bestInRow = i; }
  });
  if(bestInRow >= 0) best = bestInRow;
  if(best < 0){
    if(dir === 'up'){ // nothing above: go up into the top bar, onto the current screen's button
      const activeNav = navBtnFor(state.screen) || document.querySelector('#sidebar .navbtn');
      const idx = activeNav ? focusables.indexOf(activeNav) : -1;
      if(idx >= 0){ focusIndex = idx; applyFocus(); }
    }
    return;
  }

  if(!vertical){
    const landingInSidebar = !!(focusables[best].closest && focusables[best].closest('#sidebar'));
    if(!inSidebar && landingInSidebar){
      // Entering the sidebar: land on the button of the current screen.
      const activeNav = navBtnFor(state.screen);
      if(activeNav){
        const idx = focusables.indexOf(activeNav);
        if(idx >= 0) best = idx;
      }
    } else if(inSidebar && !landingInSidebar && lastContentEl){
      // Leaving the sidebar: go back to the element you came from.
      const idx = focusables.indexOf(lastContentEl);
      if(idx >= 0) best = idx;
    }
  }

  if(vertical){
    const fromHrow2 = el.closest('.hrow');
    const targetHrow = focusables[best].closest('.hrow');
    if(targetHrow && targetHrow !== fromHrow2){
      const rowItems = focusables.filter(f => f.closest('.hrow') === targetHrow);
      if(rowItems.length){
        const rtl = document.getElementById('html-root').getAttribute('dir') === 'rtl';
        rowItems.sort((a,b) => {
          const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
          return rtl ? rb.left - ra.left : ra.left - rb.left;
        });
        best = focusables.indexOf(rowItems[0]);
      }
    }
  }

  focusIndex = best; applyFocus();
}

function activate(el){
  if(!el) return;
  if(el.id === 'cd-from'){ clipOpenSourceVod(); return; }
  if(el.dataset && el.dataset.gate){ window.lsGateAct && window.lsGateAct(el); return; }
  if(el.id === 'nav-account'){ window.lsOpenWho && window.lsOpenWho(); return; }
  if(el.classList && el.classList.contains('ctx-item')){ ctxAction(el.dataset.act); return; }
  if(el.classList && el.classList.contains('libtab')){
    setScreen(el.dataset.screen);
    const t2 = document.querySelector('#screen-' + el.dataset.screen + ' .libtab.active');
    if(t2) refreshFocusables(t2);
    return;
  }
  if(el.id === 'chan-back'){ channelBack(); return; }
  if(el.id === 'chan-follow'){
    const ch = el.dataset.channelFollow;
    if(state.favorites.includes(ch)) removeFavorite(ch); else addFavorite(ch);
    const on = state.favorites.includes(ch);
    el.classList.toggle('on', on);
    el.textContent = on ? t('followingBtn') : t('saveFav');
    return;
  }
  if(el.dataset.screen){
    // Keep focus on the very button/tile that triggered the switch (el is
    // always the currently-focused element here, whether Enter was pressed
    // on the D-pad or this came from the click handlers below). Resetting
    // focusIndex to 0 would land focus back on the first sidebar item
    // (Search) and applyFocus()'s "rest focus -> open that screen" logic
    // would then silently flip the screen right back to Search.
    const idx = focusables.indexOf(el);
    if(idx >= 0) focusIndex = idx;
    setScreen(el.dataset.screen, { keepFocus:true });
    return;
  }
  if(el.id === 'set-uilang'){ toggleLang(); return; }
  if(el.id === 'set-kick-clientid'){ editKickClientId(); return; }
  if(el.id === 'set-kick-login'){
    if(state.kickUser){ if(confirm(t('kickLogoutConfirm'))) clearKickAuth(); }
    else { startKickLogin(); }
    return;
  }
  if(state.screen === 'search' && (el.dataset.channel || el.dataset.sug)) noteSearched(el.dataset.channel || el.dataset.sug);
  if(el.classList.contains('key')){ pressKey(el.dataset.key); return; }
  if(el.id === 'set-clientid'){ editSetting('clientId', t('clientId')); return; }
  if(el.id === 'set-proxyworker'){ editProxyWorker(); return; }
  if(el.id === 'set-clearfav'){
    if(confirm(t('confirmClearFav'))){
      state.favorites = [];
      localStorage.setItem('livescreen_favorites', '[]');
      try{ syncMarkClear('favorites'); }catch(e){}
      alert(t('doneClear'));
    }
    return;
  }
  if(el.id === 'set-test-notif'){
    pushLiveAlert(t('testNotifChannel'), { thumb: demoThumbDataUri(), title: 'Just Chatting with viewers', viewers: 1284 });
    return;
  }
  if(el.id === 'set-test-suggestion'){ testStartupSuggestion(); return; }
  if(el.id === 'set-reset'){
    if(confirm(t('confirmReset'))){
      localStorage.removeItem('livescreen_favorites');
      localStorage.removeItem('livescreen_settings');
      localStorage.removeItem('livescreen_client_id');
      localStorage.removeItem('livescreen_client_secret');
      location.reload();
    }
    return;

// Core remote-key handling, shared by the physical/TV keydown listener below
// Core remote-key handling, shared by the physical/TV keydown listener below
// and by the on-screen remote-test D-pad (same device, for QA — see
// wireRemoteTestPad() further down).
/* ---------- Remote-test D-pad ----------
   A same-device on-screen D-pad, toggled from Settings. Every tap goes
   straight through handleRemoteKey() — the exact same function a physical
   remote's keydown drives — so you can reproduce and hunt down focus bugs
   using just your own phone, without any pairing or second device. */
function setRemoteTestMode(on){
  document.body.classList.toggle('remote-test-on', !!on);
}

function wireRemoteTestPad(){
  const rtl = () => document.getElementById('html-root').getAttribute('dir') === 'rtl';
  const map = {
    'rtp-up':'ArrowUp', 'rtp-down':'ArrowDown', 'rtp-left':'ArrowLeft', 'rtp-right':'ArrowRight',
    'rtp-ok':'Enter', 'rtp-back':'Escape',
  };
  Object.keys(map).forEach(id => {
    const btn = document.getElementById(id);
    if(!btn) return;
    btn.addEventListener('click', () => {
      if(navigator.vibrate) navigator.vibrate(10);
      handleRemoteKey(map[id], rtl());
    });
  });
  const closeBtn = document.getElementById('rtp-close');
  if(closeBtn) closeBtn.addEventListener('click', () => {
    state.settings.remoteTestMode = false;
    saveSettings();
    renderSettings();
    setRemoteTestMode(false);
  });
}

function handleRemoteKey(k, rtl, ev){
  if(state.screen === 'player' && playerKeyHandler(k, rtl, ev)) return true;
  if(state.screen === 'player') showPlayerUI();
  if(k === 'Escape' || k === 'Backspace' || k === 'GoBack'){
    if(window.lsGateBack && window.lsGateBack()) return true;
    hideNavInfoPanel(true);
    if(ctxIsOpen()){ closeCtxMenu(); return true; }
    // Close whichever modal-like overlay is open first, instead of jumping
    // straight to exiting the player / leaving the screen.
    if(document.getElementById('chat-compose-overlay').classList.contains('show')){ closeChatCompose(); return true; }
    if(document.getElementById('startup-suggestion-overlay').classList.contains('show')){ closeStartupSuggestion(); return true; }
    if(bellMenuOpen()){ closeBellMenu(true); return true; }
    if(document.getElementById('quality-menu').classList.contains('show')){ if((state.moreView || 'main') !== 'main') openMoreView('main'); else closeQualityMenu(); return true; }
    if(state.screen === 'player') exitPlayer(); else if(state.screen === 'channel') channelBack(); else setScreen('discover');
    return true;
  }
  if(k === 'ArrowRight') moveFocus(rtl ? 'left' : 'right');
  else if(k === 'ArrowLeft') moveFocus(rtl ? 'right' : 'left');
  else if(k === 'ArrowDown') moveFocus('down');
  else if(k === 'ArrowUp') moveFocus('up');
  else if(k === 'Enter'){ REMOTE_ENTER = true; try{ activate(focusables[focusIndex]); } finally { REMOTE_ENTER = false; } }
  else return false;
  return true;
}

let lastKeyAt = 0;
document.addEventListener('keydown', (e) => {
  const k = e.key;
  if(k === 'Enter' && lpKeyDown(e)){ e.preventDefault(); return; }
  if(e.repeat){ const n = performance.now(); if(n - lastKeyAt < 90){ e.preventDefault(); return; } lastKeyAt = n; } else { lastKeyAt = performance.now(); }
  const rtl = document.getElementById('html-root').getAttribute('dir') === 'rtl';
  KEY_REPEAT = !!e.repeat;
  if(handleRemoteKey(k, rtl, e)) e.preventDefault();
});

/* ---------- Long-press options menu (hold OK on the remote, or press-and-hold on touch) ---------- */
const CTX_SEL = '.card, .vod-card:not(.dl-card), .clip-card, .lib-card';
const CTX = { el:null, from:null, info:null, fired:false, timer:null, touchTimer:null, swallow:false };
function ctxIsOpen(){ const m = document.getElementById('ctx-menu'); return !!(m && m.classList.contains('show')); }
function ctxTarget(el){ return el && el.closest ? el.closest(CTX_SEL) : null; }
function lpKeyDown(e){
  if(ctxIsOpen() || state.screen === 'player') return false;
  const el = focusables[focusIndex];
  if(!el || !ctxTarget(el) || el.matches('.dl-card')) return false;
  if(e.repeat) return true;                         // held: wait for the timer / key-up
  clearTimeout(CTX.timer);
  CTX.el = el; CTX.fired = false;
  CTX.timer = setTimeout(() => { CTX.fired = true; openCtxMenu(el); }, 600);
  return true;
}
document.addEventListener('keyup', (e) => {
  if(e.key !== 'Enter' || !CTX.el) return;
  clearTimeout(CTX.timer);
  const el = CTX.el, fired = CTX.fired;
  CTX.el = null; CTX.fired = false;
  if(fired || ctxIsOpen()){ e.preventDefault(); return; }   // long press already opened the menu
  REMOTE_ENTER = true; try{ activate(el); } finally { REMOTE_ENTER = false; }
});
function ctxPressStart(e){
  const el = ctxTarget(e.target);
  if(!el || el.matches('.dl-card') || state.screen === 'player') return;
  clearTimeout(CTX.touchTimer);
  CTX.touchTimer = setTimeout(() => { CTX.swallow = true; openCtxMenu(el); }, 650);
}
function ctxPressEnd(){ clearTimeout(CTX.touchTimer); }
document.addEventListener('touchstart', ctxPressStart, { passive:true });
document.addEventListener('mousedown', ctxPressStart);
['touchend','touchmove','touchcancel','mouseup','mouseleave','dragstart'].forEach(n => document.addEventListener(n, ctxPressEnd, { passive:true }));
document.addEventListener('click', (e) => { if(CTX.swallow){ CTX.swallow = false; e.stopPropagation(); e.preventDefault(); } }, true);
document.addEventListener('contextmenu', (e) => {
  const el = ctxTarget(e.target);
  if(el && state.screen !== 'player'){ e.preventDefault(); if(!ctxIsOpen()) openCtxMenu(el); }
});

function ctxInfo(el){
  const info = { el, ar: state.settings.lang === 'ar', channel:'', kind:'channel', id:'', source:'', key:'', live:false, inLib:false, title:'' };
  if(el.classList.contains('lib-card')){
    const it = state.library.find(x => x.key === el.dataset.lib);
    if(it){ info.channel = it.channel; info.kind = it.type; info.id = it.id; info.source = it.source || ''; info.key = it.key; info.inLib = true; info.title = it.title || ''; }
  } else if(el.classList.contains('vod-card')){
    info.channel = el.dataset.vodChannel; info.kind = 'vod'; info.id = el.dataset.vod; info.source = decodeURIComponent(el.dataset.vodSource || '');
  } else if(el.classList.contains('clip-card')){
    info.channel = el.dataset.clipChannel; info.kind = 'clip'; info.id = el.dataset.clip; info.source = decodeURIComponent(el.dataset.clipSource || '');
  } else {
    info.channel = el.dataset.channel; info.kind = 'channel'; info.live = !!el.querySelector('.badge.live');
  }
  if(!info.title){ const te = el.querySelector('.lib-title, .vod-title, .clip-title, .cat'); info.title = (te ? te.textContent : '').trim(); }

function openCtxMenu(el){
  const m = document.getElementById('ctx-menu'); if(!m) return;
  const I = ctxInfo(el); if(!I.channel) return;
  CTX.from = el; CTX.info = I;
  const T = I.ar ? {
    live:'تشغيل البث المباشر', vod:'تشغيل الفيديو', clip:'تشغيل المقطع', chan:'عرض القناة', kick:'فتح على كِك (للتصويت والنقاط)',
    follow:'متابعة القناة', unfollow:'إلغاء المتابعة', block:'لا توصي بهذه القناة', unblock:'إعادة التوصية بهذه القناة',
    rm:'حذف من السجل' } : {
    live:'Play live', vod:'Play video', clip:'Play clip', chan:'View channel', kick:'Open on Kick (voting & points)',
    follow:'Follow channel', unfollow:'Unfollow', block:"Don't recommend this channel", unblock:'Recommend this channel again',
    rm:'Remove from history' };
  const items = [];
  if(I.kind === 'live' || (I.kind === 'channel' && I.live)) items.push(['play', T.live]);
  else if(I.kind === 'vod') items.push(['play', T.vod]);
  else if(I.kind === 'clip') items.push(['play', T.clip]);
  items.push(['chan', T.chan]);
  items.push(['kick', T.kick]);
  const isFollowing = state.favorites.indexOf(I.channel) >= 0;
  items.push([isFollowing ? 'favdel' : 'favadd', isFollowing ? T.unfollow : T.follow]);
  items.push([isBlocked(I.channel) ? 'unblock' : 'block', isBlocked(I.channel) ? T.unblock : T.block]);
  if(I.inLib) items.push(['rm', T.rm, 'danger']);
  // Title: channel avatar + full channel name, with the clip / video title as a second line
  const sub = (I.title && I.title !== I.channel) ? I.title : '';
  document.getElementById('ctx-title').innerHTML =

  const setAv = (url) => {
    const a = document.getElementById('ctx-av'); if(!a) return;
    a.innerHTML = url ? `<img src="${url}" alt="">` : escapeHtml(I.channel.slice(0,1).toUpperCase());
  };
  const cachedAv = state.avatarCache[I.channel.toLowerCase()];
  setAv(cachedAv || null);
  if(cachedAv === undefined){ getChannelAvatar(I.channel).then(u => { if(u && CTX.info === I) setAv(u); }).catch(() => {}); }
  document.getElementById('ctx-list').innerHTML = items.map(x => `<div class="ctx-item ${x[2] || ''}" data-nav tabindex="-1" data-act="${x[0]}">${x[1]}</div>`).join('');
  m.classList.add('show');
  refreshFocusables(document.querySelector('#ctx-list .ctx-item'));
}
function closeCtxMenu(){
  const m = document.getElementById('ctx-menu'); if(!m) return;
  m.classList.remove('show');
  CTX.swallow = false;
  const el = CTX.from; CTX.from = null;
  refreshFocusables(el && document.body.contains(el) ? el : undefined);
}
(function(){
  const cm = document.getElementById('ctx-menu');
  if(cm) cm.addEventListener('click', e => { if(e.target === cm) closeCtxMenu(); });
})();
function ctxAction(act){
  const I = CTX.info; if(!I) return;
  const ar = I.ar;
  closeCtxMenu();
  if(act === 'kick'){ window.open('https://kick.com/' + encodeURIComponent(I.channel), '_blank', 'noopener'); return; }
  if(act === 'play'){
    if(I.kind === 'vod') playVod(I.id, I.channel, encodeURIComponent(I.source || ''));
    else if(I.kind === 'clip') playClip(I.id, I.channel, encodeURIComponent(I.source || ''));
    else playChannel(I.channel);
    return;
  }
  if(act === 'chan'){ openChannelPage(I.channel); return; }
  if(act === 'favadd'){ addFavorite(I.channel); dlToast(ar ? 'تمت المتابعة' : 'Followed', { hide:2500 }); return; }
  if(act === 'favdel'){ removeFavorite(I.channel); dlToast(ar ? 'تم إلغاء المتابعة' : 'Unfollowed', { hide:2500 }); return; }
  if(act === 'block'){ setBlocked(I.channel, true); dlToast(ar ? 'لن نوصي بهذه القناة' : "Won't recommend this channel", { hide:2500 }); return; }
  if(act === 'unblock'){ setBlocked(I.channel, false); dlToast(ar ? 'رجعت التوصيات لهذه القناة' : 'Recommendations restored', { hide:2500 }); return; }
  if(act === 'rm'){
    state.library = state.library.filter(x => x.key !== I.key); libSave();
    renderLibrary();
    dlToast(ar ? 'تم الحذف من السجل' : 'Removed from history', { hide:2500 });
    return;
  }
}
/* ---------- Screens ---------- */
function setScreen(name, opts){
  opts = opts || {};
  const keepEl = opts.keepFocus ? focusables[focusIndex] : null;
  state.screen = name;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.navbtn').forEach(b => b.classList.remove('active'));
  const target = name === 'player' ? document.getElementById('player-screen')
                                    : document.getElementById('screen-'+name);
  if(target) target.classList.add('active');
  if(isLibScreen(name)){ const lb = document.getElementById('nav-lib'); if(lb && name !== 'notifications') lb.dataset.screen = name; state.libTab = name; }
  document.querySelectorAll('.libtab').forEach(b => b.classList.toggle('active', b.dataset.screen === name));
  const navBtn = navBtnFor(name);
  if(navBtn) navBtn.classList.add('active');
  document.getElementById('app').classList.toggle('player-active', name === 'player');
  // Lets CSS tell a plain collapsed-sidebar notif dot from the full badge
  // count (shown once the notifications screen itself is open) without any
  // extra JS — see .notif-badge rules.
  document.getElementById('app').dataset.screen = name;

  if(name === 'discover') loadDiscover(); else teardownSpotlight();
  if(name === 'favorites') renderFavorites();
  if(name === 'downloads') renderDownloads();
  if(name === 'library') renderLibrary();
  if(name !== 'player') state.returnScreen = null;
  if(name === 'search') renderKeyboard();
  if(name === 'notifications'){ renderNotifPanel(); markAllNotifsRead(); startNotifTimeRefresh(); }
  else stopNotifTimeRefresh();
  if(name !== 'player'){
    destroyNativePlayer();
    document.getElementById('player-iframe-wrap').innerHTML = '';
  }
  if(keepEl){
    refreshFocusables(keepEl);
  } else {
    // Land focus on the new screen's own first item, not the sidebar.
    // The old behaviour (focusIndex = 0) always landed on the FIRST
    // sidebar button (Search), and applyFocus()'s "focus resting on a
    // sidebar item -> open that screen" logic would then immediately
    // fire and flip state.screen back to 'search' — silently undoing
    // whatever screen this call just set. That hit every plain
    // setScreen() call with no explicit keepFocus, including app boot
    // (setScreen(state.settings.defaultScreen)) and the D-pad Back
    // handler, which is why the app always ended up on Search no
    // matter what "default screen on launch" was set to, and why the
    // sidebar was visibly expanded over the search keyboard before any
    // input — focus was starting on the Search button by accident.
    const targetId = name === 'player' ? 'player-screen' : 'screen-'+name;
    const firstContentEl = (name === 'search' && document.querySelector('#keyboard .key')) || document.querySelector(`#${targetId} [data-nav], #${targetId} .card, #${targetId} .key`);
    // The screen may have no content yet (e.g. Discover still loading its
    // first fetch) — fall back to THIS screen's own sidebar button, not
    // index 0, which is always Search regardless of which screen we're
    // actually switching to and would trip the same revert-to-search bug.
    const navBtnForScreen = navBtnFor(name);
    const fallbackEl = firstContentEl || navBtnForScreen;
    if(fallbackEl){
      refreshFocusables(fallbackEl);
    } else {
      focusIndex = 0;
      refreshFocusables();
    }
  }
}

/* ---------- Discover (needs API token) ---------- */
state.lastError = null;

const KICK_API_FN = '/.netlify/functions/kick-api';
// Kick's app token and client secret live only on the server (Netlify).
// getToken() stays as a truthy sentinel so existing call sites keep working.
async function getToken(){ return 'server'; }
async function kickApi(path, query){
  const qs = (typeof query === 'string') ? query : new URLSearchParams(query || {}).toString();
  const url = KICK_API_FN + '?p=' + path + (qs ? '&' + qs : '') +
    (state.clientId ? '&client_id=' + encodeURIComponent(state.clientId) : '');
  return fetch(url);
}

function skeletonRows(rows, perRow){
  rows = rows || 3; perRow = perRow || 3;
  const card = '<div class="sk-card"><div class="sk-thumb sk-shimmer"></div><div class="sk-line sk-shimmer"></div></div>';
  const row = '<div class="row sk-row"><div class="sk-title sk-shimmer"></div><div class="hrow">' + card.repeat(perRow) + '</div></div>';
  return '<div aria-hidden="true">' + row.repeat(rows) + '</div>';
}

async function loadDiscover(){
  const container = document.getElementById('discover-rows');
  teardownSpotlight();
  const token = await getToken();
  if(!token){
    container.innerHTML =
      `<div class="empty"><div class="big">${t('noApiTitle')}</div>
       ${t('noApiBody')}
       ${state.lastError ? `<div class="debug">Debug: ${state.lastError}</div>` : ''}
       </div>`;
    refreshFocusables();
    return;
  }
  container.innerHTML = skeletonRows(3, 3);
  try{
    const limit = Math.max(state.settings.discoverLimit || 24, 100);   // v52: wide pool for Home rows (Following / Gaming / May be liked)
    let q = `sort=viewer_count&limit=${limit}`;
    if(state.settings.languageFilter) q += `&language=${state.settings.languageFilter}`;
    const res = await kickApi('livestreams', q);
    if(!res.ok){ const txt = await res.text().catch(()=> ''); throw new Error('HTTP ' + res.status + ' ' + txt.slice(0,160)); }
    const data = await res.json();
    let list = data.data || [];
    if(state.settings.hideMature) list = list.filter(s => !s.has_mature_content);
    list = list.filter(s => !isBlocked(s.slug));
    state.lastStreams = list;
    try{ list.forEach(x => noteLang(x.slug, x.language)); }catch(e){}
    if(!list.length){
      container.innerHTML = `<div class="empty">${t('noStreams')}</div>`;
      refreshFocusables(); return;
    }
    container.innerHTML = buildDiscoverRows(list);
    fadeInEl(container);
  }catch(err){
    container.innerHTML = `<div class="empty">${t('loadFail')}<div class="debug">Debug: ${err && err.message ? err.message : err}</div></div>`;
  }
  refreshFocusables();
}

// v52: shared helpers — gray hashtags inside titles + a set of channels already shown on Home (to avoid repeats between rows)
let HOME_SHOWN = new Set();
function tagsGray(title){
  try{ return String(title == null ? '' : title).replace(/(^|\s)(#[^\s#]+)/g, '$1<span class="ci-tags">$2</span>'); }catch(e){ return title || ''; }
}
function buildDiscoverRows(list){
  HOME_SHOWN = new Set();
  const pool = list.map(s => ({
    channel: s.slug, title: s.stream_title,
    cat: s.category ? s.category.name : '',
    viewers: s.viewer_count, thumb: extractThumb(s),
    tags: Array.isArray(s.tags) ? s.tags.slice(0, 2).map(x => String(x).replace(/\s+/g, '').toLowerCase()) : [],
  }));
  const streams = pool.slice(0, Math.max(Math.min(state.settings.discoverLimit || 24, 100), 12));   // top rows keep the user's limit

  // Spotlight: one full-bleed rotating hero over the top streams overall
  // (already sorted by viewers by the API), with a synced thumbnail rail.
  const spotlightStreams = streams.slice(0, 6);
  const heroRow = spotlightHtml(spotlightStreams);

  // group the rest into category shelves (Netflix-style genre rows), ordered by row size
  const byCat = {};
  streams.forEach(s => {
    const key = s.cat || t('otherCategory');
    (byCat[key] = byCat[key] || []).push(s);
  });
  const catRows = Object.keys(byCat)
    .filter(cat => byCat[cat].length >= 2)
    .sort((a,b) => byCat[b].length - byCat[a].length)
    .slice(0, 8)
    .map(cat => `<div class="row">
        <div class="row-title"><span>${cat}</span><span class="row-count">${byCat[cat].length}</span></div>
        <div class="hrow">${byCat[cat].map(s => cardHtml({...s, live:true})).join('')}</div>
      </div>`);

  // The spotlight's own JS state (rotation timer, live-preview) is wired up
  // once its markup is actually in the DOM — see initSpotlight().
  requestAnimationFrame(() => initSpotlight(spotlightStreams));

  const homeClips = `<div class="row" id="home-clips">
      <div class="row-title"><span>${CLIPS_LOGO}${t('clipsTitle')}</span></div>
      <div class="hrow" id="home-clips-hrow" aria-hidden="true"><div class="sk-card"><div class="sk-thumb sk-shimmer"></div><div class="sk-line sk-shimmer"></div></div><div class="sk-card"><div class="sk-thumb sk-shimmer"></div><div class="sk-line sk-shimmer"></div></div><div class="sk-card"><div class="sk-thumb sk-shimmer"></div><div class="sk-line sk-shimmer"></div></div></div>
    </div>`;
  requestAnimationFrame(() => loadHomeClips(list));

  return heroRow + recommendedRow(streams) + followingLiveRow(pool) + homeClips + continueWatchingRow() + gamingRow(pool) + mayLikeRow(pool);
}

// Home row: videos/clips you stopped in the middle (from the watch history)
function continueWatchingRow(){
  try{
    const items = (state.library || []).filter(it => it && it.type !== 'live' && it.dur > 30 && it.pos > 15 && it.pos < it.dur - 15).slice(0, 14);
    if(!items.length) return '';
    const esc = (x) => String(x || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const cards = items.map(it => {
      const tag = it.type === 'vod' ? t('libVod') : t('libClip');
      const letter = esc((it.channel || '?').slice(0, 1).toUpperCase());
      const pct = Math.min(100, Math.max(1, Math.round(it.pos / it.dur * 100)));
      let cat = it.cat || '';
      if(!cat){ try{ const ls = (state.lastStreams || []).find(x => x.slug && it.channel && x.slug.toLowerCase() === String(it.channel).toLowerCase()); if(ls && ls.category) cat = ls.category.name || ''; }catch(e){} }
      const ttl = tagsGray(esc(it.title || ''));
      return `<div class="lib-card" data-nav tabindex="-1" data-lib="${esc(it.key)}">
        <div class="thumb">
          <span class="lib-tag">${esc(tag)}</span>
          ${it.thumb ? `<img src="${esc(it.thumb)}" loading="lazy" onerror="this.style.display='none'">` : `<div class="fallback-tile">${letter}</div>`}
          <div class="lib-prog"><i style="width:${pct}%"></i></div>
        </div>
        <div class="card-info">
          <div class="ci-name">${esc(it.channel)}</div>
          ${cat ? `<div class="ci-cat">${esc(cat)}</div>` : ''}
          ${ttl ? `<div class="ci-title">${ttl}</div>` : ''}
        </div>
      </div>`;
    }).join('');
    return `<div class="row" id="home-continue"><div class="row-title"><span>${t('contTitle')}</span></div><div class="hrow">${cards}</div></div>`;
  }catch(e){ return ''; }
}

// Home row: live streams picked for you — followed + watched channels first, then your main language (with a share of the second one)
function recommendedRow(streams){
  try{
    if(!streams || !streams.length) return '';
    const pf = langProfile();
    const fav = new Set((state.favorites || []).map(x => String(x).toLowerCase()));
    const hist = new Set(); (state.library || []).slice(0, 30).forEach(x => x && x.channel && hist.add(String(x.channel).toLowerCase()));
    (state.watchHistory || []).slice(-40).forEach(x => x && x.channel && hist.add(String(x.channel).toLowerCase()));
    const score = s => {
      const k = String(s.channel).toLowerCase(), l = chanLang(k);
      return (fav.has(k) ? 1000 : 0) + (hist.has(k) ? 500 : 0) + (l === pf.pri ? 200 : (l === pf.sec ? 200 * (1 - pf.share) : 0)) + Math.log10((s.viewers || 0) + 10) * 20;
    };
    const picks = streams.filter(s => !isBlocked(s.channel)).slice().sort((a, b) => score(b) - score(a)).slice(0, 12);
    if(picks.length < 3) return '';
    picks.forEach(s => HOME_SHOWN.add(String(s.channel).toLowerCase()));
    return `<div class="row" id="home-recommended"><div class="row-title"><span>${t('recTitle')}</span></div><div class="hrow">${picks.map(s => cardHtml({ ...s, live:true, info:true })).join('')}</div></div>`;
  }catch(e){ return ''; }
}


const GAMING_LOGO = '<svg class="gaming-logo" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M7 6h10a5 5 0 0 1 4.9 4.1l.9 5a3.2 3.2 0 0 1-5.6 2.5L15.4 16H8.6l-1.8 1.6a3.2 3.2 0 0 1-5.6-2.5l.9-5A5 5 0 0 1 7 6zm0 3v1.5H5.5v1.5H7v1.5h1.5V12H10v-1.5H8.5V9zm8.5 1a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm2.5 2a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/></svg>';
const NON_GAME_CATS = /just chatting|irl|music|podcast|casino|slots|gambling|asmr|sports|talk|chatting|pools|variety|creative|art|fitness|travel|cooking|دردشة|موسيقى|كازينو/i;

// Home row: followed channels that are live right now (small red dot on each card)
// v52: followed channels outside the top streams list are looked up directly (small channels used to be missing)
function followingLiveRow(streams){
  try{
    const fav = new Set((state.favorites || []).map(x => String(x).toLowerCase()));
    if(!fav.size) return '';
    const inList = (streams || []).filter(s => fav.has(String(s.channel).toLowerCase()) && !isBlocked(s.channel)).slice(0, 12);
    const have = new Set(inList.map(s => String(s.channel).toLowerCase()));
    const missing = Array.from(fav).filter(f => !have.has(f) && !isBlocked(f));
    inList.forEach(s => HOME_SHOWN.add(String(s.channel).toLowerCase()));
    if(missing.length) requestAnimationFrame(() => loadMissingFollowing(inList, missing));
    if(!inList.length && !missing.length) return '';
    return `<div class="row" id="home-following"${inList.length ? '' : ' style="display:none"'}><div class="row-title"><span>${t('followTitle')}</span></div><div class="hrow" id="home-following-hrow">${inList.map(s => cardHtml({ ...s, live:true, info:true })).join('')}</div></div>`;
  }catch(e){ return ''; }
}
async function loadMissingFollowing(inList, missing){
  try{
    const token = await getToken(); if(!token) return;
    const res = await kickApi('channels', missing.slice(0, 50).map(c => 'slug=' + encodeURIComponent(c)).join('&'));
    if(!res.ok) return;
    const data = await res.json();
    const extra = (data.data || []).filter(ch => ch && ch.slug && ch.stream && ch.stream.is_live).map(ch => ({
      channel: ch.slug, title: ch.stream_title || ch.stream.stream_title || '',
      cat: ch.category ? ch.category.name : '', viewers: ch.stream.viewer_count,
      thumb: extractThumb(ch.stream) || extractThumb(ch.category) || null,
      tags: Array.isArray(ch.stream.tags) ? ch.stream.tags.slice(0, 2).map(x => String(x).replace(/\s+/g, '').toLowerCase()) : [],
    }));
    if(!extra.length) return;
    const box = document.getElementById('home-following'), hrow = document.getElementById('home-following-hrow');
    if(!box || !hrow) return;
    const all = inList.concat(extra).sort((a, b) => (b.viewers || 0) - (a.viewers || 0)).slice(0, 16);
    hrow.innerHTML = all.map(s => cardHtml({ ...s, live:true, info:true })).join('');
    box.style.display = '';
    if(state.screen === 'discover') refreshFocusables(focusables[focusIndex]);
  }catch(e){}
}

// Home row: game categories only (everything that is not chatting / IRL / music / casino…)
function gamingRow(streams){
  try{
    const picks = (streams || []).filter(s => s.cat && !NON_GAME_CATS.test(s.cat) && !isBlocked(s.channel) && !HOME_SHOWN.has(String(s.channel).toLowerCase())).slice(0, 12);
    if(picks.length < 2) return '';
    picks.forEach(s => HOME_SHOWN.add(String(s.channel).toLowerCase()));
    return `<div class="row" id="home-gaming"><div class="row-title"><span>${GAMING_LOGO}${t('gamingTitle')}</span></div><div class="hrow">${picks.map(s => cardHtml({ ...s, live:true, info:true })).join('')}</div></div>`;
  }catch(e){ return ''; }
}

// Home row: "You May be liked" — streams in the same category as a followed / watched channel, each with a reason line
function mayLikeRow(streams){
  try{
    if(!streams || !streams.length) return '';
    const low = x => String(x).toLowerCase();
    const fav = (state.favorites || []).map(low);
    const hist = []; (state.library || []).slice(0, 30).forEach(x => x && x.channel && hist.push(low(x.channel)));
    const catOf = {}; streams.forEach(s => { catOf[low(s.channel)] = s.cat; });
    const shown = new Set(HOME_SHOWN);
    const used = new Set(fav.concat(hist).concat(Array.from(shown)));
    const picks = [];
    streams.forEach(s => {
      const k = low(s.channel);
      if(used.has(k) || isBlocked(s.channel) || !s.cat) return;
      const f = fav.find(x => catOf[x] && catOf[x] === s.cat);
      if(f){ picks.push({ ...s, reason: `${t('becauseFollow')} ${f}` }); return; }
      const h = hist.find(x => catOf[x] && catOf[x] === s.cat);
      if(h) picks.push({ ...s, reason: `${t('similarTo')} ${h}` });
    });
    const out = picks.slice(0, 12);
    // v52 fallback: nothing matched your followed / watched categories? fill with other popular streams you haven't seen on Home
    if(out.length < 12){
      const got = new Set(out.map(x => low(x.channel)));
      streams.forEach(s => {
        if(out.length >= 12) return;
        const k = low(s.channel);
        if(got.has(k) || used.has(k) || isBlocked(s.channel)) return;
        got.add(k); out.push({ ...s });
      });
    }
    if(out.length < 2) return '';
    return `<div class="row" id="home-maylike"><div class="row-title"><span>${t('mayLikeTitle')}</span></div><div class="hrow">${out.map(s => cardHtml({ ...s, live:true, info:true })).join('')}</div></div>`;
  }catch(e){ return ''; }
}

// Warm-up: while the Home screen loads, quietly fetch the first clips' playlists
// (same route the player will use) so the proxy/CDN connection is already open when a clip is pressed.
function warmClips(clips){
  try{
    if(window.__clipWarm) return;
    window.__clipWarm = true; setTimeout(() => { window.__clipWarm = false; }, 120000);
    (clips || []).slice(0, 4).forEach((c, i) => {
      if(!c || !c.source || /\.(mp4|webm|mov)(\?|#|$)/i.test(c.source)) return;
      let pref = 'direct'; try{ pref = localStorage.getItem('livescreen_clip_route') || 'direct'; }catch(e){}
      const u = (state.proxyWorkerUrl && pref !== 'direct') ? (state.proxyWorkerUrl + '/proxy?url=' + encodeURIComponent(c.source)) : c.source;
      setTimeout(() => { fetch(u, { cache:'force-cache' }).then(r => r.text()).catch(() => {}); }, 400 + i * 700);
    });
  }catch(e){}
}

// Home: most-viewed clips from the top live channels + your followed channels.
async function loadHomeClips(list){
  const paint = (clips) => {
    const r = document.getElementById('home-clips-hrow'), box = document.getElementById('home-clips');
    if(!r || !box) return;
    if(!clips.length){ box.style.display = 'none'; return; }
    r.innerHTML = clips.map(c => clipCardHtml(c, c.channel)).join('');
    r.removeAttribute('aria-hidden');
    fadeInEl(r);
    if(state.screen === 'discover') refreshFocusables(focusables[focusIndex]);
  };
  const C = state.homeClips;
  if(C && C.list.length && Date.now() - C.t < 120000){ paint(C.list); warmClips(C.list); return; }
  if(C && C.list.length) paint(C.list);          // show the old ones instantly while fresh ones load
  const chans = [];
  (list || []).slice(0, 8).forEach(x => { const sl = x.slug || x.channel; if(sl && !chans.includes(sl)) chans.push(sl); });
  (state.favorites || []).slice(0, 4).forEach(f => { if(!chans.includes(f)) chans.push(f); });
  // newest first: clips of the last days (by views); if a channel has none, fall back to its usual list
  const getFresh = async (ch) => {
    let cl = await fetchChannelClips(ch, '?sort=view&time=day').catch(() => []);
    if(cl.length < 3){ const w = await fetchChannelClips(ch, '?sort=view&time=week').catch(() => []); if(w.length > cl.length) cl = w; }
    if(!cl.length) cl = await fetchChannelClips(ch).catch(() => []);
    return cl.slice(0, 6).map(c => ({ ...c, channel: ch }));
  };
  const res = await Promise.all(chans.map(getFresh));
  const seen = new Set(), all = [];
  const ts = c => { const d = Date.parse(c.createdAt || ''); return isFinite(d) ? d : 0; };
  res.flat().sort((a, b) => {
    const ra = (Date.now() - ts(a)) < 2 * 86400000, rb = (Date.now() - ts(b)) < 2 * 86400000;
    if(ra !== rb) return ra ? -1 : 1;                       // clips from the last 2 days first
    return (b.views || 0) - (a.views || 0);
  }).forEach(c => { if(!seen.has(c.id)){ seen.add(c.id); all.push(c); } });
  const out = all.slice(0, 20);
  if(out.length) state.homeClips = { t: Date.now(), list: out };
  paint(out.length ? out : ((C && C.list) || []));
  warmClips(out);
}

/* ---------- Spotlight (Netflix-TV-style rotating hero) ----------
   A single full-bleed banner that automatically cycles through the top
   live streams — crossfading the backdrop, then quietly waking up into
   a real (muted, silent) live preview once a slide has settled, exactly
   like the row-card hover preview above but for the hero itself. A
   thumbnail rail underneath stays in sync, highlighting whichever
   stream is currently up. D-pad focus (or mouse hover) pauses rotation
   so browsing the banner never fights the remote. */
let spotlightData = [];
let spotlightIndex = 0;
let spotlightTimer = null;
let spotlightVideoTimer = null;
let spotlightHls = null;
let spotlightPaused = false;
const SPOTLIGHT_SLIDE_MS = 7000;
const SPOTLIGHT_VIDEO_DELAY_MS = 2200;

function teardownSpotlight(){
  clearInterval(spotlightTimer); spotlightTimer = null;
  clearTimeout(spotlightVideoTimer); spotlightVideoTimer = null;
  if(spotlightHls){ try{ spotlightHls.destroy(); }catch(e){} spotlightHls = null; }
  spotlightData = []; spotlightIndex = 0; spotlightPaused = false;
}

function spotlightHtml(streams){
  if(!streams.length) return '';
  return `<div class="row spotlight-row">
      <div class="spotlight" id="spotlight" data-nav tabindex="-1">
        <div class="spotlight-bg">
          <img class="spot-img spot-img-a" loading="eager">
          <img class="spot-img spot-img-b" loading="eager">
          <video class="spot-video" muted playsinline loop></video>
        </div>
        <div class="spotlight-grad"></div>
        <div class="spotlight-content">
          <div class="spotlight-badge-live">${t('live')}</div>
          <div class="spotlight-name" id="spotlight-name"></div>
          <div class="spotlight-meta" id="spotlight-meta"></div>
          <div class="spotlight-desc" id="spotlight-desc"></div>
          <button class="spotlight-watch-btn" id="spotlight-watch-btn" tabindex="-1">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <span>${t('watch')}</span>
          </button>
        </div>
        <div class="spotlight-dots" id="spotlight-dots"></div>
      </div>
    </div>`;
}

function initSpotlight(streams){
  teardownSpotlight();
  const spotEl = document.getElementById('spotlight');
  if(!spotEl || !streams || !streams.length) return;
  spotlightData = streams;

  const dotsEl = document.getElementById('spotlight-dots');
  if(dotsEl) dotsEl.innerHTML = spotlightData.map((_,i) => `<span class="dot${i===0?' active':''}"></span>`).join('');

  renderSpotlightSlide(0, true);

  const watchBtn = document.getElementById('spotlight-watch-btn');
  if(watchBtn) watchBtn.addEventListener('click', e => {
    e.stopPropagation();
    const cur = spotlightData[spotlightIndex];
    if(cur) playChannel(cur.channel);
  });
  spotEl.addEventListener('click', () => {
    const cur = spotlightData[spotlightIndex];
    if(cur) playChannel(cur.channel);
  });
  spotEl.addEventListener('mouseenter', () => { spotlightPaused = true; });
  spotEl.addEventListener('mouseleave', () => { spotlightPaused = false; });

  startSpotlightRotation();
}

function startSpotlightRotation(){
  clearInterval(spotlightTimer);
  if(spotlightData.length < 2) return;
  spotlightTimer = setInterval(() => {
    if(spotlightPaused) return;
    spotlightIndex = (spotlightIndex + 1) % spotlightData.length;
    renderSpotlightSlide(spotlightIndex);
  }, SPOTLIGHT_SLIDE_MS);
}

function renderSpotlightSlide(i, immediate){
  const s = spotlightData[i];
  const spotEl = document.getElementById('spotlight');
  if(!s || !spotEl) return;

  clearTimeout(spotlightVideoTimer); spotlightVideoTimer = null;
  if(spotlightHls){ try{ spotlightHls.destroy(); }catch(e){} spotlightHls = null; }
  const videoEl = spotEl.querySelector('.spot-video');
  if(videoEl){ videoEl.classList.remove('show'); videoEl.removeAttribute('src'); }

  // Crossfade between the two stacked <img> layers so the swap never pops.
  const imgA = spotEl.querySelector('.spot-img-a');
  const imgB = spotEl.querySelector('.spot-img-b');
  if(immediate){
    imgA.src = s.thumb || ''; imgA.classList.add('show');
    imgB.classList.remove('show');
  } else {
    const showingA = imgA.classList.contains('show');
    const nextImg = showingA ? imgB : imgA;
    const prevImg = showingA ? imgA : imgB;
    nextImg.src = s.thumb || '';
    nextImg.classList.add('show');
    prevImg.classList.remove('show');
  }

  spotEl.dataset.channel = s.channel;
  const viewersTxt = s.viewers!=null ? `${fmtCompact(s.viewers)} ${t('viewersSuffix')}` : '';
  const nameEl = document.getElementById('spotlight-name');
  const metaEl = document.getElementById('spotlight-meta');
  const descEl = document.getElementById('spotlight-desc');
  if(nameEl) nameEl.textContent = s.channel;
  if(metaEl) metaEl.textContent = [s.cat, viewersTxt].filter(Boolean).join(' \u00B7 ');
  if(descEl) descEl.textContent = s.title || '';

  const dotsEl = document.getElementById('spotlight-dots');
  if(dotsEl) Array.from(dotsEl.children).forEach((d, idx) => d.classList.toggle('active', idx === i));

  // Let the slide settle for a beat, then quietly bring it to life with the
  // real stream — same trick as the row cards' focus preview, just for the hero.
  spotlightVideoTimer = setTimeout(async () => {
    if(spotlightData[spotlightIndex] !== s) return;
    let info;
    try{ info = await fetchPlaybackInfo(s.channel); }catch(e){ return; }
    if(spotlightData[spotlightIndex] !== s) return;
    if(!info || !info.isLive || !info.playbackUrl) return;
    const video = spotEl.querySelector('.spot-video');
    if(!video) return;
    if(window.Hls && Hls.isSupported()){
      spotlightHls = new Hls({ maxBufferLength:8, capLevelToPlayerSize:true });
      spotlightHls.loadSource(info.playbackUrl);
      spotlightHls.attachMedia(video);
      spotlightHls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(()=>{}));
    } else if(video.canPlayType('application/vnd.apple.mpegurl')){
      video.src = info.playbackUrl;
      video.play().catch(()=>{});
    }
    video.classList.add('show');
  }, SPOTLIGHT_VIDEO_DELAY_MS);
}

function setupAutoRefresh(){
  clearInterval(state.refreshTimer);
  const secs = state.settings.refreshInterval;
  if(secs > 0){
    state.refreshTimer = setInterval(() => {
      if(state.screen === 'discover') loadDiscover();
    }, secs * 1000);
  }
}

function fadeInEl(el){
  if(!el) return;
  el.classList.remove('fade-in');
  void el.offsetWidth; // force reflow so the animation restarts every time
  el.classList.add('fade-in');
}

// A self-contained (no network needed) stand-in stream thumbnail, used only by
// the "send a test notification" button so it previews the real card layout
// instead of always falling back to the plain letter tile.
function demoThumbDataUri(){
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180">'
    + '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">'
    + '<stop offset="0%" stop-color="#ff5a3c"/><stop offset="100%" stop-color="#59101c"/>'
    + '</linearGradient></defs>'
    + '<rect width="320" height="180" fill="url(#g)"/>'
    + '<circle cx="160" cy="90" r="20" fill="rgba(255,255,255,.16)"/>'
    + '<path d="M153 80 L174 90 L153 100 Z" fill="#fff"/>'
    + '</svg>';
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

function extractThumb(s){
  const th = s && s.thumbnail;
  if(!th) return null;
  if(typeof th === 'string') return th;
  if(th.url) return th.url;
  if(th.src) return th.src;
  if(th.responsive){
    const first = String(th.responsive).split(',')[0].trim().split(' ')[0];
    return first || null;
  }
  if(th.srcset){
    const first = String(th.srcset).split(',')[0].trim().split(' ')[0];
    return first || null;
  }
  return null;
}

function cardHtml({channel, title, cat, viewers, thumb, live, offline, removable, hero, avatar, tags, reason, info}){
  const viewersTxt = viewers!=null ? `${fmtCompact(viewers)} ${t('viewersSuffix')}` : '';
  const letter = (channel||'?').slice(0,1).toUpperCase();
  // No live thumbnail (channel is offline)? Show the streamer's own logo instead
  // of a plain letter tile when we have it cached, same as Kick does.
  const imgSrc = thumb || avatar;
  const isAvatarThumb = !thumb && !!avatar;
  return `<div class="card${hero?' hero':''}${info?' with-info':''}" data-nav tabindex="-1" data-channel="${channel}" >
    <div class="thumb${isAvatarThumb ? ' thumb-avatar' : ''}">
      ${imgSrc

/* ---------- Favorites ---------- */
function renderFavorites(){
  const grid = document.getElementById('fav-grid');
  const empty = document.getElementById('fav-empty');
  // NOTE: this used to replace grid.outerHTML with a fresh grid *plus* a
  // brand-new ".empty" sibling every time the list was empty. Each call
  // (e.g. removing the last channel, then re-entering this screen, which
  // also calls renderFavorites) left the *previous* ".empty" message
  // behind as an orphaned sibling, so the text visibly duplicated. A
  // single persistent #fav-empty node that we just show/hide fixes that.
  if(!state.favorites.length){
    grid.innerHTML = '';
    if(empty){ empty.textContent = t('noFav'); empty.style.display = 'block'; }
    refreshFocusables();
    return;
  }
  if(empty) empty.style.display = 'none';
  // Render immediately with placeholders, then fill in real thumb/live/viewers below.
  grid.innerHTML = state.favorites.map(ch => cardHtml({channel:ch, removable:true})).join('');
  refreshFocusables();
  loadFavoritesDetails();
}

async function loadFavoritesDetails(){
  if(!state.favorites.length) return;
  const token = await getToken();
  if(!token) return;
  const myFavSnapshot = state.favorites.slice();
  try{
    const qs = myFavSnapshot.map(c => 'slug=' + encodeURIComponent(c)).join('&');
    const res = await kickApi('channels', qs);
    if(!res.ok) return;
    const data = await res.json();
    const bySlug = {};
    (data.data || []).forEach(ch => { if(ch.slug) bySlug[ch.slug.toLowerCase()] = ch; });
    // bail if favorites changed (added/removed) while this request was in flight
    if(state.screen !== 'favorites') return;
    if(state.favorites.length !== myFavSnapshot.length || state.favorites.some((c,i)=>c!==myFavSnapshot[i])) return;
    const grid = document.getElementById('fav-grid');
    if(!grid) return;
    const offlineChannels = [];
    grid.innerHTML = state.favorites.map(ch => {
      const info = bySlug[ch.toLowerCase()];
      const isLive = !!(info && info.stream && info.stream.is_live);
      offlineChannels.push(ch);                        // v47: every followed channel shows its logo
      return cardHtml({
        channel: ch, removable:true,
        live: isLive, offline: !isLive,
        viewers: isLive ? info.stream.viewer_count : null,
        cat: info && info.category ? info.category.name : '',
        thumb: null,                                   // v47: always the channel logo (grey dot = offline, red dot = live)
        avatar: state.avatarCache[ch.toLowerCase()] || null,
      });
    }).join('');
    fadeInEl(grid);
    refreshFocusables();
    // Offline channels have no live thumbnail — fetch their logo in the
    // background (once per channel, cached) and swap it in for the plain
    // letter tile as each one arrives, without re-rendering the whole grid.
    offlineChannels.forEach(ch => {
      const key = ch.toLowerCase();
      if(key in state.avatarCache) return;
      getChannelAvatar(ch).then(avatar => {
        if(!avatar || state.screen !== 'favorites') return;
        const card = document.querySelector(`#fav-grid .card[data-channel="${CSS.escape(ch)}"] .thumb`);
        if(!card || card.querySelector('img')) return;
        const fallback = card.querySelector('.fallback-tile');
        if(fallback){
          card.classList.add('thumb-avatar');
          fallback.insertAdjacentHTML('beforebegin',
            `<img src="${avatar}" loading="lazy" style="object-fit:contain;background:var(--surface-2);"
              onerror="this.remove(); this.nextElementSibling.style.display='flex'; this.closest('.thumb').classList.remove('thumb-avatar');">`);
          fallback.style.display = 'none';
        }
      });
    });
  }catch(err){ /* best-effort — placeholders stay as-is on failure */ }
}

function addFavorite(ch){
  if(!state.favorites.includes(ch)){
    state.favorites.push(ch);
    localStorage.setItem('livescreen_favorites', JSON.stringify(state.favorites));

function removeFavorite(ch){
  state.favorites = state.favorites.filter(c => c!==ch);
  localStorage.setItem('livescreen_favorites', JSON.stringify(state.favorites));

}

/* ---------- Notification bell + full-screen list (persistent history, unread counter) ---------- */
state.notifications = [];     // persistent history: {id, ch, ts, read}
state.notifTimeRefreshTimer = null;

function addNotification(ch){
  if(typeof bellLevel === 'function' && bellLevel(ch) === 'none') return;
  state.notifications.unshift({ id: Date.now() + '-' + Math.random(), ch, ts: Date.now(), read:false });
  if(state.notifications.length > 30) state.notifications.length = 30;
  renderNotifBell();
  if(state.screen === 'notifications') renderNotifPanel();
}

function unreadNotifCount(){
  return state.notifications.filter(n => !n.read).length;
}

function renderNotifBell(){
  const badge = document.getElementById('notif-badge');
  const bell = document.getElementById('nav-lib');
  if(!badge || !bell) return;
  const n = unreadNotifCount();
  badge.textContent = n > 9 ? '9+' : String(n);
  badge.classList.toggle('show', n > 0);
  document.querySelectorAll('.notif-badge-tab').forEach(b => { b.textContent = n > 9 ? '9+' : String(n); b.classList.toggle('show', n > 0); });
  if(n > 0){
    bell.classList.remove('ring');
    void bell.offsetWidth; // restart the CSS animation
    bell.classList.add('ring');
  }
}

// Relative time (just now / X min ago / X h ago / yesterday / X d ago)
// instead of a fixed HH:MM stamp — kept current by startNotifTimeRefresh()
// re-rendering every 30s while the notifications screen is open.
function formatNotifTime(ts){
  const min = Math.floor((Date.now() - ts) / 60000);
  if(min < 1) return t('notifJustNow');
  if(min < 60) return t('notifMinAgo').replace('{n}', min);
  const hr = Math.floor(min / 60);
  if(hr < 24) return t('notifHourAgo').replace('{n}', hr);
  const day = Math.floor(hr / 24);
  if(day === 1) return t('notifYesterday');
  return t('notifDaysAgo').replace('{n}', day);
}

function renderNotifPanel(){
  const list = document.getElementById('notif-list');
  const empty = document.getElementById('notif-empty');
  if(!list || !empty) return;
  if(!state.notifications.length){
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  list.innerHTML = state.notifications.map(n => `
    <div class="notif-item${n.read ? '' : ' unread'}" data-nav tabindex="-1" data-channel="${n.ch}">
      <span class="dot">\u{1F534}</span>
      <div class="notif-text">
        <div class="notif-ch">${n.ch} ${t('isLiveNow')}</div>
        <div class="notif-time">${formatNotifTime(n.ts)}</div>
      </div>
      <button class="notif-del" data-nav tabindex="-1" data-notif-del="${n.id}" aria-label="${t('notifDeleteOne')}">&#10005;</button>
    </div>`).join('');
}

function markAllNotifsRead(){
  state.notifications.forEach(n => n.read = true);
  renderNotifBell();
}

function deleteNotification(id){
  state.notifications = state.notifications.filter(n => String(n.id) !== String(id));
  renderNotifBell();
  renderNotifPanel();
  refreshFocusables();
}

function clearAllNotifs(){
  state.notifications = [];
  renderNotifBell();
  renderNotifPanel();
}

function startNotifTimeRefresh(){
  stopNotifTimeRefresh();
  state.notifTimeRefreshTimer = setInterval(() => {
    if(state.screen === 'notifications') renderNotifPanel();
  }, 30000);
}

function stopNotifTimeRefresh(){
  clearInterval(state.notifTimeRefreshTimer);
  state.notifTimeRefreshTimer = null;
}

/* ---------- In-app "favorite went live" alerts (top-right preview cards) ----------
   The bell hides for as long as any toast is on screen. Each toast auto-dismisses
   after 3s (or on manual close) by flying up into the bell; only at that moment
   does it become a real entry in the notification panel and bump the unread count. */
state.knownLiveStatus = {};   // channel(lowercase) -> last known is_live
state.liveAlerts = [];        // channels currently shown as a toast
state.liveAlertData = {};     // channel -> {thumb, cat, viewers}
state.liveAlertTimers = {};
state.leavingAlerts = new Set(); // channels currently mid "flying into the bell"

// The bell hides itself while a toast is sitting on screen (so it doesn't look
// like it's ringing for something the user hasn't seen yet), but it comes back
// the moment that toast starts flying into it, so the "swallow" is visible.
function updateBellVisibility(){
  const bell = document.getElementById('nav-lib');
  if(!bell) return;
  const stillShowing = state.liveAlerts.some(c => !state.leavingAlerts.has(c));
  bell.classList.toggle('toast-active', stillShowing);
}

// Called once a toast has actually landed: snaps the lid shut and rings the bell.
function bellSwallow(){
  const bell = document.getElementById('nav-lib');
  if(!bell) return;
  bell.classList.remove('eating');
  bell.classList.remove('ring');
  void bell.offsetWidth; // restart the CSS animation
  bell.classList.add('ring');
}

function liveAlertHtml(ch){
  const info = state.liveAlertData[ch] || {};
  const viewersTxt = info.viewers != null
    ? `${fmtCompact(info.viewers)} ${t('viewersSuffix')}` : '';
  const letter = (ch || '?').slice(0,1).toUpperCase();
  return `<div class="live-alert" data-channel="${ch}">
    <div class="live-alert-thumb">
      ${info.thumb
        ? `<img src="${info.thumb}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"><div class="fallback-tile" style="display:none;">${letter}</div>`
        : `<div class="fallback-tile">${letter}</div>`}
      <div class="grad"></div>
      <span class="badge dot live" title="${t('live')}"></span>
      <span class="close" data-close="${ch}">\u2715</span>
      <div class="meta">
        <div class="name">${ch}</div>
        ${info.title ? `<div class="cat">${info.title}</div>` : ''}
      </div>
      ${viewersTxt ? `<span class="viewers">${viewersTxt}</span>` : ''}
    </div>
  </div>`;
}

function renderLiveAlerts(){
  const wrap = document.getElementById('live-alerts');
  if(!wrap) return;
  wrap.innerHTML = state.liveAlerts.map(liveAlertHtml).join('');
}

function dismissLiveAlert(ch){
  if(!state.liveAlerts.includes(ch)) return;
  if(state.liveAlertTimers[ch]){
    clearTimeout(state.liveAlertTimers[ch]);
    delete state.liveAlertTimers[ch];
  }
  const wrap = document.getElementById('live-alerts');
  const el = wrap && wrap.querySelector(`.live-alert[data-channel="${CSS.escape(ch)}"]`);
  let done = false; // guards against the safety-net timer AND animationend both firing
  const finish = () => {
    if(done) return;
    done = true;
    state.liveAlerts = state.liveAlerts.filter(c => c !== ch);
    state.leavingAlerts.delete(ch);
    delete state.liveAlertData[ch];
    if(el && el.parentNode) el.parentNode.removeChild(el);
    addNotification(ch);
    updateBellVisibility();
    bellSwallow();          // lid snaps shut, bell rings
  };
  if(el){
    state.leavingAlerts.add(ch);
    updateBellVisibility();  // reveal the bell right away so its lid can open
    const bell = document.getElementById('nav-lib');
    if(bell){
      bell.classList.add('eating');
      // Aim the toast's fly-away at wherever the bell really sits now
      // (inside the sidebar) instead of the old fixed top-right corner.
      const br = bell.getBoundingClientRect(), er = el.getBoundingClientRect();
      el.style.setProperty('--fly-x', ((br.left + br.width/2) - (er.left + er.width/2)) + 'px');
      el.style.setProperty('--fly-y', ((br.top + br.height/2) - (er.top + er.height/2)) + 'px');
    }
    el.classList.add('leaving');
    el.addEventListener('animationend', finish, { once:true });
    setTimeout(finish, 950); // safety net in case animationend never fires
  }else{
    finish();
  }
}

function pushLiveAlert(ch, info){
  if(typeof bellLevel === 'function' && bellLevel(ch) === 'none') return;
  if(state.liveAlerts.includes(ch)) return;
  state.liveAlertData[ch] = info || {};
  state.liveAlerts.push(ch);
  // Append only the new toast — re-rendering the whole list here would wipe out
  // (and orphan) any toast that's already mid-flight into the bell.
  const wrap = document.getElementById('live-alerts');
  if(wrap) wrap.insertAdjacentHTML('beforeend', liveAlertHtml(ch));
  updateBellVisibility();
  state.liveAlertTimers[ch] = setTimeout(() => dismissLiveAlert(ch), 3000);
}

/* ---------- Startup "favorites are live" suggestion — a centered card that dims the
   home screen behind it for 5s, naming up to 2 live favorites (+ "and more") ---------- */
// Renders the single-channel startup suggestion card: the most-viewed live
// favorite gets the thumbnail/viewers/name + Watch button, and any other live
// favorites show up as a small overlapping avatar stack ("+N more") beneath it.
function renderStartupSuggestion(channels){
  if(!channels || !channels.length) return;
  const overlay = document.getElementById('startup-suggestion-overlay');
  const title = document.getElementById('startup-suggestion-title');
  const img = document.getElementById('startup-suggestion-img');
  const fallback = document.getElementById('startup-suggestion-fallback');
  const streamTitleEl = document.getElementById('startup-suggestion-stream-title');
  const viewersEl = document.getElementById('startup-suggestion-viewers');
  const nameEl = document.getElementById('startup-suggestion-name');
  const othersEl = document.getElementById('startup-suggestion-others');
  const watchBtn = document.getElementById('startup-suggestion-watch');
  if(!overlay || !title || !nameEl || !watchBtn) return;

  const sorted = channels.slice().sort((a,b) => (b.viewers||0) - (a.viewers||0));
  const top = sorted[0];
  const others = sorted.slice(1);

  title.textContent = t(sorted.length > 1 ? 'startupSuggestionMany' : 'startupSuggestionOne');
  // Main heading is back to the channel name (the title already shows next to the viewers count).
  nameEl.textContent = top.slug;
  const goWatchTop = () => { closeStartupSuggestion(); playChannel(top.slug); };
  nameEl.onclick = goWatchTop;
  watchBtn.textContent = t('watch');
  watchBtn.onclick = goWatchTop;

  if(streamTitleEl) streamTitleEl.textContent = top.title || '';
  viewersEl.textContent = top.viewers != null
    ? `${fmtCompact(top.viewers)} ${t('viewersSuffix')}` : '';
  fallback.textContent = (top.slug || '?').slice(0,1).toUpperCase();
  if(top.thumb){
    img.src = top.thumb; img.style.display = 'block'; fallback.style.display = 'none';
  }else{
    img.removeAttribute('src'); img.style.display = 'none'; fallback.style.display = 'flex';
  }

  const shownOthers = others.slice(0, 3);
  const extra = others.length - shownOthers.length;
  othersEl.innerHTML = shownOthers.length
    ? '<div class="ss-avatars">'
      + shownOthers.map(c => `<div class="ss-avatar" title="${c.slug}">${(c.slug||'?').slice(0,1).toUpperCase()}</div>`).join('')
      + '</div>' + (extra > 0 ? `<span class="ss-more">${t('suggestMore')} (+${extra})</span>` : '')
    : '';

  overlay.classList.remove('show');
  void overlay.offsetWidth; // restart the 5s countdown bar animation
  overlay.classList.add('show');
  clearTimeout(state.ssTimer);
  state.ssTimer = setTimeout(() => closeStartupSuggestion(), 5000);
  refreshFocusables();
}

function closeStartupSuggestion(){
  const overlay = document.getElementById('startup-suggestion-overlay');
  if(!overlay) return;
  clearTimeout(state.ssTimer);
  overlay.classList.remove('show');
  refreshFocusables();
}

async function showStartupFavoritesToast(){
  if(!state.favorites.length) return;

  try{

    const res = await kickApi('channels', qs);
    if(!res.ok) return;
    const data = await res.json();
    const liveChannels = (data.data || [])
      .filter(ch => ch.stream && ch.stream.is_live)
      .map(ch => ({
        slug: (ch.slug || '').toLowerCase(),
